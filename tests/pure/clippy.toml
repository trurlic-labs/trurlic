# What the code index (src/code/) may not reach: the file system, the
# environment, processes, threads, the clock, the network and the
# standard streams of std, and the store's types that read and write.
# `tests/lints.rs` runs clippy over the library with this configuration
# and refuses every finding in src/code/; the rest of the crate is the
# shell and is not held to it. It is never the crate's own clippy.toml.

disallowed-methods = [
    { path = "std::fs::read", reason = "the file system" },
    { path = "std::fs::read_to_string", reason = "the file system" },
    { path = "std::fs::write", reason = "the file system" },
