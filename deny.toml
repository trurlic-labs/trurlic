[advisories]
# cargo-deny 0.22 narrowed the default to direct dependencies; an
# unmaintained crate anywhere in the graph still fails the check.
unmaintained = "all"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
skip = [
    { crate = "bitflags@1.3.2", reason = "notify 6 (through inotify 0.9) pins it; it leaves with notify" },
    { crate = "windows-sys@0.48.0", reason = "notify 6 and its mio 0.8 pin it; it leaves with notify" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
