[advisories]
# cargo-deny 0.22 narrowed the default to direct dependencies; an
# unmaintained crate anywhere in the graph still fails the check.
unmaintained = "all"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "CC0-1.0",
    # foldhash, through the `preserve_order` feature of the serde_json that
    # tree-sitter's build script reads its grammar metadata with: a
    # permissive license, OSI approved, with no notice owed in a binary.
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The vendored tree-sitter runtime is a path dependency with no version, so
# that no build takes the unpatched one from crates.io; trurlic is not
# published, which is when cargo-deny admits it.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
