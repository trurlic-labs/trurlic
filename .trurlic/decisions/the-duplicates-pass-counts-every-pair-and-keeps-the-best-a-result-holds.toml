component = "lint"
choice = "The duplicates pass counts every pair it finds and keeps only the best a result can hold, by a bounded selection over a total order, on any number of threads"
reason = "A graph whose decisions share one text has a pair for every two of them, half a million at a thousand decisions, while a status result holds a few hundred. So the pass offers each pair to a bounded selection, a heap that keeps the smallest keys of the order score descending, then the two decisions by name, and counts every offer; status requests the budget over the smallest duplicate finding there can be, and apply's nearest for three. The key order is total, so the kept pairs are the same whichever order the pairs come in, which lets the probes run on the thread pool, each task with its own selection, merged after. The section's total and omitted come from the count, every pair among the decisions the pass compared. Tests hold the kept pairs to the exact test's best on a graph whose every decision shares every term, and the result to the same one on one thread and eight with the bound stopping the probes."
alternatives = [
    "Collect every pair, then fit: rejected because memory and time grow with the pairs, not with the result",
    "A fixed count of pairs: rejected because the count a result holds follows from the budget and the size of a finding",
    "Keep the pairs of the earliest probes and page by probe: rejected because the first page then lists the decisions that sort first, not the strongest pairs, and its count is the page's alone",
]
