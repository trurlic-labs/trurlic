component = "lint"
choice = "The duplicates pass counts every pair and keeps only the best a result can hold, by a bounded selection over a total order, on any number of threads"
reason = "A graph whose decisions share one text has a pair for every two of them, half a million at a thousand decisions, while a status result holds a few hundred. So the pass offers each pair to a bounded selection, a heap that keeps the smallest keys of the order score descending, then the two decisions by name, and counts every offer; status requests the budget over the smallest duplicate finding there can be, and apply's nearest for three. The key order is total, so the kept pairs are the same whichever order the pairs come in, which lets the probes run on the thread pool, each task with its own selection, merged after. The section's total and omitted come from the count."
alternatives = [
    "Collect every pair, then fit: rejected because memory and time grow with the pairs, not with the result",
    "A fixed count of pairs: rejected because the count a result holds follows from the budget and the size of a finding",
]
