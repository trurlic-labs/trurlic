[decision]
component = "project"
choice = "Pure-Rust TLS via rustls, no OpenSSL dependency"
reason = "reqwest is configured with default-features = false and rustls-tls feature. blake3 is pure Rust. No dependency in the tree requires a C compiler or system OpenSSL. This ensures the binary compiles on any Rust target without system library prerequisites, simplifying CI and cross-compilation."
alternatives = [
    "Use reqwest with default features (native-tls/OpenSSL) — rejected because it adds a system dependency, complicates cross-compilation, and increases supply-chain risk",
    "Use ureq instead of reqwest for a simpler HTTP client — rejected because reqwest's async support and streaming are needed for SSE-based LLM API responses",
]
tags = [
    "dependencies",
    "security",
]
attribution = "user"
