component = "discovery"
choice = "Discovery runs git only when the walk found no graph and the first .git above is a file; a tree that holds its graph spawns no process, and git never runs inside a graph"
reason = """
serve finds the graph on every tool call, so discovery is on the per-call path. Where the walk finds the graph (a tree with its own .trurlic, a symlinked clone) no process is spawned; measured with the release binary on WSL2, trurlic status costs the same there as in a clone, about 2.8 ms, and two git processes, about 1 ms each, are added in a linked worktree of a shared graph. Only a linked worktree can reach a graph the walk did not see, and every linked worktree has a .git file at its top, so a .git directory (a main worktree) or none needs no git; a submodule or a --separate-git-dir repository also has a .git file and costs the two processes for no graph. A directory inside a graph directory finds it in the walk before any git, and the placement facts are asked of the directory that holds the graph, so git never answers for a graph kept in a repository of its own. tests/integration/placement.rs runs status and serve with no git on PATH in a tree and inside its graph.
"""
alternatives = [
    "Ask git on every call: rejected because the walk already answered for every tree but a linked worktree, and a process per tool call is the cost serve should not pay",
    "Read the .git file and the commondir file directly: rejected because that reimplements git's discovery, its gitdir files, commondir and separate git directories",
    "Cache the answer between calls: rejected because no process holds state between calls, and a cached answer would miss a new or moved graph",
]
