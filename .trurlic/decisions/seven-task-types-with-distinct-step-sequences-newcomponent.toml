choice = "Seven task types with distinct step sequences: NewComponent, Feature, Fix, Learn, Review, Harden, Bootstrap"
reason = "Task-driven orchestration adapts to developer intent rather than requiring mode selection. Each task type defines a fixed sequence of steps with preconditions and postconditions, making the workflow predictable and testable. Task types cover the full lifecycle: creation, modification, debugging, learning, auditing, hardening, and autonomous extraction."
