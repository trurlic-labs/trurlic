    "Single generic workflow for all tasks — rejected because different intents require different step sequences (a fix needs ImpactCheck, a learn needs SummaryGate, a bootstrap skips Socratic dialogue)",
    "Open-ended step selection by the agent — rejected because it would break determinism and make the advance contract untestable",
]
