component = "code"
choice = "A TypeScript or JavaScript declaration, its members, a function or class bound to a name and a name a module binds are definitions; an import, a local and an unnamed scope's own define nothing"
reason = "An anchor names what a reader looks for in a TypeScript or JavaScript file. A function, a generator, an overload's or an ambient declaration's signature, and an arrow function, function expression or class expression a const, let or var binds are functions or classes at any depth, as a nested def is in Python; so is a named class expression an assignment binds (module.exports = class A {}). A class, interface, type alias, enum and namespace are definitions; namespace A.B is two segments and declare module \"x\" is named x. A class's methods, accessors and constructor are methods and its properties fields; an interface's members are fields and methods, an enum's variants. Any other name a const, let or var binds, each of a destructuring's names included, is a variable at a module's or a namespace's top, whatever its keyword: a JavaScript const is a binding that is never reassigned, not a compile-time constant, and a function's locals are no definitions. A function, method or class no name stands for (a callback, module.exports = () => {}, an object's method no const holds, an unnamed class expression) is an unnamed scope: its locals define nothing, its functions are under the definition around it, and with none around it nothing it holds is defined. An import names what another file defines. Definitions of one path resolve together: overloads with their implementation, a getter and its setter, merged interfaces. A constructor's parameter property, an exports.x or X.prototype.y assignment define nothing."
alternatives = [
    "Constant for a const at a module's top: rejected because a const binds any runtime value, and let and var would then name the same thing two ways",
    "A kind of their own for getters, setters and constructors: rejected because each is a method the class holds, as a Python property is",
    "Variables at any depth: rejected because a function's locals are no part of what a module offers",
    "module.exports = class {} named default: rejected because CommonJS has no default name a reader spells, and the class's members would then read as an API no import names",
]
