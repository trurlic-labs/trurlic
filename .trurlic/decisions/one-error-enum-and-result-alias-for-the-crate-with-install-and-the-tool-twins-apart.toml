component = "project"
choice = "One Error enum and Result alias serve every module and command; install returns its InstallError and a tool's twin the tool's ToolError, and main reports all three alike"
reason = "Every module and every command but install uses the one Error enum (src/error.rs, thiserror) and Result<T>; there is no store error of its own. A failure that comes from a file names it: Error::Io and Error::Toml carry the path, and no From impl converts std::io::Error or a toml error, so a ? cannot drop the path; Error::io(path) and Error::toml(path) are the adapters, and an I/O call with no file behind it is Error::System, naming the call. A case a caller branches on is a variant with typed fields, never a sentence to parse. The error module imports types from store alone, so no arrow runs back up from it. install never opens a store, and its own failures (no home directory, a binary path that is not UTF-8, a missing or failing claude CLI) belong in no match on Error, so commands::install returns InstallError, though its I/O is the crate's. InstallError wraps Error for that I/O instead of carrying Io and System variants of its own, which would duplicate the path-carrying variants and their adapters. A tool's CLI twin, and trurlic map, return the tool's ToolError, so a command refuses as the call does. Error has a variant for neither. main sends each command group's result to report, generic over Display, so every command fails alike: error and its message on stderr, exit status 1."
alternatives = [
    "Per-module error types with conversions: rejected because the crate is one binary and the indirection buys nothing",
    "anyhow for ad-hoc errors: rejected because a caller matches on a typed error and cannot match on a message",
    "A GitError of the git module that Error wraps: rejected because Error would then name a module other than store, and a public variant cannot hold a crate-private type",
    "An Error::Install variant, or install's failures as plain variants of Error: rejected because error would depend on commands, and every match on Error would need arms for failures only install has",
    "A cli-level enum over the three errors, or Box<dyn std::error::Error>: rejected because it is a third type, or an erasure of two, whose only job is Display",
]
