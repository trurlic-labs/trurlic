component = "mcp"
choice = "The MCP server delegates every disk write to the store's Writer and never touches a file under .trurlic/"
reason = """
A write tool runs on a Writer the dispatch begins for the call: SpecTool::call hands a spec-built tool whose Access is Write the Writer of Store::begin_write, which holds the exclusive lock and the graph loaded under it, validates, commits through the journal and keeps its graph equal to disk. apply is the one write tool: its handler turns the parsed arguments into a store::Batch and calls Writer::apply, which holds every rule; status, get_context and get_decisions_for_file are reads on Store::load_state. The MCP module parses arguments and builds the JSON result but never opens a file under .trurlic/, so the store stays the single authority for disk mutations and no tool bypasses its atomic write guarantees.
"""
alternatives = [
    "The MCP module writes TOML files directly: rejected because it would bypass the atomic writes, the file lock and validation in the store",
    "A separate write layer between MCP and the store: rejected because the Writer already is the right abstraction",
]
