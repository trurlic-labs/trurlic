[decision]
component = "mcp"
choice = "MCP server delegates all disk writes to the store's Writer, never writes directly"
reason = "Every write tool runs on a Writer the dispatch begins for the call: call_unspecified for the tools that predate specs, and SpecTool::call for a spec-built tool whose Access is Write. The Writer holds the exclusive lock and the graph loaded under it, validates the graph, performs atomic writes (serialize, verify the round trip, stage, journal, rename) and keeps its graph equal to disk. The MCP module parses arguments and builds the JSON result, but never touches a file under .trurlic/, so the store stays the single authority for disk mutations and no tool bypasses its atomic write guarantees."
alternatives = [
    "MCP module writes TOML files directly — rejected: would bypass atomic write guarantees, file locking, and graph validation in Store",
    "Separate write layer between MCP and Store — rejected: unnecessary indirection when Store already provides the correct abstraction",
]
tags = [
    "data-integrity",
    "module-boundary",
]
attribution = "user"
created = "2026-06-15T09:44:59.411657570Z"

