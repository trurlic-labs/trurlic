component = "store"
choice = "repair_anchors takes listed repairs, each checked in order, or a map from stale anchor to repair; the patterns judge the anchors a repair brings, a refusal naming the decision; the store reads no code"
reason = "The store imports no code index and runs no project git, so which anchor repairs which is the caller's. A listed repair is held to what every op is held to: the decision exists, it holds from, from and to are anchors by the anchor rules, and to differs from from, each refusal naming repairs[j] and the part at fault; an empty list is no_repair. A map is applied where the op runs to every decision ever accepted that holds a key, so a planned anchor is never moved, and a key no decision holds is passed over. A repair to an anchor the decision holds already drops the stale one rather than refusing. A repair never grows a decision's list, so the limits on the whole list are not judged. Each decision a repair changed is kept for the patterns with the anchors it gained alone, and judged with every other write once the ops have run and the batch's pattern work is charged. A refusal names that decision as the op's node, and the repair that brought the anchor when the caller listed it, else the anchors field. A change of anchors leaves the status alone. Applied::repaired lists each anchor replaced."
alternatives = [
    "Refuse a repair to an anchor the decision holds already: rejected because every repair the tree shows would then fail on a decision that held both",
    "Judge a repaired decision on its whole list: rejected because one decision already past anchors_max, or one holding an anchor a pattern refuses, would block every repair of the tree",
    "Withhold in the store a map's repair the bar refuses and write the rest: rejected because the verdict is needed while the ops run, before the batch's pattern work is charged",
    "Let the store compute the repairs: rejected because store imports only error, console and git for its own repository",
]
tags = [
    "anchors",
    "apply",
]
