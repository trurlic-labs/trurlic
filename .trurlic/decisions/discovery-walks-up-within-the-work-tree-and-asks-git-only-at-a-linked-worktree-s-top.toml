component = "discovery"
choice = "Discovery walks up within the cwd's work tree, taking a .trurlic, a symlink followed, and stopping at the first .git; only a .git file with no graph found runs git, one worktree list"
reason = "A graph serves the work tree it sits in, and serve finds it on every tool call, so the walk is on the per-call path. Under tracked every worktree checks out its own graph, so a linked worktree nested in the main one, on a branch without a graph, must find none instead of reading and writing the main checkout's; under shared the main worktree's graph serves each linked worktree. So the walk takes the .trurlic of each directory, a symlink followed for a clone or a copy outside the repository, at two metadata calls a directory, and stops at the first .git. A directory there is the top of a main worktree or of a repository cloned inside another project's tree, whose graph above is not its own, so the walk ends with none. A file is the top of a linked worktree or a submodule, the one place a graph the walk cannot see may serve: one git worktree list, read from the common dir, names the main worktree, whose graph serves when it states shared, and a submodule pays that process for no graph. A tree that holds its graph, a symlinked clone and a directory inside a graph spawn no process, and a tree with no git is walked to the root. A graph directory is passed through to its tree, and discovery never runs git inside one, where the graph's own repository would answer."
alternatives = [
    "Walk to the root and ask git last: rejected because a nested linked worktree then reads and writes the main checkout's graph, and its code root is the main tree",
    "Stop only at a .git file: rejected because a repository cloned inside a project would read that project's graph as its own",
    "Ask git on every call, or for the top first: rejected because a process per tool call is the cost serve should not pay, and a symlinked clone or a graph outside any repository has no git answer",
    "Read the .git file and the commondir file directly: rejected because that reimplements git's discovery, its gitdir files, commondir and separate git directories",
    "Cache the answer between calls: rejected because no process holds state between calls, and a cached answer would miss a new or moved graph",
]
