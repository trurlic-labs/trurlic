[decision]
component = "provider"
choice = "SSE (Server-Sent Events) as universal streaming transport"
reason = "All providers stream responses via SSE over HTTP. A single `stream_sse` function in sse.rs handles the chunked byte stream, line buffering, and SSE protocol parsing (data: prefixes, [DONE] markers, comment lines). Provider-specific JSON extraction is injected via a function pointer (`extract: fn(&str) -> Option<String>`), keeping the SSE machinery shared. This means one implementation of timeout handling, buffer management, and error recovery serves all providers."
alternatives = [
    "WebSocket streaming — rejected because no major LLM API uses WebSocket for completions; SSE is the industry standard",
    "Provider-specific stream parsers — rejected because the SSE framing protocol is identical across all providers; only the JSON payload structure differs",
]
tags = [
    "protocol",
    "code-reuse",
]
attribution = "user"
created = "2026-06-15T09:44:30.518604187Z"
