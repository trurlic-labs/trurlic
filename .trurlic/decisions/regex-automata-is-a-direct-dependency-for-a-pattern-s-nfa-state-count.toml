component = "store"
choice = "regex-automata, the engine the regex crate builds on, is a direct dependency used for one thing: the state count of each [quality] pattern's Thompson NFA, read at compile"
reason = "The work limit of the lint section charges each pattern its bytes read times the states of its NFA, which bound what its slowest engine walks per byte. The regex crate builds that NFA inside its meta engine and exposes no part of it, so the count needs the engine's own compiler. Bar::compile builds each pattern's NFA with thompson::Compiler under the same syntax and the same size limit, and keeps states().len(). The crate is already in the build at the version regex resolves to, and the direct dependency enables only features regex enables already (std, syntax, nfa-thompson, unicode), so it brings no new crate and no new feature; the binary grows only by the call site. A write compiles the NFA too, once per pattern per batch, beside the regex itself."
alternatives = [
    "Probe the regex crate's size_limit until a pattern fails to compile: rejected because it compiles each pattern many times and measures bytes of a different program, not states",
    "Weigh a pattern by the length of its text: rejected because a short counted repetition builds a large automaton",
    "A hand-written estimate of a pattern's states from its syntax tree: rejected because it would drift from the engine that runs the pattern",
]
tags = [
