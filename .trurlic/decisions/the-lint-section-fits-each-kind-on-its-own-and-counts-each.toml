component = "mcp"
choice = "The lint section lists duplicates, then quality findings, then file-anchor-only decisions, each kind fitted to the budget on its own and counted in counts.lint"
reason = "Duplicate pairs grow with the square of the decisions and quality findings with the decisions times the rules, so in one list cut by its prefix the first kind would crowd out the others. Each kind is a part of the level search on its own, so a short kind stays whole and the long ones share the rest; the section is their kept items in kind order, its total and omitted their sums. Each kind is gathered to lint_limit of its kind, the budget over its own smallest finding, and counted whole in counts.lint, beside how far the patterns read the decisions. Its more is true of every kind: the duplicate pairs left out rank at or below the last listed; the quality findings and the decisions with only file anchors left out follow the last listed by decision name, and the section with from lists the quality findings from a decision on; they come into view as the listed ones are settled; counts.lint.patterns says which decisions the patterns did not read and how to read them. origin narrows the findings to the decisions recorded under it, a pair when either decision is."
alternatives = [
    "One list cut by its prefix: rejected because thousands of pairs would hide every quality finding",
    "A section per kind: rejected because the section argument would grow a value per kind, and the kinds share one budget anyway",
]
