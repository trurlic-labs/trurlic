component = "project"
choice = "The 0.3 map does not return: not its server with its REST and WebSocket surface, not its web UI and frontend build, not its components in the graph"
reason = "Every write goes through the store's one Writer, which apply on MCP and on the CLI reaches. A map server with REST writes, WebSocket push and a watcher of its own is a third write surface, which must keep every store contract (lock order, reload before write, text rules) in step with the other two. Its async runtime, HTTP stack, embedded TypeScript UI and Node.js toolchain would sit in every build, CI run and release, where a Rust toolchain is the only build requirement. The owner reads the graph through the agent (get_context, get_decisions_for_file), the TOML node files under .trurlic/, and trurlic status."
alternatives = [
    "Keep the 0.3 map and maintain it: rejected because a third write surface must keep the store contracts in step with MCP and the CLI, and its async runtime and Node.js toolchain sit in every build",
    "Keep the 0.3 map read-only, without its REST writes: rejected because its frontend build, its WebSocket push and its async runtime stay in every build for views the agent, the node files and status already give",
]
