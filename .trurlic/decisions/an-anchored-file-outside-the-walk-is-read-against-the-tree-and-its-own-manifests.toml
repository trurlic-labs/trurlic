component = "code"
choice = "The tree's macros, crates and test files come from the files the walk takes; an anchored Rust file outside them is read against those and the manifests above it, and adds nothing to them"
reason = "What an anchor resolves to must be a function of the tree and that anchor, never of which other anchors there are. So the facts build the tree's crates and test files once, from the walked files. A walked file's crate is read from the walked manifests alone. The shell reads, for each anchored Rust file the walk does not take, every Cargo.toml on its path, and such a file's crate is read from those and the walked ones. A manifest an anchor brings thus governs no file the walk took, a symlinked Cargo.toml beside walked files included. Each anchored file outside the walk reaches its own macros first, then its crate's, as a walked file does. It is a root or module of the test walk whose own declarations are not followed, so its macros, crate and role reach no other file. The cost is linear in the tree and the outside files. Its own unwalked crate's other files are not read, so their macros are not seen."
alternatives = [
    "Walk every unwalked directory an anchor points into: rejected because its macros would then reach the walked files and move other anchors",
    "Let every manifest read govern every file below it: rejected because anchoring a symlinked Cargo.toml then moved a walked file into another crate",
    "A view of the tree per outside file, or a crate table rebuilt per file with macros of its own: rejected because hundreds of such files took seconds",
]
