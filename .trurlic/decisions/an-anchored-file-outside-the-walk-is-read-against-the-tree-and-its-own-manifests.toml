component = "code"
choice = "The tree's macros, crates and test files come from the files the walk takes; an anchored Rust file outside them is read against those and the manifests above it, and adds nothing to them"
reason = "What an anchor resolves to must be a function of the tree and that anchor, never of which other anchors there are. When a file outside the walk, in a nested work tree for one, was read against whatever manifests happened to be anchored, its crate changed with the anchor set: alone it saw the root crate's macros, with its own Cargo.toml anchored it did not. So the shell reads, for each anchored Rust file the walk does not take, every Cargo.toml on its path, and the facts build the tree's crates, arm tables and test files once, from the walked files and those manifests, which lie in directories the walk passed over and so govern no walked file. Each anchored file outside the walk is then read against its crate's arms and its own macros, and is a root or module of the test walk whose own declarations are not followed, so its macros, crate and role reach no other file. A manifest only ever governs the files below it, so the files that share an unwalked directory read the same manifests. The cost is linear in the tree and the outside files, not a view of the tree per file. Its own unwalked crate's other files are not read, so their macros are not seen."
alternatives = [
    "Walk every unwalked directory an anchor points into: rejected because its macros would then reach the walked files and move other anchors",
    "Resolve each anchor against its own gather of the tree: rejected because the tree would be read once per anchor",
    "A view of the tree per outside file: rejected because eight hundred such files over twenty thousand modules took seconds",
]
tags = [
