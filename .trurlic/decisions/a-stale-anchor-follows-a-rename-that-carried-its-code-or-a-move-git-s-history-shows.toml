component = "lint"
choice = "A stale anchor follows a rename only when it carried its code, or a Rust symbol to the one file of its target by place that git's history shows gaining the code from the anchor's file"
reason = "A wrong repair hides the staleness it mends, so each rule gives up rather than guess. A rename is followed only when it carried the code: a symbol anchor when its symbol resolves at the new path to definitions of the kinds it named before the rename, and the rename is exact or the set hash there equals the one before; a file anchor when the rename is exact into a file that defines an item, or one of its symbol anchors was carried, and, for an inexact rename, no symbol anchor that resolved in the old file is missing at the new path. A symbol its file no longer defines is searched for: never when its file still defines its last segment or spells it in a macro invocation, never to the file a rename took its file to, only on a Rust file, as the whole path of an item no re-export, module declaration or macro gives, in another walked file of the same target by place (roles::target_of: the library, src/main.rs and every module under src are one). The one such file is the candidate. At the revision its file last held its code, the anchor's definitions must have the kinds and roles the candidate's have now, a role its own under cfg(test), else its file's in the tree. Of the commits since that changed the candidate's count of the name, the newest whose parent lacked the symbol is its gain: the commit the anchor's file lost it, or a later one when a file both commits changed wrote no such item before the loss, wrote one in it and still before the gain. A namesake that stood beside the code, or one written after it went, is no move. With no git, no search repair."
alternatives = [
    "Repair to the one file that defines the name now: rejected because a namesake that already stood beside the deleted code, another function or a test helper, would be taken for it",
    "Judge the move at the revision before the loss alone: rejected because a namesake anyone writes later in the target would be taken for code that went for good",
    "Accept a gain when any file of the target held the name before it: rejected because that file's namesake, written after the loss, would link the gain to code it never held",
    "Follow every rename git reports: rejected because a shared license header or boilerplate pairs unrelated files, and every binary resolves main",
    "Read each manifest's path keys and the module tree for the target: rejected because the place rule bounds the search and the history evidence decides, so the cost buys no repair the evidence would accept",
]
tags = [
    "anchors",
    "lint",
]
