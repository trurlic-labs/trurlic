component = "code"
choice = "In Rust a macro_rules! macro is a definition of kind macro, and no macro invocation defines anything, whatever the macro's body or the invocation's own tokens spell"
reason = "A wrong definition is worse than a missing one, and only rustc knows what an invocation produces: its matcher parses fragments with rustc's parser and edition, matches nested repetitions, scopes a macro by textual order, #[macro_use] and $crate, and transcription can rename, wrap, paste or cfg what it emits. So a definition is an item tree-sitter parsed outside every token tree, and nothing wrong is defined by construction. A token tree holds no item the walk reads (HOLD_NO_ITEMS). An anchor on what an invocation produces is stale like any other and searched for elsewhere like any other: the names an invocation's tokens hold are mostly generic, a type parameter or a test's name, so telling an anchor its name stood in an invocation misled unrelated anchors and stopped the search for code that moved. The README names what to anchor instead: the macro, an item written outside the invocation, such as a method of the type's impl, or the file."
alternatives = [
    "Emulate macro_rules! by matching each invocation against the rules its crate's macros hold: rejected because each review of the matcher found new phantom definitions, its model of fragments, scope and transcription not being rustc's, and its uncached work took seconds a call",
    "Define the items an invocation's own tokens spell: rejected because a macro may emit another item than it is handed, as a renaming or wrapping macro does and thread_local! makes a static a const",
    "Define a spelled item only where the invocation stands as an item and the macro emits its input: rejected because no rule that reads only the invocation knows what its macro emits",
    "Re-parse an invocation's token tree as items: rejected because almost no item-position tree parses alone, and one that does is still the macro's to rewrite",
    "Expand with rustc: rejected because it needs a compiler, the crate's dependencies and its cfg, far past what an anchor needs",
]
