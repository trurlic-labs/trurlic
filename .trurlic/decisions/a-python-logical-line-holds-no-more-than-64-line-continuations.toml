component = "code"
choice = "A Python file with a run of more than 64 line continuations holding no other line break is refused before the parse as TooManyContinuations"
reason = "tree-sitter-python's error recovery summarizes the stack of line_continuation extras of the logical line it is in, at a cost the parser's progress steps do not count and its lexer's budget does not see: a run of continuations inside a parse error costs the square of its length, so one run of a megabyte would take about an hour. The bound is the run's length, each backslash right before a line break counted, one ending a comment or standing in a string too, and the run ends at any other line break. Real code holds runs of at most a few dozen; past 64 a run is generated. With the bound, the worst seen at 1 MiB, error-dense runs of 64 at most, parses in about five seconds once, cold, as other error-dense input does, and the result is cached. The check runs before the parse beside the indentation bound, both rows of Python's language data, and its value enters the cache key with every other bound."
alternatives = [
    "A higher bound of 256: rejected because the cost then grows past what an error-dense file of any other shape takes, with no real file near it",
    "A smaller cap on a Python file's size: rejected because valid files of a megabyte parse in milliseconds and the cost is the run's, not the file's",
    "Count only continuations outside comments and strings: rejected because it needs a lexer of Python before the parse, and a run that long is never written by hand",
]
