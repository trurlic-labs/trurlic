reason = "A struct field and its getter share a path (Store::code_root), and a decision usually means one of them, so the grammar needs a spelling that tells them apart without a second path syntax. A trailing () is how a reader writes a call: Store::code_root() names the method or function of that path and nothing else, while Store::code_root names every kind as before. The parentheses hold nothing: a call's arguments are no part of a name, and (x) is refused as malformed, so one definition has one spelling. Whitespace before them is allowed as within a name. A trait segment is no function, so <Display>() is refused, and so is () in a kind of file with no functions (a TOML or JSON key, a Makefile target, a Markdown heading), where it would name nothing. The store's anchor rule needs no change, since it holds a symbol as text and the grammar is the index's. The format 0.5 migration still strips the (..) of a 0.4.1 code ref: 0.4.1 matched a name whatever its parentheses said, so its meaning is the bare name."
