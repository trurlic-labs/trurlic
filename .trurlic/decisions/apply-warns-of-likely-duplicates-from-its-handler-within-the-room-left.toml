component = "tools"
choice = "apply's handler, not the store, warns of likely duplicates in the graph the write left: each decision whose text the batch wrote, its three nearest, listed while the result has room"
reason = "store imports no module above it, so Writer::apply cannot call lint, and a likely duplicate is not a rule of the write. The batch is written first; the handler then releases the exclusive lock and looks for duplicates in the graph the write left, since a lookup over a large graph would hold every other reader and writer past LOCK_TIMEOUT. The lookup charges no bound: it costs at most a fixed multiple of the bytes the load read, as lint::duplicates shows. The CLI twin runs that handler too, so both surfaces warn alike. The decisions are those a record wrote or a revise changed the choice or reason of, followed through the batch's renames and dropped by a remove or a merge that absorbs them; an anchors-only revise warns of nothing. Each gets its three nearest at the threshold or above, best first. Fifty such warnings at 128-byte names exceed the 24 KiB result beside the longest ops, so the warnings fill the room the rest leaves, the repairs and stale anchors a repair_anchors op lists before them, in op order, and more_duplicates counts the others, whose pairs the status lint section ranks."
alternatives = [
    "The check in Writer::apply: rejected because store would import lint, and a warning is no rule of the write",
    "A fixed count of warnings per batch: rejected because the longest batch leaves room for none while a usual one has room for all",
    "Only the best neighbour per decision: rejected because a decision can restate two others, and the caller then sees one",
]
