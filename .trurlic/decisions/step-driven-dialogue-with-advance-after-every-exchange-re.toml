[decision]
component = "session"
choice = "Step-driven dialogue with advance-after-every-exchange re-evaluation"
reason = "After every LLM response in the design session, the driver calls `advance()` again to check if the step has changed. If decisions were extracted and recorded from the response, the graph state changes and advance may return a different step, causing an automatic step transition. This tight re-evaluation loop means the session always reflects the current graph truth — no stale step state can accumulate."
alternatives = [
    "LLM self-reports step completion — rejected: the LLM cannot reliably know when graph postconditions are met; only advance() has that logic.",
    "Fixed number of exchanges per step — rejected: different steps need different amounts of dialogue; a fixed count would be either too few or wastefully many.",
    "User manually signals step completion — rejected: adds friction and requires users to understand the step machinery.",
]
tags = [
    "data-flow",
    "interface",
]
attribution = "user"
created = "2026-06-15T09:45:27.203091214Z"
