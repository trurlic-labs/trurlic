component = "code"
choice = "A .ts, .mts or .cts file is read by tree-sitter-typescript's typescript grammar, a .tsx file and every JavaScript file by its tsx grammar, each with TypeScript's query"
reason = "tree-sitter-typescript holds two grammars. The typescript one reads <T>x as a cast, which the tsx one reads as an element, so a .ts file needs it; the tsx one reads JSX, so a .tsx file needs it. JavaScript is a subset of TSX as a grammar sees it: the tsx grammar reads plain, CommonJS and JSX JavaScript with fewer error nodes than tree-sitter-javascript and the same definitions, so a JavaScript file is read by it with TypeScript's query, and no third grammar crate is compiled into the binary. What it reads differently is valid JavaScript that spells a TypeScript form across a line break (abstract on a line of its own before a class) or a comparison chain that reads as a generic call (a < b > (c)); neither changes a definition or a token. A file kind is a grammar and its query, so TypeScript and TSX are two kinds, and a .js file shares the tsx kind with a .tsx file, since the same bytes index alike. The query is one file for both grammars, and TSX adds what only its grammar has (JSX text) in a second file read after it."
alternatives = [
    "tree-sitter-javascript for JavaScript: rejected because it is a third grammar in the binary and reads JSX with more error nodes",
    "The tsx grammar for .ts too: rejected because it reads a <T>x cast as an element",
    "A file kind per extension: rejected because a .js and a .tsx file of one content would be indexed twice under one rule",
]
