component = "code"
choice = "A tree's blank sets are fixpoints over its headers' #defines, a test place's header reaching test code alone; a file blanks the names of its set it writes, its own #defines judged with them"
reason = "A header's #define reaches every file that includes it, and which files do is a build fact the index does not read, so a header's macros are the tree's; a source file's (.c, .cc, .cpp, .cxx) reaches no other file, so a flag one defines (curl's #define DONE) never erases an enumerator of that name elsewhere. A header in a test place (tests/, test/, *_test.h) reaches test code alone: what a test's fake or stub defines, the code it tests never sees. Every other header reaches every file, a vendored library's among them, which is what this rule gives up; with clang as the oracle on six projects, redis's vendored deps among them, a rule scoped by includes changed no blank. The fixpoint is a least one over a worklist, so a cycle blanks nothing, and its work is linear in the #defines: each body is read up to MAX_MACRO_BODY_TOKENS tokens, and the #defines of one name are read into one summary that needs at most that many names, so a file's own #defines merge into the summaries of their names in work linear in its own, whatever the headers hold. A name a file defines itself is judged by its own #defines and the headers' of that name together, so a file that redefines a header's attribute as a value blanks it nowhere in itself. Every file a call reads, in the calling tree, another worktree or git's history, and a repair held again under the write lock, is judged against the calling tree's sets, made once by one function from its walk and headers; a set that changed since makes a symbol unparsable there, a missed repair, never a wrong one."
alternatives = [
    "Every file's #defines tree-wide: rejected because a flag one source file defines erases that name in every other",
    "Never blank a name the tree also defines as an enumerator, variable, function, member or type: rejected because it lost hundreds of definitions on the seven projects, where a macro and a member often share a name",
    "A header's #defines scoped to the translation units that include it, the whole set where an include is not in the tree: rejected because a generated header (config.h) puts most files of a real tree under the whole set, for an include graph read every call",
    "A file's own include closure: rejected because a header used through the one that includes it (curl's easy.h, which curl.h includes after its CURL_EXTERN) then loses its blanks",
    "Another tree's own set for its files: rejected because it needs a walk of that tree for a few anchored files",
]
