component = "lint"
choice = "Duplicate pairs come from an inverted index over every term, the pass's work counted from the postings and charged against MAX_DUPLICATE_WORK before it runs"
reason = "The postings list, per term, the decisions that hold it in order, with the term's weight there. Each decision probed reads the postings of its terms, adds the products of the weights into a scratch row sized to the graph, and puts each decision it touched to the exact threshold test with that sum, their exact dot product. A pair that shares no term is never visited, and no pair allocates. A term most decisions hold, the usual case in prose, makes the pass visit and test nearly every pair, so its cost grows with the square of the decisions. That work is known before the pass runs: the posting entries it reads, df (df - 1) / 2 per term, and PAIR_WORK for each pair it may test, at most one per entry and one per pair, the weight measured against an entry. status charges it against MAX_DUPLICATE_WORK; past it the section compares no pair and counts.lint.uncompared names the work and the bound, never a silent drop. Under an origin only the decisions recorded there are probed, each against every other decision. A test holds the pairs to the exact test over every pair on drawn graphs, and one holds the charge."
alternatives = [
    "A dot product for every pair: rejected because it merges the term lists of pairs that share nothing, many times the work of the index on the seeded corpus",
    "A prefix filter leaving each decision's commonest terms unindexed, with a Cauchy-Schwarz bound: it saved most of the pass on a graph sharing common terms, but was removed for its size, a second order, cursors and a bound on two comparisons; the charge bounds it now",
    "No bound on the pass: rejected because tens of thousands of decisions that share a few terms cost one status call minutes of CPU",
    "Locality-sensitive hashing: rejected because it can miss a pair, and the list must be the exact one",
    "A cache under .state: rejected because a read would then depend on state beside the files",
]
