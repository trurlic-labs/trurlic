component = "project"
choice = "Every module's non-test code names in the crate only itself and what its arrow of the module map in CLAUDE.md reaches, and re-exports no item of another module, held by the tests of lib.rs"
reason = "The module map in CLAUDE.md draws which module may name which, and a new arrow is a decision first. An arrow that prose alone holds breaks unseen. So each module is held by a test that reads the crate with crate::purity, which resolves every path the module's non-test code names, a use list, a chain of supers and an attribute's string included. Each module is a row of the table MAP in the tests of lib.rs, one inline in lib.rs such as bench included: the modules its arrow reaches, of mcp only run_server for commands, and Error, Result, console and failpoint where the map says the module uses them. code, lint and store, which a stricter rule of their own holds (allow lists, the order of their parts), are rows of HELD instead, each naming its own tests by path, so a deleted one fails to compile. A second test fails when the crate gains a module that neither table holds. A third refuses a re-export, a use with a visibility, of an item of another module: a caller would reach past its row through the re-exporting module, as cli reached tools through commands. The caller names the item's own module instead, which its row must list. bench alone may re-export, as the crate's surface for benches/, which no row reaches; the crate root is no module of the map. What the checks cannot see is stated once, in crate::purity. Where a row and the map disagree, the change fixes the map or removes the stray edge."
alternatives = [
    "Hold the map in CLAUDE.md alone: rejected, a re-export or a path spelled through super passes review unseen, and the gap stays until someone reads every file",
    "A test per module in its own root for a rule that is only its arrow: rejected, each is a row of the map in disguise, and nothing checks that a new module has one",
    "Keep HELD a list of module names: rejected, deleting a held module's own test then fails nothing",
    "Admit re-exports and judge a path by the module of the item it reaches: rejected, it needs name resolution across modules, where a refused re-export keeps each item's module in its spelling",
    "Hold the edges with a text search for crate:: paths: rejected, it misses a use list, a chain of supers and a root re-export, which the purity reader resolves",
]
