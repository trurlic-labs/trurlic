component = "code"
choice = "Among the definitions a symbol names, the one whose whole path it is, no segment left out, is the one it resolves to; only when none or several are is it Ambiguous"
reason = "A symbol names every definition whose path ends with it, so a module-level function open and a method Store::open are both named by open, and without a further rule no spelling names the function alone: its whole path is open, which is also a suffix of the method's. The same holds for a function and the test named after it in tests, and for a type and one of the same name in an inner module. A symbol that is a definition's whole path states exactly that definition, so among several it wins; a shorter suffix of a deeper path stays the shorthand it was, and is resolved only when it is unique. Two definitions whose whole paths are the same (a field and a method of one name, cfg-gated twins) stay Ambiguous, since no spelling tells them apart. This refines the grammar the owner set, under which every such symbol is ambiguous."
alternatives = [
    "Every symbol that names several definitions is Ambiguous: rejected because a module-level item that shares its name with any member could then be named by no symbol at all",
    "A leading :: for a path from the file's root: rejected because the whole path already is from the outermost container, and a second spelling of one path is what anchors avoid",
]
