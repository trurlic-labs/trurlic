component = "code"
choice = "A Python span hash groups statements, hashes strings and numbers by meaning, joins the strings Python joins, and leaves out docstrings, a ; between statements, and commas and parentheses of no meaning"
reason = "Python's NEWLINE, INDENT and DEDENT lie in no node, so the query marks each statement a group: a statement moved into or out of a block, or split, moves the hash; a re-indented block or a ; between statements does not. Outside a raw string an escape hashes by meaning: a quote escape as its quote, hex digits and names in any case, an octal one as three digits; a raw string's text is as written. A delimiter hashes by prefix letters in any case or order, u none, either quote; a number by letters in any case, 1. as 1.0, no + after its exponent. Parts of an implicit concatenation that start alike, no f-string or template, hash as one string. A trailing comma is left out after the last argument, parameter, import, with item or display element, and after two or more elements of a tuple, subscript or type parameter list. Parentheses are left out where Python reads the expression bare alike: a primary; the whole expression of an assignment, return, yield, del, for, condition, assert or annotation; a tuple statement; an import list; with items; a comprehension's target; a lambda's body; a conditional expression as an argument, element, value or else branch; a class's empty (); never around a yield a comma follows. The query states each slot's grammar fact: no two programs of different meaning hash alike. Still moving: strings joined into an f-string or across unlike starts, a parenthesized docstring, an escape in a format specifier, a one-element type parameter list's comma, and parentheses around a with's one item with as, a conditional expression elsewhere or a whole expression statement. An = interpolation's text is its output, as written. A docstring, a plain string alone as a class's or function's first statement, is left out."
alternatives = [
    "Hash the leaves alone, as for Rust: rejected because a statement moved out of its block would leave the hash as it was",
    "Hash docstrings: rejected because a documentation edit would read as a change to the code",
    "Leave out every comma before a closing bracket and every parenthesis: rejected because (a,) and (a), x[a,] and x[a], f((yield a), b) and f((yield a, b)) would hash alike",
    "Hash a string by its decoded value: rejected because a \\N{...} escape needs Unicode's name table, and the escapes formatters change hash alike in one spelling",
    "Hash the parse tree with parentheses transparent: rejected because tree-sitter parses await a ** b as await (a ** b), so two programs of different meaning would hash alike",
]
