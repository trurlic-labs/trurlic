component = "code"
choice = "A Python span hash groups each statement and block, takes a string's text, a format specifier and an = interpolation as one token, and leaves out docstrings and a ; between statements"
reason = "Python's NEWLINE, INDENT and DEDENT are tokens of no width in no node, so the tokens of if a: b c with c in the block and with c after it are the same, as are return x and return then x. The query marks each statement of a module or a block and each block a group, whose marks enter the hash, so moving a statement into or out of a block, or splitting one in two, moves it, while a re-indented block, a block on its header's line and two statements joined by ; do not. A string's text and a format specifier are one token each with their spaces, so a b and a  b differ, and a string's prefix is its own token. An interpolation with the = specifier is one token whole, since its output holds the text around the = as written: f'{x = }' and f'{x=}' print differently. A docstring, the first statement of a module, class or function whose one child is a string with no f, t or b prefix, documents the definition and is left out, as a Rust doc comment is; a statement that only starts with a string, \"a\", g(), is code."
alternatives = [
    "Hash the leaves alone, as for Rust: rejected because a statement moved out of its block would leave the hash as it was",
    "Hash every node's extent: rejected because a grammar's inner nodes would make the hash move on edits that change no meaning",
    "Hash docstrings: rejected because a documentation edit would read as a change to the code",
]
