component = "git"
choice = "A graph commit's objects are flushed by git's batch fsync, one hardware flush per object transaction: a write's blobs in one update-index on a scratch index, a hand edit's files in one"
reason = "A history commit's objects and refs must be on disk before the journal that would make the commit again is deleted, so the graph's git runs with core.fsync=committed. Flushed one by one, every loose object is a hardware flush of its own, and a full batch or the first commit of a large graph spends seconds in them. core.fsyncMethod=batch (git 2.37) writes each object of an object transaction with a writeout-only flush into a temporary object directory, then flushes the device once before it renames them into place, so no object gets its name before its data is durable. update-index opens one transaction for all its paths and git commit one for its trees, so a write's blobs are written by one update-index on a scratch index whose work tree is .state/tmp/, before the commit point, and a hand edit commit or a repository's first commit stages its files with one update-index. hash-object opens no transaction, so only a symlinked node file goes through it. A git before 2.37 warns, ignores the value and flushes each object on its own, slower and as durable. The index, replaced by a rename, is rebuilt from the last commit if a power loss tears it."
alternatives = [
    "A full fsync per object: rejected because a full batch or a first commit then spends seconds in flushes for the same journal ordering",
    "hash-object -w --stdin-paths for a write's blobs: rejected because it opens no object transaction and flushes each blob on its own",
    "fsync the objects from trurlic after a hash-object that fsyncs none: rejected because an object would have its name before its data is durable, and git keeps a torn one",
]
status = "proposed"
origin = "apply and status"
created = "2026-11-24T03:35:48.715992075Z"
anchors = [
