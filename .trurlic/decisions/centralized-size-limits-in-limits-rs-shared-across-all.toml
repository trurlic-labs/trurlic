component = "store"
choice = "The limits every node file and value is held to live in store::limits and are applied where every file passes: the read, the types and validation"
reason = """
A limit kept per surface drifted: one surface accepted what another refused. store::limits holds MAX_NODE_FILE_BYTES (1 MiB, the cap of every node read), MAX_CHOICE_BYTES (200), MIN_REASON_BYTES (10) and MAX_TEXT_FIELD_BYTES (50,000) for a decision's text, and MAX_ANCHOR_PATH_BYTES (500) and MAX_ANCHOR_SYMBOL_BYTES (200) for an anchor. read_node_bytes caps each read, Anchor::new refuses at parse and store::model::text runs in validation, so a hand edit, a migration and any later write tool meet the same bound with the same message, and a change of a constant reaches all of them through the compiler. A tool's argument limits on the wire are declared with its spec and bound what it accepts; a value it hands the store then meets these. This absorbs the rule of the deleted pattern on limits at trust boundaries.
"""
alternatives = [
    "Per-surface limit constants: rejected because they drifted, one surface accepting what another refused",
    "No explicit limits, relying on the TOML parser: rejected because the parser accepts any size, and explicit bounds keep one file from costing every load and force concise decisions",
]
tags = [
    "consistency",
    "security",
]
status = "proposed"
created = "2026-06-15T09:45:30.508496747Z"
anchors = [
    { file = "src/store/format/load.rs", symbol = "read_node_bytes" },
