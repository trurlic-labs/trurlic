component = "code"
choice = "A C or C++ span hash takes a literal as one token and a macro's body one unit a token of the C lexer, a multi-byte punctuator one; a line continuation is blank between tokens and spliced inside one"
reason = "A hash must move with the code and stay under a reformat. A string or character literal, a raw string and an include's path are one token each, their spaces kept, since they are values. tree-sitter keeps a #define's body as one leaf, so the body is hashed by the tokens the blank pass's lexer reads in it, comments left out, each punctuator of several bytes (->, &&, ##, <<=, ...) one token as C lexes it: a formatter's spacing of an operator, a re-wrap over continued lines and a comment move nothing, ((a)+1) hashes as ((a) + 1), and ((a) && (b)) and ((a) & &(b)), two programs, hash apart. A backslash before a line break is blank between two tokens, in a body and between nodes; inside a token it is spliced as the preprocessor splices it, so a, a continuation and b are the one token ab, never the two that a b is. The comments inside a #define that a token of it follows are blanked before the parse, which keeps tree-sitter from ending the directive at them, so no comment of a body cuts the body short. Concatenated strings and digraphs are hashed as written."
alternatives = [
    "A macro's body verbatim: rejected because a re-wrap would read as a change",
    "A body hashed one unit a run between blanks: rejected because a formatter's spacing of an operator moved its hash",
    "A punctuation mark one token a byte: rejected because a && b and a & &b, which differ, then hash alike",
]
