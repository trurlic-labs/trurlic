component = "store"
choice = "A warn pattern lets the batch write and adds a warning shaped as a refusal (op, field, rule, message), once per op and pattern, at its first match"
reason = "A rule that needs judgment, such as no measurement in a reason, must not block a write that is right, yet the writer has to see it. The warning names the op, the argument path and the rule as a refusal does, so a caller reads both with one parser, and a later kind of warning is one more WarningKind with the same fields. One warning per op and pattern bounds the list: a pattern that matches every sentence of a long reason says so once. Over MCP the warnings are the result's warnings array, absent when empty; trurlic apply prints each on stderr after its op lines, and with --json prints the call's text."
alternatives = [
    "A warning per match: rejected because one pattern over a long reason would fill the result",
    "Free-text notes: rejected because a caller could not tell one kind of warning from another",
]
