[decision]
component = "store"
choice = "Advisory file locking via std File::try_lock and try_lock_shared with 5-second polling timeout"
reason = "Prevents concurrent mutations from CLI, MCP server, and map server. Writers take the exclusive lock on .state/lock with std's File::try_lock (stable since 1.89) in a polling loop (50ms interval, 5s deadline); the blocking File::lock has no timeout, so a hung holder would hang every writer. Watchers load under the shared lock (try_lock_shared, same loop), which keeps writers out without excluding each other, so a reload never reads a commit halfway through its renames. std reports contention as TryLockError::WouldBlock on every platform, including Windows' ERROR_LOCK_VIOLATION, which fs2 surfaced as a raw OS error so a second Windows writer failed at once instead of waiting. The lock file is opened read+write because Windows refuses to lock append-only handles. StoreLock is a proof-of-lock type: all write methods require &StoreLock as a parameter, enforced at compile time. Lock file stores the exclusive holder's PID for diagnostics on timeout. The exclusive lock is held only for one reload, validation and commit."
alternatives = [
    "Mutex-based locking — rejected: does not work across separate processes (CLI vs MCP vs map)",
    "No locking with last-writer-wins — rejected: silent data loss when concurrent writes race",
    "Database with built-in concurrency — rejected: adds a heavy dependency for what is fundamentally a file-based store",
]
tags = [
    "concurrency",
    "reliability",
]
attribution = "user"
created = "2026-06-15T09:44:30.756424330Z"

