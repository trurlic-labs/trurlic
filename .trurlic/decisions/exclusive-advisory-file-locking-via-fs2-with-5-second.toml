[[decision.history]]
choice = "Exclusive advisory file locking via fs2 with 5-second polling timeout"
reason = "Prevents concurrent mutations from CLI, MCP server, and map server. Uses fs2::FileExt::try_lock_exclusive() with a polling loop (50ms interval, 5s deadline). StoreLock is a proof-of-lock type — all write methods require &StoreLock as a parameter, enforced at compile time. Lock file stores the holder PID for diagnostics on timeout. A non-blocking try_lock() variant exists for the map API to avoid stalling the tokio runtime. The lock is never held across LLM calls."
changed_at = "2026-10-02T09:47:51.780960157Z"

