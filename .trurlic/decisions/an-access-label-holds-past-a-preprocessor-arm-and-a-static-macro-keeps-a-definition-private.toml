component = "code"
choice = "An access label in a #if arm holds past the arm, a body starts public, an anonymous union's members take the outer label, and a blanked static macro marks the code after it private"
reason = "Every arm of #if is read as written, so a label in one arm and one in the next both stand before what follows #endif: the query marks each arm @visibility.through, so a label in it holds past it, and the last in source order holds, the one a reader meets last and the one an #ifdef ... #else takes when its macro is undefined. A label states the access of its class's members, not of what a member function's body defines, so a body's brace starts public, as a free function's is. The members of an anonymous union or struct with no member name are the outer class's own, so the label in force there holds for them; an unnamed type with a member name, a typedef or a declaration is a type of its own, public within. A macro the tree defines as static, alone or beside other specifiers, in every arm but an empty one (curl's UNITTEST, zlib's local), makes what it marks private in every build but that arm's. Its blank is spaces, whatever the length of its name, and the blank states beside the text where the code after it starts; the resolver reads a definition whose span starts there, or holds the place before its name, as private, as it reads static. A type that the declaration so marked defines is private too, where static would leave it public: a rare shape, and the type is the file's own."
alternatives = [
    "A label that ends at #endif: rejected because what follows then takes the class's default, which no arm says",
    "A static macro blanked as any specifier: rejected because what curl and zlib keep private then reads as public",
    "static written in the macro's place: rejected because only a name of six bytes or more holds the word, and local, STA and SI are shorter",
]
