component = "code"
choice = "A source file is refused past 1 MiB for a tree-sitter kind or 4 MiB for a lexical one, unreadable or not UTF-8, past a budget of work per byte, or with a path past 64 segments"
reason = "The index reads whatever a tree holds, a hostile file among them, and nothing may panic, hang or recurse without bound. The shell asks a file's metadata first, so a FIFO is refused before it is opened and a symlink loop is a read fault, reads at most the largest kind's cap and one byte more, and takes a file that vanishes between the walk and the read as absent. The kind's cap is FileKind::max_bytes, checked by the pure index: tree-sitter's error recovery costs a few microseconds a byte that its own count of steps does not show, so the bound on its time is a bound on size; at 1 MiB the worst seen, a generated run of an unclosed string, takes about 4.5 s cold, once, since the result is cached. The budgets are work.rs's, each per byte of the file and refused as TooComplex past it, so a file is refused on every machine or on none: the parse's parser steps and bytes its lexer is served, 64 each, counted through the progress and read callbacks; the tokens a tree-sitter resolver's lexical rules scan, 16; the bytes a lexical resolver hashes, twice MAX_NESTING; and the definitions a macro expansion adds, 4 per byte of the invocations that add them. A tree-sitter span hash needs no budget: each token is hashed once by construction. Every walk keeps its own stack, a path of more than MAX_NESTING segments is TooDeep, and the index's size is bounded by the scope tree's charge; each fault is a typed outcome the report names."
alternatives = [
    "A wall-clock timeout on the parse: rejected because code reads no clock, and a file would be refused on a slow machine and not a fast one",
    "One cap of 4 MiB for every kind: rejected because an error-dense Rust file that size takes about 18 s cold, which no count tree-sitter exposes can stop",
    "One budget for the parse and the work after it: rejected because a parser step, a scanned token and a hashed byte cost too differently to share a unit",
    "Recursive walks: rejected because a nesting as deep as a file allows would overflow the stack",
]
