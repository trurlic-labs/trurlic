component = "code"
choice = "A source file is refused past 4 MiB, when no regular file, unreadable or not UTF-8, when its parse runs past 64 steps or lexed bytes per byte, and when it nests past 64 containers"
reason = "The index reads whatever a tree holds, a hostile file among them, and nothing may panic, hang or recurse without bound. The shell asks a file's metadata first, so a FIFO is refused before it is opened and a symlink loop is a read fault, reads at most MAX_SOURCE_FILE_BYTES and one byte more, and takes a file that vanishes between the walk and the read as absent. tree-sitter recovers from anything but can take many steps per byte doing so, and its lexer can rescan the rest of the file from each byte, as an unclosed raw string repeated does; the parser reports every hundred steps, and the lexer is handed the text in chunks through a callback that counts what it serves, so both are bounded by the file's size. The bound counts work, not time, so a file is refused on every machine or on none. Every walk keeps its own stack, and a definition's path is a copy of its container's, so MAX_NESTING bounds the index's size; each fault is a typed outcome the report names."
alternatives = [
    "A wall-clock timeout on the parse: rejected because code reads no clock, and a file would be refused on a slow machine and not a fast one",
    "No size cap: rejected because one generated file could hold a call for seconds and its index the memory",
    "Recursive walks: rejected because a nesting as deep as a file allows would overflow the stack",
]
tags = [
    "reliability",
    "security",
]
