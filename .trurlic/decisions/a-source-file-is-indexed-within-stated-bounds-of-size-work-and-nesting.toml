component = "code"
choice = "A source file is refused past its kind's size cap, unreadable or not UTF-8, past a budget of work per byte, or with a path past 64 segments"
reason = "The index reads whatever a tree holds, a hostile file among them, and nothing may panic, hang or recurse without bound. The shell asks a file's metadata first, so a FIFO is refused before it is opened and a symlink loop is a read fault. It reads at most the largest kind's cap and one byte more, and takes a file that vanishes between the walk and the read as absent; each kind's cap is a decision of its own. No count bounds the parser's error recovery: on random bytes at the 1 MiB cap the typescript grammar takes about 29 seconds and the tsx one 11, against a few for Rust's and Python's, linear in the size, once per content since the index is then cached. The budgets are work.rs's, each per byte of the file and refused as TooComplex past it, so a file is refused on every machine or on none. The parse counts parser steps and bytes its lexer is served, 64 each per byte, the lexer served 64 bytes at a time, since it rescans within the chunk it holds without asking. A tree-sitter resolver's lexical rules, and the text a query's predicates read, may take 16 a byte, and a lexical resolver hash 2 times MAX_NESTING bytes. A macro expansion may hold 256 bytes per byte of the invocations that add it. A tree-sitter span hash needs no budget: each unit is hashed once by construction. A language may add bounds checked before its parse, each a cost of its grammar no budget counts during it, as Python's indentation widths and line continuations are. Every walk keeps its own stack, a path of more than MAX_NESTING segments is TooDeep, and the index's size is bounded by the scope tree's charge."
alternatives = [
    "A wall-clock timeout on the parse: rejected because code reads no clock, and a file would be refused on a slow machine and not a fast one",
    "One budget for the parse and the work after it: rejected because a parser step, a scanned token and a hashed byte cost too differently to share a unit",
    "Recursive walks: rejected because a nesting as deep as a file allows would overflow the stack",
    "Chunks of 1,024 bytes to the lexer: rejected because a run of Python line continuations rescans within one chunk, uncounted, for seconds",
]
