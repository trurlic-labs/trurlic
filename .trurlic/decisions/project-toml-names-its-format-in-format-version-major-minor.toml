component = "store"
choice = "project.toml names its format in format_version, MAJOR.MINOR.PATCH apart from the crate version; a version that does not parse is refused by every load and by migrate"
reason = """
The key was trurlic_version, though the number is the format's, not the release's: format 0.4.0 was written by 0.3.x. The old check compared versions leniently, a part that was not a number counting as 0, so garbage passed for an older format and migrate rewrote the store as if it were one. FormatVersion::parse accepts only the exact text Display writes, and the error names the file and the text. The version is read under format_version, trurlic_version or trurl_version, newest first, so an old store is told to run trurlic migrate instead of failing on a missing key. The check has one home, store/version.rs, used by every read, every write and migrate: a newer format is refused naming both versions, an older one the registry names is told to run trurlic migrate, and one it does not name is Error::NoMigration.
"""
