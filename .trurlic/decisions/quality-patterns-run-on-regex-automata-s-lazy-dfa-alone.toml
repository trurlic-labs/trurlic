component = "store"
choice = "Every [quality] pattern runs on regex-automata's lazy DFA alone, its cache capped and giving up instead of clearing; a Unicode word boundary is refused at compile"
reason = "A search on the lazy DFA costs time linear in the bytes it reads once the states it walks are built, and it builds them in a cache the caller owns. Capped at MAX_PATTERN_CACHE_BYTES per direction, with minimum_cache_clear_count(Some(0)), the cache gives up when full instead of clearing, so the engine itself holds a call to one cache of states per pattern and direction. What remains of the cost is the bytes read, so plain bytes bound the work of a call and no per-pattern estimate is needed. The regex crate hides which engine it runs and falls back to the PikeVM, whose time per byte follows the pattern, after a give-up or for a Unicode word boundary over text outside ASCII. A Unicode word boundary is the one construct the lazy DFA runs over ASCII text alone, so Compiled::new refuses it, naming the rewrite (?:^|\\W)word(?:\\W|$), which keeps Unicode word classes, or (?-u:\\b) over ASCII text. An automaton whose start states pass the cache is refused too, naming the remedy. A search error is a give-up: no byte quits the search. The crate is in the build already through the regex of tree-sitter; regex itself is a dev-dependency only, for the test that holds the rewritten shipped table to the findings of its first form."
alternatives = [
    "The meta engine of the regex crate: rejected because it falls back to the PikeVM, whose cost per byte follows the pattern, so only a per-pattern estimate bounds a call",
    "Keep a Unicode word boundary on the PikeVM, charged by weighed NFA states: rejected because the weights are an estimate a constructed pattern outruns, and they overstate every ordinary pattern a thousandfold",
    "Clear the cache when full, as the engine does by default: rejected because each clearing builds the states again, so the construction of one search has no bound",
    "ASCII word boundaries alone: rejected because a word would split at its first letter outside ASCII",
]
tags = [
