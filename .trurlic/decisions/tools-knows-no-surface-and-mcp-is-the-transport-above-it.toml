component = "tools"
choice = "tools holds each tool's spec, handler, registry entry and fitted result, known to no surface; mcp holds only what MCP speaks, above tools and below the command that serves it"
reason = "A tool's arguments, handler and result serve every surface: the MCP server, a CLI twin, and a command or a local server that gives the same JSON. Kept inside mcp, each such surface would import the module of a protocol it does not speak, and a tool that named one surface would tie every other surface to it. So tools holds the specs and the schemas they walk, the handlers, the registry a call is looked up in with what each Tool states of itself, and the ToolResult fitted to the budget with the refusal shape; mcp holds only what MCP speaks: JSON-RPC over stdio (protocol), the client and the server's own requests (peer), the tool-result envelope with structuredContent and isError (envelope), and the tools/list entries with their annotations (listing), which name in MCP's words what each Tool states. So tools names no surface, mcp names tools and never a command, and serve calls the server: their arrows of the module map, which their rows of MAP in lib.rs hold."
alternatives = [
    "Keep the tool layer in mcp and let other surfaces import it: rejected, a command or a local server would depend on a module named for a protocol it does not speak",
    "A client trait in tools that mcp's Peer implements: rejected, it has one implementation, and no tool asks the client",
    "Build each tool's tools/list entry in tools: rejected, readOnlyHint and its siblings are MCP's words, which another surface would carry or strip",
]
status = "proposed"
