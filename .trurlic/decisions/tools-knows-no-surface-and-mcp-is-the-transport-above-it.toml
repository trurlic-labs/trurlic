component = "tools"
choice = "tools names no surface and mcp no command: each names in the crate only itself, the modules its arrow of the module map reaches, the error, the console and the failpoints"
reason = "A tool's arguments, handler and result serve every surface: the MCP server, a CLI twin, and a command or a local server that gives the same JSON. Kept inside mcp, each such surface would import the module of a protocol it does not speak, and a tool that named one surface would tie every other surface to it. So tools holds the specs and the schemas they walk, the handlers, the registry a call is looked up in with what each Tool states of itself, and the ToolResult fitted to the budget with the refusal shape; mcp holds only what MCP speaks: JSON-RPC over stdio (protocol), the client and the server's own requests (peer), the tool-result envelope with structuredContent and isError (envelope), and the tools/list entries with their annotations (listing), which name in MCP's words what each Tool states. The test the_tool_layer_names_no_surface holds the direction with an allow list read by crate::purity: every path the non-test code under src/tools names into the crate goes into tools, store, lint, sources, budget, discovery, Error, console or failpoint, however a use list, a super chain or an attribute's string spells it. The transport sits below the commands that serve it: the_transport_names_no_command allows mcp, tools, budget, Result, console and failpoint alone, so serve calls the server and the server never a command, and mcp imports tools, never the reverse."
alternatives = [
    "Keep the tool layer in mcp and let other surfaces import it: rejected, a command or a local server would depend on a module named for a protocol it does not speak",
    "A client trait in tools that mcp's Peer implements: rejected, it has one implementation, and no tool asks the client",
    "Build each tool's tools/list entry in tools: rejected, readOnlyHint and its siblings are MCP's words, which another surface would carry or strip",
    "Refuse the tokens mcp, commands and cli: rejected, a deny list passes crate::main, a glob of the crate root followed by a bare main, crate::bench and a surface item re-exported under another name",
]
status = "proposed"
