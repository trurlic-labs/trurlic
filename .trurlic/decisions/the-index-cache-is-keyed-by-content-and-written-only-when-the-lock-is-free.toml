component = "sources"
choice = "Each file's index is cached in .state/symbols/ under the hash of its kind, versions and bytes; a read writes its misses only when the exclusive lock is free, renaming whole entries"
reason = "Parsing every Rust file of a large tree on each status call costs more than reading cached indexes: on this repository's src/ a cold index takes several times a warm one, and the gap grows with the tree and shrinks with cores. A key by content, with the file's kind, the span hash scheme and INDEX_FORMAT, means an entry is never read under other rules and the trees of one shared graph share entries; a fingerprint test of the fixture corpus makes a change to how a file is indexed raise INDEX_FORMAT. A read takes no lock to read entries, which are written to their own files and renamed over their names; .state/tmp/ is not used, because a file there makes a reader run recovery. After its own work a read tries the exclusive lock without waiting and skips the write when it is busy: the cache is never authoritative, so a torn, swapped or unreadable entry is a miss and is written again. The directory is bounded without a clock: when it holds more than twice the call's live set and 256 besides, every entry outside the set goes."
alternatives = [
    "No cache: rejected because each status call would parse the whole tree, which grows with the project",
    "Key by path and modification time: rejected because a checkout can keep a time, and the trees of a shared graph would not share",
    "Wait for the lock to write: rejected because a read would then stall behind a writer for an optional speedup",
    "Prune by age: rejected because it needs a clock, which a read has no business reading",
]
tags = [
    "concurrency",
    "performance",
]
