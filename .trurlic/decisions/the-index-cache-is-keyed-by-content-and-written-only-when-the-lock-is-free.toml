component = "sources"
choice = "Each file's index is cached in .state/symbols/ in a compact encoding under the hash of its kind, grammar, versions and bytes; a read writes its misses when the exclusive lock is free"
reason = "Parsing every Rust file of a large tree on each status call costs more than reading cached indexes, and the gap grows with the tree. The key is by content, with the file's kind, the identity of the kind's tree-sitter grammar, the span hash scheme, INDEX_FORMAT and every bound the index is built within (BOUNDS). So an entry is never read under other rules or bounds, and the trees of one shared graph share entries. A fingerprint test of the fixture corpus, a case per rule and per nesting bound, makes a change to how a file is indexed raise INDEX_FORMAT. An entry is a sum, its key and a binary encoding; it is at most 32 times its file by construction. A read takes no entry over that bound of the file it is read for, within its kind's size. Its decode holds no more items than the file has bytes and 64 besides, so a forged entry costs a decode in proportion to the file. A read takes no lock to read entries, which are renamed over their names. After its own work a read tries the exclusive lock without waiting and skips the write when it is busy: the cache is never authoritative. A torn, swapped or unreadable entry is a miss, and one entry that fails to write stops no other. The directory is bounded without a clock: past twice the call's live set and 256, every entry outside the set goes."
alternatives = [
    "No cache: rejected because each status call would parse the whole tree, which grows with the project",
    "Key by path and modification time: rejected because a checkout can keep a time, and the trees of a shared graph would not share",
    "Wait for the lock to write: rejected because a read would then stall behind a writer for an optional speedup",
    "One read cap for every entry: rejected because a forged entry near a cap sized for the largest file cost every call seconds and gigabytes, whatever file it named",
    "Prune by age: rejected because it needs a clock, which a read has no business reading",
]
tags = [
    "concurrency",
    "performance",
]
status = "proposed"
