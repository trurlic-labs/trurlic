component = "sources"
choice = "check alone asks git for other worktrees; one counts for a missing anchor only when its work tree, uncommitted files included, differs at the anchor's file from the fork"
reason = "Pending needs the repository's other worktrees, and asking git costs a process, so sources asks only for check, only when an anchor of a decision ever accepted is missing here, and only when git::dot_git finds a .git at or above the code root: status spawns nothing for its anchors. git runs in the code root, never in a graph directory. The calling tree's own worktree is the listed top nearest at or above the code root, and the code root's place in it is where each other worktree is read. One rule says where another worktree may hold an anchor: at the paths its work tree differs in from the merge base of the two HEADs, by git diff --name-only from that base and the untracked files git ls-files --others --exclude-standard lists. Code written there and not committed, or not yet added, so counts whatever that worktree's commit, ahead, behind or the same, as an agent's new worktree holds it before its first commit. A branch cut before a deletion, whose work tree still holds the code unchanged, never hides it, since merging it would not bring the code back. Two lines that share no commit, one of them on an unborn branch or with unrelated histories, count every path. The worktrees are read in git's order for the anchors no earlier one holds, and none once every one is held; only the changed files, never a walk, each read against the calling tree's crates and module declarations. A git failure, a calling tree git lists as no live worktree and a path that cannot be made canonical leave worktrees unread, a check warning."
alternatives = [
    "Count any worktree whose HEAD is no ancestor of this tree's: rejected because a branch cut before a deletion, with any commit of its own, still holds the deleted code and would hide the deletion",
    "Skip a worktree at the calling tree's commit or behind it: rejected because the same uncommitted code would then count in one worktree and not in another, by a commit unrelated to it",
    "Count committed changes alone: rejected because a new worktree holds an agent's code uncommitted until its first commit, and check would fail on an accepted decision about it meanwhile",
    "Walk each worktree ahead whole: rejected because each check would read every source file of every such worktree for crates and module declarations the calling tree holds already in the usual case",
    "Ask the worktrees in status too: rejected because status is called often and asks the project's git nothing, so it names such an anchor unresolved instead",
]
tags = [
