component = "sources"
choice = "Only check runs git for other worktrees; one holds a missing anchor when its work tree differs at the file from the fork and resolves the anchor where the fork did not"
reason = "Pending needs the repository's other worktrees, and asking git costs a process, so sources asks only for check, only when an anchor of a decision ever accepted is missing here, and only when git::dot_git finds a .git at or above the code root: status spawns nothing for its anchors. git runs in the code root, never in a graph directory. The calling tree's own worktree is the listed top nearest at or above the code root. The main worktree git lists by its git directory, as it lists a submodule's, takes the work tree that directory's core.worktree states (git::work_tree_of), else the code root's top when the calling tree is it; the code root's place in its worktree is where each other worktree is read. A worktree may hold an anchor at the paths its work tree differs in from the merge base of the two HEADs, by git diff --name-only from that base and git ls-files --others --exclude-standard, so code written and not committed, or not yet added, counts whatever that worktree's commit. It holds the anchor only when the anchor resolves in those files there and not in them as the merge base held them, read in one git cat-file batch: a branch cut before a deletion, whose work tree still holds the code, never hides it, whatever else it changed in the file. Two lines that share no commit count every path. The worktrees are read in git's order for the anchors no earlier one holds, and none once every one is held; only the changed files, never a walk, each read against the calling tree's crates and module declarations. A git failure, a calling tree git lists as no live worktree and a path that cannot be made canonical leave worktrees unread, a check warning."
alternatives = [
    "Count any worktree whose HEAD is no ancestor of this tree's: rejected because a branch cut before a deletion, with any commit of its own, still holds the deleted code and would hide the deletion",
    "Skip a worktree at the calling tree's commit or behind it: rejected because the same uncommitted code would then count in one worktree and not in another, by a commit unrelated to it",
    "Count committed changes alone: rejected because a new worktree holds an agent's code uncommitted until its first commit, and check would fail on an accepted decision about it meanwhile",
    "Walk each worktree ahead whole: rejected because each check would read every source file of every such worktree for crates and module declarations the calling tree holds already in the usual case",
    "Ask the worktrees in status too: rejected because status is called often and asks the project's git nothing, so it names such an anchor unresolved instead",
]
tags = [
    "anchors",
    "git",
    "performance",
]
status = "proposed"
origin = "anchor findings"
created = "2026-11-24T10:39:08.594384541Z"
