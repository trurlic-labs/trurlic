    { file = "src/sources/worktrees.rs", symbol = "others" },
    { file = "tests/integration/anchors.rs", symbol = "a_worktree_git_cannot_say_enough_of_is_a_check_warning" },
    { file = "tests/integration/placement.rs", symbol = "a_submodule_s_main_and_linked_worktrees_read_each_other" },
    { file = "tests/integration/placement.rs", symbol = "a_worktree_that_did_not_change_the_file_since_the_fork_makes_nothing_pending" },
    { file = "tests/integration/placement.rs", symbol = "code_another_worktree_has_not_committed_is_pending_there" },
]
depends_on = [
    "the-verdict-on-an-anchor-follows-its-cause-missing-malformed-or-unverified",
]

