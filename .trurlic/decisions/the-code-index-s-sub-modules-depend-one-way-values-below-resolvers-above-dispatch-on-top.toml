component = "code"
choice = "The code index's sub-modules depend one way: index/ names no other, parse/ and lexical/ name index/ alone, tree/ names index/ and parse/, and only the root (resolver.rs, mod.rs) names them all"
reason = "One file held both the values every resolver builds (FileKind, Definition, FileIndex) and the dispatch that calls every resolver, so each module of the index depended on it and it on each of them. The values sit in index/, with the bounds an index is built within, the scope tree that charges all an index holds to its file's room, and the cache entry whose costs the scope tree charges: the encoding is below the scope tree and above the values, so it is inside index/. The resolvers stand on index/: parse/ reads a file with tree-sitter, lexical/ reads one without a grammar. The facts of a kind that name a resolver (its language row, its symbol syntax, its grammar's identity, its name in a cache key) are FileKind methods written beside the rows in parse/language/, so index/ names no grammar. resolver.rs is the one module that names every resolver, with the version and every bound of the rules. A C or C++ file is blanked there before the general resolver, as a Python file's line ends are rewritten there, so language/ never calls back into general/. tree/ is the second step over a tree's indexes and reads the language rows for test places. The test each_sub_module_names_no_module_above_it holds each sub-module to the modules its row allows, a path of supers read from the file's own module."
alternatives = [
    "Keep the values and the dispatch in one file: rejected because every resolver and every reader then depends on the module that depends on all of them, and no direction can be checked",
    "Keep the encoding a sibling of index/: rejected because the scope tree charges what an entry costs and the entry encodes the values, so the two would import each other",
    "Write the FileKind methods that name a language with the enum, matching on literals: rejected because a kind's name and symbol syntax would then be held twice, in the method and in its row",
    "Let the C-family module call the general resolver itself: rejected because language/ and general/ would then import each other",
]
