component = "store"
choice = "depends_on cycles are found as strongly connected components by an iterative Tarjan search and reported once each, by their sorted members"
reason = """
A cycle is a set of decisions, so its identity is its members: the report is the same whatever node a search starts from, and the no-new-issues write rule (validate::introduced) can match it across validations. Tarjan finds every component in one pass over the decisions' depends_on sets. The search keeps its own stack of frames on the heap, so a dependency chain of any length runs in constant call-stack depth. A node that only depends into a cycle is not a member and is not reported. A one-node loop is a self-edge, which the self-edge check reports, so the search reports components of two or more members only. Visit state is a BTreeMap keyed by name, as the lint on hash collections requires, so roots are visited in name order; the cycles are sorted on return. The search, store::cycles::cycles, runs over any graph of names a successor function gives: ProjectState::depends_on_cycles runs it on the decisions, apply from the one decision an op gave new edges (Edit::new_cycle), against the cycles the batch began with, and the step to format 0.5 on the depends_on edges graph.toml held, with and without the constrains edges turned around.
"""
alternatives = [
    "Recursive depth-first search with an on-stack set: rejected because an early return left the path marked and reported a false cycle, the report named a hash-ordered root, and a 50,000-link chain overflowed a 64 KiB stack",
    "Kosaraju's algorithm: rejected because it makes two passes over the graph where Tarjan needs one, for the same components",
    "One issue per decision on a cycle: rejected because a cycle of n decisions becomes n errors, and the members are not listed together",
]
