[decision]
component = "session"
choice = "Streaming LLM responses with inline chunk callback"
reason = 'The session module calls `client.stream_completion()` with a `&mut |chunk| { print!("{chunk}"); }` callback that prints each token as it arrives. This gives users immediate visual feedback during long LLM generations. The callback is a simple closure passed by mutable reference, keeping the streaming interface minimal and avoiding channel overhead.'
alternatives = [
    "Buffered completion — collect the full response before displaying. Rejected: poor UX for multi-second LLM calls, user sees nothing until generation finishes.",
    "Channel-based streaming with tokio mpsc — rejected: adds unnecessary complexity when the consumer is just stdout printing in the same task.",
]
tags = [
    "interface",
    "observability",
]
attribution = "user"
created = "2026-06-15T09:44:32.208487028Z"
