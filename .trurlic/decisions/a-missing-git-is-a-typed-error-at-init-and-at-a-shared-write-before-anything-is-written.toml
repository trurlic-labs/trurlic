component = "store"
choice = "A missing git is Error::GitMissing at init of a shared graph, which then leaves no .trurlic/ behind, and at every write to a shared graph, before its commit point"
reason = """
A shared graph's history is git, so git missing is never a silent skip. Store::create makes the repository before any graph file and removes the directory it made when anything fails, so a refused init leaves nothing that a second init would refuse as existing. The history step runs git status before a write stages anything, so a missing git refuses the write with the graph as it was. status and check of a shared graph ask git for their findings and fail the same way; a tracked graph's reads and writes need no git.
"""
