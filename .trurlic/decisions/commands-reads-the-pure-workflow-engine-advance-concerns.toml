[decision]
component = "commands"
choice = "commands reads the pure workflow engine (advance, concerns) for CLI status and coverage display, never mutating graph state through it"
reason = "advance() and concerns::coverage_lost are pure, read-only projections of graph state (see advance-is-a-pure-function). The bootstrap status view calls advance() to compute the current phase for display; gc and remove-decision call concerns::coverage_lost to report which concern areas lost their last covering decision. Reading a pure function from the CLI layer introduces no runtime coupling and no cycle (workflow depends only on store), and mirrors how mcp consumes the same engine. This makes the true commands dependency set store + session + config + workflow (read-only) + provider (fail-fast resolution, per validate-component-existence-before-provider-api-key), which the top-level CLAUDE.md arrow summarizes only partially."
alternatives = [
    "Route workflow reads through a session facade — rejected: session owns async LLM dialogues, so wrapping a pure sync computation (coverage_lost, advance) in a session function is a category error and adds passthrough indirection that obscures rather than enforces the boundary.",
    "Duplicate the coverage and phase computation inside commands — rejected: forks the concern-area definitions and step-deduction logic, guaranteeing drift from the workflow engine as the single source of truth.",
    "Refactor provider creation out of commands into session — rejected: contradicts the recorded decision validate-component-existence-before-provider-api-key, which deliberately runs provider/API-key resolution inside commands after a fail-fast component-existence check.",
]
tags = [
    "architecture",
    "module-boundary",
]
attribution = "agent"
created = "2026-07-05T17:46:12.093829514Z"
