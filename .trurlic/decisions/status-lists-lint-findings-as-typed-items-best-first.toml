component = "tools"
choice = "status's lint section lists LintItem variants tagged by kind: duplicates best first, then quality findings, then file-anchor-only decisions, each kind fitted on its own and counted in counts.lint"
reason = "The section holds findings of several kinds, likely duplicate pairs, quality findings and decisions with file anchors only, each with fields of its own. So an item is an enum whose kind tag names the variant and whose fields are declared once in its Output, a new kind being one more variant. The decision field is common to every kind, a duplicate's the first of its pair by name; a duplicate adds other and score, a string of six decimals so every machine prints the same text. Duplicate pairs grow with the square of the decisions and quality findings with the decisions times the rules, so in one list cut by its prefix the first kind would crowd out the others. Each kind is a part of the level search on its own, so a short kind stays whole and the long ones share the rest; the section is their kept items in kind order, its total and omitted their sums. Each kind is gathered to lint_limit of its kind, the budget over its own smallest finding, and counted in counts.lint, beside how far the pairs' pass and the patterns read the decisions: counts.lint.pairs names the decisions the pass left uncompared, why, and how to compare them. Pairs come best first, then by their names, so the ones most worth reading lead and a cut drops the weakest: the pairs left out rank at or below the last listed, which stays true when scores tie at the cut. The quality findings and the decisions with only file anchors left out follow the last listed by decision name, and the section with from lists the quality findings from a decision on. origin narrows the findings to the decisions recorded under it, a pair when either decision is."
alternatives = [
    "An item of kind and message, as issues have: rejected because a caller merging a pair would parse names out of prose",
    "The score as a JSON number: rejected because a float's text is the printer's, and six fixed decimals are the same bytes everywhere",
    "One list cut by its prefix: rejected because thousands of pairs would hide every quality finding",
    "A section per kind: rejected because the section argument would grow a value per kind, and the kinds share one budget anyway",
]
