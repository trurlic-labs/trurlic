component = "mcp"
choice = "status has a lint section whose items are a LintItem enum tagged by kind: a duplicate names its two decisions, first by name, and its score; pairs best first, then by names"
reason = "Findings of other kinds will join the section, the code index's anchor findings and the quality checks over the graph, each with fields of its own. So an item is an enum whose kind tag names the variant and whose fields are declared once in its Output, a new kind being one more variant. The decision field is common to every kind; a duplicate adds other and score, a string of six decimals so every machine prints the same text. Pairs come best first, then by their names, so the ones most worth reading lead and a cut drops the weakest. The section is fitted like every other, from a total that counts every pair and the best pairs a result can hold; its more says that the section lists the best pairs; the ones left out rank at or below the last listed, and come into view as the listed ones are settled (merged, or revised apart), which stays true when scores tie at the cut."
alternatives = [
    "An item of kind and message, as issues have: rejected because a caller merging a pair would parse names out of prose",
    "The score as a JSON number: rejected because a float's text is the printer's, and six fixed decimals are the same bytes everywhere",
]
