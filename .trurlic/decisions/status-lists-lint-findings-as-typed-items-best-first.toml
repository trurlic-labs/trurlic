component = "tools"
choice = "status has a lint section whose items are a LintItem enum tagged by kind: a duplicate names its two decisions, first by name, and its score; pairs best first, then by names"
reason = "The section holds findings of several kinds, likely duplicate pairs, quality findings and decisions with file anchors only, each with fields of its own. So an item is an enum whose kind tag names the variant and whose fields are declared once in its Output, a new kind being one more variant. The decision field is common to every kind; a duplicate adds other and score, a string of six decimals so every machine prints the same text. Pairs come best first, then by their names, so the ones most worth reading lead and a cut drops the weakest. The section is fitted like every other, from a total that counts every pair found and the best pairs a result can hold; the pairs that a cut leaves out rank at or below the last listed, which stays true when scores tie at the cut."
alternatives = [
