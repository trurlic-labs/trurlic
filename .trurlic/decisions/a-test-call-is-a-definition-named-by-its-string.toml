component = "code"
choice = "A call is a test named by its first string when its callee is a runner's name or up to three listed members from it, and a function or a function's name follows the string"
reason = "A JavaScript test is a call, not a named function, and a proof names the test it ran by the strings of the calls that hold it. One rule holds for every callee: describe, context, suite, it, test, specify, bench or a jasmine form, alone or followed by up to three members from the list the query holds (only, skip, each, for, concurrent, describe, serial, step and the others the runners document), called directly or through a call (describe.each(table), test.extend({})). Its first argument is a string or a template literal, named by its text without quotes, interpolations and placeholders kept; a function literal or a function's name follows, right after it or after an options object (Playwright's details, Vitest's and node:test's options). So a project's own test(\"abc\"), const ok = test(\"value\"), a pending it(\"x\"), Benchmark's suite.add(\"x\", fn) and describe.bind(null)(\"x\", fn) are no tests, and mocha's context.only is one while Playwright's context.route is not. A member a runner adds is one word in the list; until it is there, its call is no test and the tests its callback holds are lost with it. Not read: a function a call computes (it(\"x\", run(1))), QUnit's suite(\"x\") with no callback, and node:test's t.test(\"sub\", fn), a member call on a parameter no rule tells from a project's own object. A test nested in another's callback is under it. A name that is no string literal defines nothing, nor does an empty one. A test and everything its callback defines are test code; the call has no visibility."
alternatives = [
    "Test calls as no definitions: rejected because a proof could then name no test of a JavaScript project",
    "Any member chain after a runner's name: rejected because Benchmark's suite.add, express's test.set and describe.bind have a runner's name and a function after a string, and are no tests",
    "A bare runner call whatever follows its string: rejected because a project's own test(\"abc\") and a pending it(\"x\") would be tests, while it.todo(\"x\") is none",
    "Any member named test with a function after a string: rejected because it cannot tell node:test's subtest from a project's own method named test",
    "The template literal with its interpolations evaluated: rejected because the index reads no value a program computes",
]
