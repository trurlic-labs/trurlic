component = "tools"
choice = "apply is the one tool that writes the graph, on the store's Writer; no other tool or command adds, changes or removes a node, and no surface touches a file under .trurlic/"
reason = "A write tool or a CLI command per op would each need the cascades and checks the store's batch already holds, and a change made of several of them would land in several commits. So apply, on MCP and as trurlic apply, is the one write: its ops cover every change of a node (record, revise, rename, merge, remove, the component ops, repair_anchors), with the cascades and checks in the store. Its handler turns the parsed arguments into a Batch and calls Writer::apply on the Writer that ToolSpec::run begins for the call, which holds the exclusive lock and the graph loaded under it, validates, commits through the journal and keeps its graph equal to disk. status, map, get_context and get_decisions_for_file are reads on Store::load_state. The tool layer parses arguments and builds the result, the MCP server and the CLI twins carry it, and none of them opens a file under .trurlic/, so no tool bypasses the store's atomic writes. init, fmt and migrate write a whole store through the store's own entry points, never a node's value. A hand edit stays a legal write: every load validates it, and fmt and check hold it to the same rules."
alternatives = [
    "A write tool or a CLI command per op: rejected because each needs cascade and validation logic the batch holds, and one change then lands in several commits",
    "A tool writes TOML files directly: rejected because it would bypass the atomic writes, the file lock and validation in the store",
    "A separate write layer between the tools and the store: rejected because the Writer already is that layer",
]
