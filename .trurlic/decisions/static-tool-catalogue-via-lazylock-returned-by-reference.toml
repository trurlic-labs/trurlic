[decision]
component = "mcp"
choice = "The tools/list result is built once in a LazyLock, spec-built tools first, and returned by reference"
reason = "The tool catalogue never changes while the server runs: TOOL_DEFINITIONS builds it on first access from every spec-built tool's definition (its input schema walked from its Args) followed by the hand-written schemas of the tools that predate specs, and every tools/list answer serializes it by reference. is_listed reads the same value, so a call is refused as an unknown tool exactly when tools/list does not list it. The initialize answer is built per request, since it carries the protocol revision negotiated with that client."
alternatives = [
    "Rebuild tool definitions on each request — rejected: wasteful for immutable data that never changes at runtime",
    "Embed tool schemas as compiled-in byte slices — rejected: harder to maintain and no meaningful advantage over LazyLock JSON construction",
]
tags = ["performance"]
attribution = "user"
created = "2026-06-15T09:45:07.215781733Z"

[[decision.code_refs]]
file = "src/mcp/tools.rs"
symbol = "TOOL_DEFINITIONS"

[[decision.code_refs]]
file = "src/mcp/tools.rs"
symbol = "is_listed"

[[decision.history]]
choice = "Static tool catalogue via LazyLock, returned by reference"
reason = "The tool definitions (12 tools with full JSON Schema, descriptions, and MCP annotations) are built once on first access using LazyLock<Value> and returned by reference on subsequent tools/list calls. Similarly, the initialize response is a static LazyLock<Value> since protocol version and server info are compile-time constants. This avoids rebuilding the schema tree on every tools/list request and eliminates per-request allocations for immutable data."
changed_at = "2026-11-23T23:15:08.115771259Z"
