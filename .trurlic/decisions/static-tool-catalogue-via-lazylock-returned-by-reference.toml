component = "mcp"
choice = "The tools/list result is built once in a LazyLock, spec-built tools first, and returned by reference"
reason = "The tool catalogue never changes while the server runs: TOOL_LIST builds it on first access from the registry's TOOLS, every spec-built tool's entry (its input schema walked from its Args) followed by the hand-written schemas of the tools that predate specs, and every tools/list answer serializes it by reference. Tool::named looks a call up in the same TOOLS, so a call is refused as an unknown tool exactly when tools/list does not list it. The initialize answer is built per request, since it carries the protocol revision negotiated with that client."
alternatives = [
    "Rebuild tool definitions on each request: rejected because the data never changes at runtime",
    "Embed tool schemas as compiled-in byte slices: rejected because they are harder to maintain, with no advantage over JSON built once in a LazyLock",
]
tags = [
    "performance",
]
status = "proposed"
created = "2026-06-15T09:45:07.215781733Z"
anchors = [
    { file = "src/mcp/listing.rs", symbol = "TOOL_LIST" },
    { file = "src/mcp/registry.rs", symbol = "Tool::named" },
]

