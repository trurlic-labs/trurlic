[decision]
component = "store"
choice = "The format after 0.4.0 is 0.4.1, the version key rename, so the restructure that follows keeps the name 0.5.0"
reason = "Each format change takes its own version and one migration step, because a store must state exactly the shape it holds: this binary reads 0.4 node shapes, so a store that stated 0.5.0 would claim a layout it does not have. The numbers only order formats; the registry decides which ones exist, and an older version no step starts at is refused."
alternatives = [
    "Number formats with one integer counter - rejected: the plan, the CHANGELOG and the docs name formats 0.4 and 0.5, and every historical store states a three-part version",
    "Fold the key rename into the 0.5.0 restructure - rejected: a store would state 0.5.0 while it holds 0.4 shapes, and one step would carry two changes",
]
tags = [
    "storage",
    "migration",
]
attribution = "agent"
created = "2026-11-23T22:52:37.726409013Z"

[[decision.code_refs]]
file = "src/store/schema.rs"
