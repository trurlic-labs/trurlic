component = "commands"
choice = "The CLI keeps a required --ide whose one value is claude-code, dispatches install apart from the project commands, and reports both error types alike"
reason = "--ide stays required with a one-variant ValueEnum (InstallIde::ClaudeCode): the typed command keeps working, help lists the one accepted value, any other value is refused by clap with exit status 2, and main destructures the variant in its pattern, so a second target fails to compile until it is handled. install takes no target argument because there is nothing to branch on. cli::Command holds the flattened ProjectCommand (every command that acts on the .trurlic/ found from the working directory; the subcommand names are unchanged) and Install, which needs no working directory and returns InstallError. main sends each to report, generic over Display, so every command fails the same way: `error: <message>` on stderr and exit status 1."
alternatives = [
    "Drop --ide or make it optional with a default: rejected, the first breaks `trurlic install --ide claude-code` as typed and the second adds a bare `trurlic install` form that the rewrite would have to keep or break",
    "Accept --ide as a string checked against \"claude-code\" and discard it: rejected, an untyped value the code never reads, with no compile error when a target is added",
    "A cli-level enum over Error and InstallError returned by run: rejected, a third error type whose only job is Display, and every arm of run would convert into it",
    "Box<dyn std::error::Error> from run: rejected, it erases two concrete types to print them",
]
tags = [
    "developer-experience",
    "error-handling",
]
