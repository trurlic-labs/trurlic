reason = "Step prompts live in the workflow module, not in mcp/. Every prompt follows a three-part structure: (1) shared preamble mandating source code reading, (2) step-specific instructions with graph-derived context, (3) a shared protocol: INTERACTION_PROTOCOL in interactive mode (one topic per message, senior-engineer deepening, 'I don't know' teaching), AGENT_PROTOCOL in agent mode. mcp serves the prompts through get_step_prompt; any other transport consumes the same text, so agent behavior does not depend on the transport."
