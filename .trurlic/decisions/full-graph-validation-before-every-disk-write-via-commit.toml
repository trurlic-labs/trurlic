component = "store"
choice = "A write adds no issue: the graph it commits has no issue, matched on kind and subject, that the graph it loaded lacked"
reason = """
Every write is validated against the whole graph before it touches disk: ProjectState::introduced_errors validates the graph a write would commit and refuses it when it has an issue, matched on (IssueKind, subject), that the graph loaded under the writer's lock does not have. Issues the graph already had, from a hand edit or an older release, do not block a write that leaves them as they are, so one invalid file never freezes the store. A message can change with a count while the issue stays the same, so messages are not the key. The graph before the write is validated only when the new graph has an issue, so a write to a valid store validates once.
Writer::format needs no check: it commits only canonical text that reads back as the value loaded, so the graph it commits is the one it loaded; tests/integration/invalid_graph.rs runs fmt over a graph with issues and finds them unchanged. The rule is the contract the next write tool commits under. This absorbs the rule of the deleted pattern on fail-closed validation.
"""
alternatives = [
    "Validate only on read: rejected because a write would put an error on disk that every later reader inherits",
    "Validate only the changed part of the graph: rejected because cycles and names shared across kinds need the whole graph, and a whole validation is cheap at these sizes",
    "Refuse every write while the graph has any issue: rejected because one hand-edit mistake would block every write, the fix included",
]
