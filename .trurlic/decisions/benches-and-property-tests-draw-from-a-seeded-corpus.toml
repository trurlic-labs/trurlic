component = "store"
choice = "Benches and property tests draw from a seeded corpus: a graph written as canonical files in one journaled commit, and a Rust crate its anchors resolve in, drawn from a stream of its own"
reason = "store::corpus writes a store shaped like a large real graph and a Rust crate its anchors resolve in, with the share of anchored files a parameter. Reasons run from 600 to 1200 bytes with up to 20 anchors; one decision in ten is proposed, a quarter of those with accepted_text. One in sixteen is project-wide, about one in two depends on an earlier one, and a component per 40 decisions connects to the next two. Words are drawn by rank band from a long-tailed vocabulary of 8,191, so a few words are in most texts and the rest in few. One decision in 25 restates half of an earlier reason, so the duplicates pass finds a few pairs. The crate is a Cargo.toml and src/lib.rs with a module per component, whose mod.rs declares its 64 files. Each file has a //! paragraph, one to three use lines naming functions of other files, and eight anchored functions plus up to twelve more under /// paragraphs. So the index meets docs, imports and a module tree as in a real crate. The crate draws from a second stream of the seed, so it changes no byte of the graph, which a test pins for each size. Every node goes through prepare_write and one commit_batch, the path every write takes, and tests hold the graph valid, canonical and a fixpoint of read and write. Draws come from SplitMix64 in store::corpus::seeded and timestamps are a fixed epoch plus offsets. So a Corpus value writes the same bytes on any machine: benches compare commits only while the corpus is byte-identical. The same generator seeds the crate's unit property tests, so no test carries a second PRNG or a rand dependency. The corpus compiles under cfg(test) and the bench feature only."
alternatives = [
    "rand's StdRng: rejected because its algorithm is not guaranteed stable across releases, which would move every bench baseline on a dependency bump",
    "One commit per decision: rejected because thousands of journaled commits take minutes and stamp wall-clock times",
    "Commit a fixture corpus to the repo: rejected because it puts megabytes of generated TOML in git and fixes size and anchored share",
]
status = "proposed"
