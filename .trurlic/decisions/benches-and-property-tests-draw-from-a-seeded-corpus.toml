component = "store"
choice = "Benches and property tests draw from a seeded corpus written as canonical files in one journaled commit"
reason = """
store::corpus writes a store shaped like a large real graph (reasons of 600 to 1200 bytes, up to 20 anchors, one decision in ten proposed and a quarter of those carrying accepted_text, one in sixteen project-wide, about one in two depending on an earlier one, a component per 40 decisions connecting to the next two) plus a Rust source tree its anchors resolve in, with the share of anchored files a parameter. Every node goes through prepare_write and one commit_batch, the path every write takes, and its tests hold the graph valid, every file canonical, and every node's bytes a fixpoint of read and write.
Draws come from an inline SplitMix64 and timestamps are a fixed epoch plus offsets, so the same Corpus value writes the same bytes on any machine, rand release or day: benches compare commits only while the corpus is byte-identical. The same SplitMix64 (pub(crate) in store::corpus) is the one seeded source of the crate's unit property tests, such as the random payloads of mcp::truncate, so no test carries a second PRNG or a rand dependency. It compiles under cfg(test) and the bench feature only, so release builds carry neither the corpus nor the generator.
"""
alternatives = [
    "rand's StdRng: rejected because its algorithm is not guaranteed stable across releases, which would move every bench baseline on a dependency bump",
    "One commit per decision: rejected because thousands of journaled commits take minutes and stamp wall-clock times",
    "Commit a fixture corpus to the repo: rejected because it puts megabytes of generated TOML in git and fixes size and anchored share",
]
