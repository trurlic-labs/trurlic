component = "code"
choice = "A span's tokens are every byte but whitespace and comments, by the lexicon each grammar declares; a Rust hash also leaves out the commas and braces rustfmt adds and removes"
reason = "A grammar's tree is no exact lexer of its language, and the hash must follow the language. Each leaf is a token, and each node of a lexical literal kind is one whole, so a string's prefix and delimiters are hashed and -1 and - 1 agree. A repetition's separator and what error recovery passes over lie in no node, so each run of such bytes is a token too. tree-sitter-rust lexes a comment as tokens after a repetition's separator, so a token that opens a comment by the grammar's declared syntax starts bytes no token is taken from. A metavariable $a written $ a is hashed as the two tokens Rust has. Each grammar states its literal kinds, comment delimiters and glued kinds as data in one Lexicon. rustfmt adds and removes what carries no meaning as lines break and join, so Rust's hashes leave out a list's trailing comma, but the one of a one-element tuple, and the braces around a closure's or a match arm's body of one expression, or of one return, break or continue, with that semicolon. A comma or a brace inside a macro's tokens stays: only the macro gives it a meaning. Python's and TypeScript's hashes keep every comma, as their trailing ones can carry meaning (a subscript's one-element tuple, an array's hole, TSX's <T,>)."
alternatives = [
    "Hash the leaves alone: rejected because a repetition's separator and an error's bytes are in no leaf, so changing them moved no hash",
    "Hard-code Rust's comment syntax in the token walk: rejected because each grammar the index adds has its own",
    "Leave a trailing comma in a macro's tokens out too: rejected because a macro may give it meaning, as a repetition without $(,)? refuses one",
    "State that a reformat moves the hash: rejected because every rustfmt run would then touch decisions in a diff review",
    "Name the silent tokens as Lexicon data of every grammar: rejected because the rule reads Rust's node kinds, and Python's and TypeScript's commas can mean something",
]
tags = [
