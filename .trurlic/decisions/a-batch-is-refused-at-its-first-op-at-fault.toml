component = "store"
choice = "Each op is checked against the graph the earlier ops left, and a refused batch names its first op at fault: its index, kind and target, the argument and the rule"
reason = "Later ops may build on earlier ones: a component added and then a decision recorded in it, a rename and then a revise of the new name. A fault in op 3 leaves the graph op 4 was written for unreached, so a fault reported for op 4 would describe a graph the batch never makes; the first fault is the one the caller fixes. Each op names the argument at fault within it (add_depends_on[1], component) and a typed Rule with a stable name (name_taken, not_found, depends_on_cycle, has_dependents, no_change, both_forms, not_held and the rest, store/apply/refusal.rs); Refusal::path joins them as the MCP field ops[3].add_depends_on[1]. An issue the final validation finds is attributed to the op that last changed a node it concerns."
alternatives = [
    "Report every failing op: rejected because an op after the first fault is judged against a graph that op never meant",
    "Check every op against the loaded graph, ignoring earlier ops: rejected because a batch could not add a component and then decide in it",
    "Refuse with a message only: rejected because a caller branches on the rule and the op, not on prose",
]
