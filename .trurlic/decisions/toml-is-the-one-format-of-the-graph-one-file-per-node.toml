component = "store"
choice = "TOML is the one format of the graph, one file per node: project.toml, components/<name>.toml and decisions/<name>.toml"
reason = """
Each node is a TOML file whose top-level keys are its fields, with no wrapper table and no name key: the file stem names the node. TOML was chosen for human readability and git-friendly diffs, and one file per node lets two branches that add different nodes touch different files. project.toml's format_version (FORMAT_VERSION) names the format; a change of shape appends a migration step. Every file is written in the canonical form, which leaves out an empty set or list, so a file holds only what it says.
"""
alternatives = [
    "One JSON file for the whole graph: rejected because every change conflicts with every other, and it is hard to read",
    "SQLite: rejected because a binary file is opaque in git diffs and adds a C library dependency for a store of a few thousand nodes",
    "YAML: rejected because its implicit typing (the Norway problem) makes values change meaning silently",
]
