component = "code"
choice = "A file the general resolver reads is test code whole in a test place its language's row lists, Python's tests/ and test_*.py and C's tests/ and *_test.* among them"
reason = "A file's bytes do not say whether pytest reads it as a test module, so the place is a rule of the second step over the tree, and the places are data in the language's row, as its query is, not a branch of code per language. A fixture in conftest.py, a helper module under tests/ and a module pytest collects by its name are test code though no test function stands in them. A place is a directory name anywhere above the file, or a file name in which one * stands for any run of characters. The rows list Python's tests/, test_*.py, *_test.py and conftest.py; TypeScript's __tests__/ and the *.test and *.spec names over .ts, .mts and .cts, a declaration file's __tests__/, and the *.test and *.spec names over .tsx, .js, .jsx, .mjs and .cjs for TSX; C's and C++'s tests/, test/, and the *_test and *_unittest names over each extension of the language. Rust's places stay Rust's own rule, its crate's tests directory and the forward walk of module declarations, since they need its crates."
alternatives = [
    "The bytes alone: rejected because a helper in conftest.py would be counted as code",
    "Places written as code per language in roles.rs: rejected because a language is data, and a new one would need code",
    "Read pytest's configuration for testpaths and python_files: rejected because the index keeps no INI or TOML values, and the defaults cover the conventional layout",
]
tags = [
    "python",
    "testing",
    "typescript",
]
