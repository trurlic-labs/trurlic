component = "code"
choice = "A C or C++ file's index is keyed by its content and the part of the tree's blank set it writes; its lexical pass is a cache entry of its own, keyed by its content"
reason = "A key that holds the tree's whole set makes the tree one unit: an empty #define added anywhere indexes every C and C++ file anew. A file's blank depends only on the blankable names it writes outside directives, comments and literals, and on whether its place is a test place's, so its key holds what it blanks of the set of its place, and a #define a header adds indexes anew only that header and the files that write its name. Which names a file writes, and its #defines, come from one lexical pass, cached by the file's content as an index is, so an unchanged file is never lexed again. Its key holds the identities of both grammars, whose words it reads, and none of their query files, which it never reads, so an edit of a query lexes no file again; the call's own misses are read before the store, so a header lexed for the tree's sets is not lexed again for its key. The headers are read first, for the sets, and read again when they are indexed, as every other file is read once for its index. A lexical entry is bounded by its file as an index is: a read charges each value its weight against the room of the file it is read for and refuses an entry past it."
alternatives = [
    "The tree's set in every C and C++ key: rejected because one #define added anywhere indexes the whole tree anew",
    "The lexical pass run afresh each call: rejected because it reads and lexes every C and C++ file a second time, the largest cost of a warm check",
    "The lexical pass inside the index's entry: rejected because two trees of one content and different sets would then overwrite each other's entry",
    "A header's digest from the first read keying its index, so a cached header is read once: rejected because the second read of a tree's headers costs a few milliseconds of one core on hundreds of headers, less than the code that avoided it",
]
status = "proposed"
