reason = "Decisions older than STALENESS_THRESHOLD_DAYS (90 days) are flagged as stale during advance(). Stale decisions trigger the Review task type via inference and drive the DriftCheck step, which instructs the agent to compare each decision against current source code and call update_decision for any that have drifted. This prevents architectural documentation from silently diverging from the implementation over time."
