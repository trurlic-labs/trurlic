component = "store"
choice = "Every write goes through a flushed journal in .state/txn.toml, which carries the message of its history commit, lands once the journal is in place, and whose deletion is flushed"
reason = "Renaming staged files one by one left the earlier renames on disk when a later one failed. commit_batch stages and flushes every file, then renames the journal (each staged file, its target and the BLAKE3 of its bytes, the files to remove, and under shared the message of the history commit) to .state/txn.toml and flushes .state/: the commit point. apply_journal renames, removes, flushes each touched directory, makes the history commit, deletes the journal and flushes .state/ again before the writer returns and releases the lock. A journal is thus on disk exactly while its write is unfinished: one that came back after a power loss would remove a file re-created since and commit a later hand edit as the write's, a second history commit for one write. Replay skips a write whose staged file is gone and one whose target holds the staged bytes; a staged file with other bytes is BadJournal. After the commit point a failure is WritePending. A commit of two files does 9 flushes."
alternatives = [
    "Leave the deletion unflushed and make replay a no-op for a finished journal: rejected because a removal cannot tell a file never removed from one re-created since, and a later hand edit would be staged as the write's",
    "Rename in order with the last file as the only commit point, no journal: rejected because a failed rename left a graph that matched neither commit",
    "A journal holding the new file contents: rejected because it doubles the bytes written per commit and still needs every target flushed",
    "An undo log rolled back on recovery: rejected because a commit that failed after its journal would have to be undone by whoever opens next",
]
