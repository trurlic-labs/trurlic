[decision]
component = "store"
choice = "Every commit goes through a flushed journal in .state/txn.toml and lands once the journal is in place"
reason = "Renaming staged files one by one with graph.toml last protected only against a crash before graph.toml's rename: a rename that failed midway left the earlier renames on disk while the caller rolled memory back, and an abort after graph.toml during remove decision left the decision file behind, so status counted it again while check passed. commit_batch now stages and flushes every file and flushes .state/tmp/, raises the generation, then stages the journal (each staged file, its target and the BLAKE3 of its bytes, plus the files to remove), renames it to .state/txn.toml and flushes .state/. That rename is the commit point. apply_journal renames in order (graph.toml last, so unlocked readers see the old index until every node file is in place), removes, flushes each touched directory, then deletes the journal without a flush, since a journal that reappears applies again as a no-op. After the commit point a failure is Error::CommitPending: the commit is recorded, not rolled back. Store::recover applies a leftover journal under the exclusive lock before anything loads: begin_write does it for every write on every surface, try_recover when a command starts, and a watcher that sees a journal under its shared lock takes the exclusive lock to apply it. Replay skips a write whose staged file is gone (already renamed), and one whose target holds the journal's bytes while its temp name holds another write's leftover (temp names recur once pids wrap). A staged file with other bytes and no such target, an unparsable journal, or a path outside the store is refused with Error::BadJournal naming the file. Cost measured on WSL2 ext4 (fsync about 5 ms): a commit of two files does 8 flushes, and an MCP add_component went from 3.5 ms to 40 ms median."
alternatives = [
    "Rename in order with graph.toml as the only commit point, no journal: rejected, a failed rename or an abort after graph.toml left a graph that matched neither the old commit nor the new one",
    "Journal holding the new file contents (redo log): rejected, doubles the bytes written per commit and still needs every target flushed before the journal may go; naming the already staged files plus their hash costs one small file",
    "Undo log rolled back on recovery: rejected, needs the old contents saved before every rename, and a commit that failed after its journal would still have to be undone by whoever opens next",
    "Refuse to load while a journal is pending and leave it to a human: rejected, users work through MCP only, so a commit that stops after its commit point must heal on the next write without a person",
]
tags = [
    "reliability",
    "storage",
    "concurrency",
]
attribution = "agent"
created = "2026-10-02T12:18:34.628311449Z"

