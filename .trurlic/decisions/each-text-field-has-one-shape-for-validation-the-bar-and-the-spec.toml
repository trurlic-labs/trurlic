component = "store"
choice = "Each text field has one shape in store::model::text: a choice one line of 200 bytes, an alternative one line of 1,000, a tag one line of 128, an origin one line of 200, a description any prose"
reason = "One table of shapes in store::model::text serves validation, the bar and the apply spec, so no surface drifts. Alternatives and tags are elements of a list, each one statement or label, and a line break in one hides an element from a reader of the file; an origin becomes a commit trailer, where a line break forges another. A component's description may be blank or span lines: a migrated component has none, and a description is prose like a reason. An alternative of at most 1,000 bytes makes one record unable to pass the cap a load reads: a hundred of them, every byte escaped and kept twice in a revision's accepted text, are 400 KB, and the largest record with its accepted text is about 790 KB, which the limits test holds."
alternatives = [
    "Bound an alternative at the 50,000 bytes of a reason: rejected because a hundred of them make one record far larger than a load reads",
    "Let a tag hold any text: rejected because an empty tag or one on two lines is written and shown as no label",
]
