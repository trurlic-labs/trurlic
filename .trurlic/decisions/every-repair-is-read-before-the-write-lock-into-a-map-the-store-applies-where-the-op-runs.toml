component = "mcp"
choice = "repair_anchors with no repairs is filled before the write lock with every repair check shows, as a map the store applies where the op runs, leaving one the bar refuses or cannot judge"
reason = "The repairs check shows are what the op writes, so a reader can see them before running it. Reading them walks the code tree and runs the project's git, which under the exclusive lock would hold every other writer for as long as git takes, and would keep the index's cache from filling, since its write needs the lock free. So apply's Access::Write has a read step that runs with no lock held, loads the graph as a read does, gathers the findings with sources::checked_findings and compiles the bar; then the writer takes the lock. What the read hands the write is keyed by anchor, since the graph can change in between. The caller wrote none of these repairs, so none may refuse the batch: the store, under the lock and over the batch's caches, judges each repair on the anchor it brings and leaves one a refuse pattern matches or a pattern cannot judge, the rule its cause. An earlier op of the batch can so never turn one into a refusal. The result lists what was written and the stale anchors left with their causes, stated against the graph the write left under its lock, under the names there; as many as fit the budget, the rest counted, and trurlic check lists every one."
alternatives = [
    "Read the repairs under the writer's lock: rejected because a slow git or a large tree would hold every other writer past its lock timeout, and the index's cache would never fill",
    "Hand the write the repairs as an explicit list: rejected because a list names what earlier ops may have renamed or removed, and is refused naming an argument the caller never wrote",
    "Refuse the batch on a repair the bar refuses: rejected because the caller wrote no such repair, and one would keep every other repair from being written",
    "Leave the stale anchors left out of the result: rejected because the reader then cannot tell repaired all from repaired some",
    "Sift the repairs before the lock over a scan of their own: rejected because the write's caches, filled by the ops before, can still give up on a repair the sift passed",
]
