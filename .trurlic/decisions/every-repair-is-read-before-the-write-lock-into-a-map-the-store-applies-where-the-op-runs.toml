component = "mcp"
choice = "A repair_anchors op with no repairs is read before the write lock, as check reads the findings, into a map the store applies where the op runs; the result lists repaired and left within the budget"
reason = "The repairs check shows are what the op writes, so a reader can see them before running it. Reading them walks the code tree and runs the project's git, which under the exclusive lock would hold every other writer for as long as git takes, and would keep the index's cache from filling, since its write needs the lock free. So apply's Access::Write has a read step that runs with no lock held, loads the graph as a read does, and gathers the findings with sources::checked_findings; then the writer takes the lock. The graph can change in between, so what the read hands the write is keyed by anchor, never by decision: the op carries the map of stale anchor to repair, and an earlier op of the batch, a second such op, or another write in between cannot turn it into a refusal. The result lists each repair the store made, read from Applied::repaired, and the stale anchors left, stated against the graph the write left under its lock: each decision ever accepted holding an anchor the tree showed no repair for, under its name there. As many as fit the budget are listed and the rest counted; trurlic check lists every one."
alternatives = [
    "Read the repairs under the writer's lock: rejected because a slow git or a large tree would hold every other writer past its lock timeout, and the index's cache would never fill",
    "Hand the store the repairs as an explicit list: rejected because a list names decisions and anchors the earlier ops of the batch may have renamed or removed, and is refused naming an argument the caller never wrote",
    "Drop an op that finds nothing to repair: rejected because every later op's index in a refusal would shift, naming an op the caller did not write there",
    "Leave the stale anchors left out of the result: rejected because the reader then cannot tell repaired all from repaired some",
]
tags = [
