component = "tools"
choice = "A tool delegates every disk write to the store's Writer, and neither tools nor a surface above it touches a file under .trurlic/"
reason = """
A write tool runs on a Writer its entry begins for the call: ToolSpec::run hands a spec-built tool whose Access is Write the Writer of Store::begin_write, which holds the exclusive lock and the graph loaded under it, validates, commits through the journal and keeps its graph equal to disk. apply is the one write tool: its handler turns the parsed arguments into a store::Batch and calls Writer::apply, which holds every rule; status, get_context and get_decisions_for_file are reads on Store::load_state. The tool layer parses arguments and builds the JSON result, and the MCP server and the CLI twins only carry it, but none opens a file under .trurlic/, so the store stays the single authority for disk mutations and no tool bypasses its atomic write guarantees.
"""
alternatives = [
    "A tool writes TOML files directly: rejected because it would bypass the atomic writes, the file lock and validation in the store",
    "A separate write layer between the tools and the store: rejected because the Writer already is the right abstraction",
]
tags = [
    "data-integrity",
    "module-boundary",
]
