component = "store"
choice = "store::text is what every decision file holds, an issue check reports; the quality bar binds only writes, so a graph below it loads, passes check and stays revisable"
reason = "A text rule guards what a reader sees: a blank text, a hidden, reordering or control character, tool-call markup, a choice on two lines or past 200 bytes. A hand edit that breaks one must fail check, so validation reports it as InvalidChoice or InvalidReason. The bar measures how good a decision is: at least one alternative and one anchor, and the limits and patterns of the project's [quality]. A migrated graph holds decisions without alternatives or anchors, and a project may tighten its bar at any time; as validation issues, the bar would fail check on every such graph at once. So the bar refuses a write alone, Bar::judge runs both kinds of rule for a write in one order, and the breaches a graph already holds are a section of status, never an issue of check."
alternatives = [
    "Make the bar validation issues: rejected because every migrated graph and every tightened [quality] would fail check at once",
    "Move the text rules into the bar: rejected because a hand edit holding a bidi control or a leaked tool call would then pass check",
]
