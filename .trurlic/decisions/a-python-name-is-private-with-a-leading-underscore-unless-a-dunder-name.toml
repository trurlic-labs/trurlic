component = "code"
choice = "A Python definition whose name starts with an underscore is private unless it is a dunder name such as __init__; every other name is public"
reason = "A count of definitions with and without the private ones needs each definition's visibility, and Python has no modifier: a leading underscore is the language's own convention for a name a module or a class keeps to itself, which PEP 8 states and import * and name mangling honour. A dunder name such as __init__ or __all__ starts with an underscore but is a protocol the language reads from outside the class or module, so it is public, as is every name without the underscore, the language's default. The rule is the query's: each definition pattern sets visibility public, and a visibility.private mark on each identifier that matches ^_ and not ^__.*__$ overrides it, so it holds alike for a def, a class and a name a module or a class binds."
alternatives = [
    "No visibility for Python: rejected because the underscore is how Python states privacy, and a count could not leave private helpers out",
    "A dunder name private too: rejected because __init__ and __all__ are read from outside the class or module",
    "No visibility for a name without the underscore: rejected because a count of public definitions would then lose every plain name",
]
