component = "code"
choice = "A definition the general resolver finds is under the innermost definition or unnamed scope whose captured node holds its own @definition node, two of one node being siblings"
reason = "A query pattern names a fixed nesting and cannot say the enclosing class however deep, so containment comes from the nodes the patterns capture: sorted by start, the widest first, each definition is under the innermost open definition whose @definition node holds its own, and one whose pattern sets container false opens none. The captured node places, not the span grown from it: const f = () => { function g() {} }, a = 1 is one statement, and each declarator holds what its own node holds, so g is f::g and a holds nothing. Two definitions of one node, the readings of one declarator, are siblings. A node an @scope.unnamed capture marks, a function, method or class no name stands for, is a container of its own that within never admits, so a callback's locals define nothing; what it defines takes its path from the definition around it, so describe(a) with a function f in its callback holds a::f. What an unnamed scope holds where no definition holds it defines nothing, since no path could say where it stands; a definition that captures the scope's node names it. within keeps a definition only at the file's top or in containers of the kinds it names, and kind.in gives it another kind in a container of a kind. A span grows from the captured node through the definition.via ancestors to the first definition.to one, or the match is dropped, over the definition.wrap ancestors right above it, and over the definition.preceding siblings right before it, comments between included. A visibility mark applies to a definition whose span holds it, and a @visibility.within mark to each definition whose name it holds that no such mark gives one. A name with no text defines nothing."
alternatives = [
    "Containment by the grown span: rejected because the declarators of one statement share it, and whatever one held landed under the last",
    "An unnamed function's locals at the file's top: rejected because a callback's or a CommonJS export's locals read as module variables, two callbacks' locals as one path",
    "A segment of its own for each unnamed scope: rejected because every unnamed scope of a file would share it, merging unrelated functions under one path",
    "A method pattern listed before the function pattern, a tie going to the earlier: rejected because the order of patterns would carry a meaning no refusal shows",
]
