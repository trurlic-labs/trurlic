component = "code"
choice = "A definition the general resolver finds is under the innermost definition or unnamed scope whose captured node holds its own @definition node, two of one node being siblings"
reason = "A query pattern names a fixed nesting and cannot say the enclosing class however deep, so containment comes from the nodes the patterns capture: sorted by start, the widest first, each definition is under the innermost open definition whose @definition node holds its own, and one whose pattern sets container false opens none. The captured node places, not the span grown from it, so each declarator of one statement holds what its own node holds. Two definitions of one node are siblings. A node an @scope.unnamed capture marks is a container of its own that within never admits, so a callback's locals define nothing; what it defines takes its path from the definition around it, and what no definition holds defines nothing (an Express route handler). A node an @scope.none capture marks is no scope: what it holds stands where it stands, as in a class a name binds or a wrapper of a whole file (what-a-typescript-file-defines). within keeps a definition only at the file's top or in containers of the kinds it names, and kind.in gives it another kind in a container of a kind. A span grows through definition.via ancestors to a definition.to one, over definition.wrap ancestors and definition.preceding siblings. A visibility mark applies to a definition whose span holds it; an @export.name capture, met in the same sweep, to each definition of its name directly in the container that holds it, wherever in the file either stands; a @visibility.within mark to each whose name it holds that neither gives one; and a @visibility.after label to each whose name lies in a later sibling, over all three. A name with no text defines nothing."
alternatives = [
    "Containment by the grown span: rejected because the declarators of one statement share it, and whatever one held landed under the last",
    "An unnamed function's locals at the file's top: rejected because a callback's or a CommonJS export's locals read as module variables, two callbacks' locals as one path",
    "A segment of its own for each unnamed scope: rejected because every unnamed scope of a file would share it, merging unrelated functions under one path",
    "Every top-level callback as the module: rejected because an Express route handler's or a jest.mock factory's locals would read as module variables",
]
