[decision]
component = "session"
choice = "Bootstrap uses graph state as implicit session — no session file"
reason = "Unlike the interactive design driver which persists a session JSON file, the bootstrap driver has no session persistence. The graph IS the session state: `advance()` deduces the next step from what components, decisions, and patterns already exist in `.trurlic/`. If bootstrap is interrupted, re-running it picks up from the current graph state automatically. This eliminates a class of stale-session bugs for the autonomous mode."
alternatives = [
    "Persist a bootstrap session file like the design driver — rejected: adds complexity for no benefit since advance() is deterministic from graph state and bootstrap has no user dialogue history to preserve.",
    "Checkpoint file tracking completed steps — rejected: the advance state machine already provides this via graph postconditions.",
]
tags = [
    "persistence",
    "resilience",
]
attribution = "user"
created = "2026-06-15T09:45:05.797299254Z"
