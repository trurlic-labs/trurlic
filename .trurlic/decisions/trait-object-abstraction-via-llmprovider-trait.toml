[decision]
component = "provider"
choice = "Trait object abstraction via LlmProvider trait"
reason = "All provider clients implement a single `LlmProvider` trait with `stream_completion` and `provider_name` methods. Callers hold `Box<dyn LlmProvider>`, completely decoupled from concrete client types. The trait uses `Pin<Box<dyn Future>>` return because async traits were not stable when designed, and the pinned future approach avoids proc-macro dependencies. This keeps the session module provider-agnostic — it never imports a concrete client."
alternatives = [
    "Enum dispatch (single enum with variants per provider) — rejected because adding a new provider would require modifying the enum and every match arm, violating open/closed principle",
    "async-trait proc macro — rejected to avoid runtime proc-macro dependency, consistent with project invariant of no proc macros at runtime",
]
tags = [
    "abstraction",
    "extensibility",
]
attribution = "user"
created = "2026-06-15T09:44:19.191417120Z"
