[decision]
component = "map"
choice = "File watcher with 50ms debounce pushes diffs over WebSocket broadcast"
reason = "A file watcher monitors .trurlic/ for external changes (from MCP writes, CLI commands, or git operations). On change, it reloads state from disk, diffs against the previous snapshot, and broadcasts only the delta over the WebSocket channel. The 50ms debounce is lower than the MCP watcher's 100ms because the interactive UI benefits from faster updates at the cost of slightly more reloads during multi-file operations. The watcher swaps the in-memory ProjectState under a write lock after broadcasting events, so WebSocket clients see the diff before the state changes — ensuring they can process events against a consistent baseline."
alternatives = [
    "poll-based change detection: higher latency and CPU cost compared to OS-native file notifications",
    "require all mutations through the map API (no external watcher): would break the multi-writer model where MCP, CLI, and map coexist",
    "higher debounce (e.g. 500ms): would make the interactive UI feel sluggish after CLI/MCP edits",
]
tags = [
    "concurrency",
    "performance",
]
attribution = "user"
created = "2026-06-15T09:45:37.055046272Z"
