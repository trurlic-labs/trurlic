component = "store"
choice = "apply charges the [quality] patterns' work over what a batch writes before any pattern runs, and refuses a batch past MAX_PATTERN_WORK at the op where the sum passes"
reason = "A pattern near the compile limit costs over a hundred microseconds per byte on the PikeVM, so a batch of fifty ops at the field bounds held one writer and its lock for minutes. The work unit of the lint section bounds that time too: each op holds what it writes to the text rules and the limits as it runs and keeps the decision; once the ops have run, the work over the batch's origin and each kept decision is summed in op order. A sum past the bound refuses the batch as pattern_work at the op where it passes, with the work and the bound, before any pattern runs. An op past the bound alone names its costliest pattern by index, since splitting the batch cannot help it. Within the bound the patterns judge the origin, then each kept decision. A refusal of theirs comes before the fault that stopped the ops, as an op's bar comes before its later checks, so every other refusal names the op it named before. One bound serves the report and the write: a call at it costs at most about 14 s of CPU, and a batch of fifty decisions of the seeded corpus under the shipped table charges about a twentieth of it."
alternatives = [
    "Charge each op as it runs and judge its patterns there: rejected because a batch past the bound would run its earlier ops' patterns, seconds of work, before the refusal",
    "A cap on a pattern's states at compile: rejected because the cost is states times text, and a cap low enough for long texts refuses patterns that serve short ones",
    "A bound of its own for writes: rejected because the cost per state-byte is the engine's, the same for a report and a write, and one number states one promise",
]
tags = [
    "performance",
    "quality",
]
