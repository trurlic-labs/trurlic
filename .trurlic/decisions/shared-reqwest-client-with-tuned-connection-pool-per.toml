[decision]
component = "provider"
choice = "Shared reqwest::Client with tuned connection pool per provider instance"
reason = "A single `reqwest::Client` is built in `create_provider` with explicit timeouts (30s connect, 90s pool idle, 60s TCP keepalive) and a versioned user-agent string. This client is passed into the concrete provider struct and reused across all requests. reqwest::Client internally manages a connection pool, so reusing one client avoids redundant TLS handshakes and DNS lookups across multiple LLM calls in a session. The timeouts are tuned for LLM APIs which can be slow to respond but should connect quickly."
alternatives = [
    "Create a new Client per request — rejected because it wastes TLS handshakes and connection setup on every call",
    "Global static Client — rejected because different providers may need different configurations, and a static would complicate testing",
]
tags = [
    "performance",
    "reliability",
]
attribution = "user"
created = "2026-06-15T09:44:56.057399532Z"
