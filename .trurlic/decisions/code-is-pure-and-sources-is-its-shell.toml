component = "code"
choice = "code takes a file's kind and bytes, or the gathered facts of a tree, and returns values; sources walks, reads and caches, and is the one way a command reaches the index"
reason = "The index is pure so its rules are tested on bytes alone, and the same function serves a file on disk now and a blob at a git revision when a diff review compares two revisions. A file's index is a function of its kind and bytes, which is what lets a cache key it by content. What depends on other files, the types a crate's macros define and the files that are test code whole, is a second pure step over the indexes of the tree. The shell gathers those facts once per call: it walks the code root, reads each file within a bound, reads and fills the cache through the Store, and hands code a map of entries. Its entry point is sources::resolve_anchors; mcp and commands will both read it, so it is a module neither owns, and code never imports it. A test holds code to an allow list closed by construction, reading every token of its non-test code, macros included. A path may reach only the pure modules of std, core and alloc, the crate's code and the store's Anchor, and the crates tree_sitter, its grammars tree_sitter_rust and tree_sitter_python, blake3 and toml. A glob or alias of a root, extern crate, #[path] and the prelude macros that read files or the environment or print are refused, but for include_str! of a plain relative path that stays inside src/code, a language's query file, which is source of the index as its Rust files are. Still unseen: a macro the crate root defines before mod code (none), what an allowed crate does with a handle code cannot name, and what a caller hands in."
alternatives = [
    "Let code read files as it resolves: rejected because the rules could then be tested only on a tree on disk, and a git blob would need a second path",
    "Put the shell in commands: rejected because the status tool in mcp needs it too, and mcp does not import commands",
    "A clippy configuration that denies std's I/O items: rejected because a deny list of std is never complete, and thirteen items and a #[path] module passed it",
    "Compile code as a no_std crate in a test: rejected because every file would need alloc paths and code uses tree-sitter's std API",
]
tags = [
