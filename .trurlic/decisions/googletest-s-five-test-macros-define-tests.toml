component = "code"
choice = "TEST, TEST_F, TEST_P, TYPED_TEST and TYPED_TEST_P define a test Suite::Name whose block is test code; no other macro call is a test"
reason = "A C++ test is a macro's call with a block, and a proof names the test it ran by its suite and its name, so googletest's five test macros define a test whose segments are their two arguments as written, and what the block holds is test code. Catch2 and doctest name their tests by strings beside a block the grammar keeps apart, which needs an engine feature no project read so far has asked for, and a project's own test macro (jemalloc's TEST_BEGIN) is not read as a test, since nothing in its call says it is one. Which C and C++ files are test code whole is a rule of the language rows (test-code-by-place-is-a-row-of-its-language)."
alternatives = [
    "Catch2's and doctest's TEST_CASE and SECTION too: rejected because no project read so far uses them and their block needs an engine feature",
    "Any macro call with a block as a test: rejected because a project's helper would become a test",
]
