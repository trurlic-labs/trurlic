[accepted_text]
choice = "A TypeScript span hash takes a string or regex as one token, walks a template string, groups each statement and member, drops a ; or , ending one and an empty JSX expression"
reason = "Automatic semicolon insertion makes a line break carry syntax that no token holds: return then x on the next line is two statements, return x one. The query marks each statement of a program, a block or a switch case, and each member of a class, an interface or a type literal, a group whose marks enter the hash, so the two hash apart; with groups in place the ; that ends a statement and the ; or , that separates two members carry nothing and are left out, so a file with and without semicolons hashes alike. A string and a regular expression are one token with their spaces, quotes as written: prettier's change of quotes, of a trailing comma and of the parentheses around an arrow function's one parameter moves the hash. A template string is walked: its text runs are tokens with their spaces, while a space or a comment inside its ${} moves nothing, and a definition inside one is found. A JSX comment is written {/* c */}, whose braces are tokens: a JSX expression that holds no expression, a comment or nothing, is left out whole. JSX text is hashed as JSX renders it, a token a character and an empty one a run of whitespace, a run at an end of the text that holds a line break dropped, so a reformat moves nothing, <b>Hi</b> there hashes apart from <b>Hi</b>there, and a{/* c */}b hashes as ab."
alternatives = [
    "Hash the leaves alone: rejected because a statement split by a line break would leave the hash as it was",
    "A template string as one token: rejected because a space or a comment inside its ${} would move the hash",
    "JSX text verbatim: rejected because a formatter that rewraps it would read as a change to the code",
]
