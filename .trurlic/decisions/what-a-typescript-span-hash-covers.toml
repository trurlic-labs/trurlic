component = "code"
choice = "A TypeScript span hash holds under prettier's layout and options: quotes, escaped quotes, semicolons and the commas, parentheses and operators of no meaning are out; JSX text as it renders"
reason = "A line break carries syntax no token holds: return then x on the next line is two statements, return x one. So each statement of a block or a switch case and each member of a class, an interface or a type literal is a group whose marks enter the hash; then the ; that ends a statement, an empty statement in a block or a case (semicolon-free code's guard before [ or ( ) and the ; or , between members are left out. Any other token a formatter trades is left out only where no program of another meaning differs by it alone: a string's quotes, and its escapes, each spelled by what it means, an escaped quote as the quote (a JSX attribute's string has no escapes); a trailing comma in a list with no holes, but not where a hole precedes it ([a,,]) or after a rest element; the parentheses of an arrow's one parameter of no type, default or decorator, the arrow taking no type parameters or return type; parentheses around a return's or a throw's value, a conditional's branch but a sequence, a conditional arrow body, a JSX element, a tuple's element type and a conditional type's branch; a union's or an intersection's leading operator. A template string is walked, its text runs tokens with their spaces, never a quoted string's. JSX text is hashed as TypeScript's and Babel's transforms render it: spaces and tabs within a line as written, a run of whitespace that holds a line break one space between text and dropped at an end, character references among the text; {\" \"} is its spaces, and an empty or comment expression is left out. A jest each table prettier aligns moves its test's hash: a template's spaces are its text."
alternatives = [
    "Hash the leaves alone: rejected because a statement split by a line break would leave the hash as it was",
    "Every comma and parenthesis in the hash: rejected because prettier writes them by line width and option, so a reformat of a tree would move most of its hashes",
    "Leave out a trailing comma wherever a closer follows: rejected because [a,,] has a hole [a,] lacks, and a query's anchor cannot tell the last comma from the one before it",
    "Each run of JSX whitespace as one space: rejected because JSX keeps the spaces within a line, which pre and React Native's Text render",
    "A template string as one token: rejected because a space or a comment inside its ${} would move the hash",
]
