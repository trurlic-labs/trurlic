component = "store"
choice = "Validation holds every decision's choice and reason to store::text, so a hand edit that breaks a text rule is an issue check reports"
reason = """
The rules used to run only in the write tools, so text already on disk was never checked; with a hand edit now the only write, that would leave every decision unchecked. ProjectState::validate calls store::text::fault on each decision's choice and reason and reports InvalidChoice or InvalidReason naming the file, the field and the fault with its byte offset, so every surface, every hand edit and any later write tool are held to one rule set with one message.
The rules: a choice is one non-blank line of at most MAX_CHOICE_BYTES; a reason holds at least MIN_REASON_BYTES besides surrounding whitespace, at most MAX_TEXT_FIELD_BYTES, and may keep newline and tab; neither carries a C0 or C1 control, DEL, a bidi control, a zero-width character or U+2028/2029, which render as nothing or reorder text, so a reader would not see what an agent is held to; and neither carries tool-call markup, which only lands in a text when a model's call was malformed.
A broken text is an issue, not a load failure, so status and the reads still answer and check names every fault in one run. tests/integration/decision_text.rs writes one decision file per class and requires check to name each.
"""
alternatives = [
    "Check text only in the write tools, as before: rejected because a hand edit, now the only write, would bypass every rule",
    "Fail the load on a text fault: rejected because one character in one file would stop status, check and every read",
    "Normalize instead of reporting (strip controls, join lines): rejected because it silently changes what the author wrote and keeps a leaked tool-call fragment as content",
]
