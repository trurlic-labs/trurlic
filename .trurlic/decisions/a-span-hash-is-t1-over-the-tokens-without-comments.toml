component = "code"
choice = "A span hash is t1: and the BLAKE3 of a span's units, each token after its length, each group mark a length no token has, a nested definition its hash; a lexical span hashes its normalized text"
reason = "A diff review compares a definition's hash between two revisions to tell whether a change touched it. So the hash must move with what the code does and stay put under what it does not: a reformat, a comment, a doc comment. The tokens of the parse tree cover every byte but comments and whitespace (a-tree-sitter-span-s-tokens-are-the-language-s-whatever-the-grammar-lexes). Each token goes in after its length, so a b and ab differ. A grammar whose layout is syntax no byte holds, as Python's is, has its query mark groups, each opened and closed by a mark no length takes. A definition nested in the span goes in as its own hash, after a mark no length takes, so each unit is hashed once however deep the definitions nest. An edit inside still moves every hash around it. A query's definition hashes the units its span node holds in the tree, so a group's mark belongs to the node holding it and a definition's hash never depends on what follows it. A node a query takes whole that a definition's span starts inside is walked, so a token never hides a definition. A Rust item's span takes in its attributes and doc comments, and the hash drops the comments. A TOML key, a JSON key, a Makefile rule and a Markdown section are hashed by their text, each run of whitespace made one space. The scheme prefix names the rules and is fixed from the scheme's first release: no t1 hash was released before these rules, and a later change is t2."
alternatives = [
    "Hash the span's raw bytes: rejected because every reformat and comment edit would read as a change to the code",
    "Hash the tokens without lengths: rejected because two token runs that join to the same bytes would hash alike",
    "Hash every definition over all its own tokens: rejected because a token n definitions deep is hashed n times, which a file of nested items makes quadratic",
    "Hash the leaves alone: rejected because a repetition's separator and an error's bytes are in no leaf, so changing them moved no hash",
    "No scheme prefix: rejected because a stored hash would silently compare against one computed by other rules",
]
