component = "store"
choice = "Each edge lives in its source file: connects_to in a component, component and depends_on in a decision; A constrains B is written as B depends_on A"
reason = """
With no index, an edge must live in a node file, and its source's file is the one place it has: a decision states which component it belongs to and what it depends on, a component what it connects to. constrains stated the dependency of depends_on from the other end, so it is folded into it: the decision held by a rule depends on that rule, and the edge sits in the file of the decision that relies on it. A new decision's edges are in its own new file, and an edge added to an existing set is one line of a sorted list, so two branches that add edges merge (tests/integration/git_merge.rs). An edge to no node is an issue check reports, not a load failure.
"""
