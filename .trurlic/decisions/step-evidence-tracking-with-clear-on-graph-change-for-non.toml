[decision]
component = "session"
choice = "Step evidence tracking with clear-on-graph-change for non-verifiable steps"
reason = "Some steps (e.g. VerifyConstraints, WalkDecisions, CoverageAudit) have no verifiable graph postcondition — they complete through dialogue alone. The session tracks `step_evidence: BTreeMap<String, String>` mapping step names to the user's last input. When advance() sees a step in evidence, it skips it. When decisions are recorded (graph changes), evidence is cleared so the full step sequence re-evaluates against the new graph state. This prevents infinite loops on non-verifiable steps while ensuring graph changes trigger fresh evaluation."
alternatives = [
    "Always re-run non-verifiable steps — rejected: causes infinite loops since advance() would keep returning the same step.",
    "Count-based completion (run step N times then move on) — rejected: arbitrary and disconnected from actual dialogue quality.",
    "LLM signals step done via a keyword — rejected: unreliable; the DESIGN_COMPLETE signal is used only for full session completion, not individual steps.",
]
tags = [
    "data-flow",
    "resilience",
]
attribution = "user"
created = "2026-06-15T09:45:36.102256737Z"
