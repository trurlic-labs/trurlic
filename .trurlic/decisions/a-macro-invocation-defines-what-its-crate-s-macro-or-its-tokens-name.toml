component = "code"
choice = "An invocation defines the type the arm it opens gives the name after its words, with the items of the impls of that name in the rules it reaches, and every item its own tokens spell"
reason = "tree-sitter leaves a macro invocation's tokens unparsed, and real code defines types and functions through macros, so two lexical rules read them. First, a macro_rules! macro of the crate, or a #[macro_export] one of the workspace, defines a type where it is invoked. The invocation opens the arm of least place whose literal words it opens with, at most eight. The name after the words must be a word and no keyword, and the pattern's token right after the name must be the invocation's: an arm is never chosen by position alone, so no arm word becomes a phantom type. The arm's rule gives the kind, by its own type keyword or by a hand-off (a-name-handed-to-another-macro-is-received-by-the-rules-its-arguments-fit). The type holds the items of each impl whose self type is the name the rule receives, alone or with generic arguments, a trait impl's under Name::<Trait>. An impl of another type gives it nothing, and the reached rules' other items stand under the invocation's container. A type the file writes directly beside an invocation that defines it too is one set with it, unless the direct one lies inside the invocation's own tokens. Every path is held to MAX_NESTING and the expansion's memory to its budget of bytes, the names a macro gives shared. pyo3's create_exception! and import_exception! are listed by argument position. Second, an item keyword followed by a name, not a keyword, a path or a rename (enum B as C), is a definition under the invocation's container, spanning to its body or to the next item."
alternatives = [
    "Expand macros fully: rejected because it needs a Rust compiler's name resolution and macro engine, far past what an anchor asks",
    "Pick the arm of least place by its words alone: rejected because an arm with no words then bound an arm word or a keyword as the name and invented a type",
    "Give the type the items of every impl that names a metavariable: rejected because impl From<$name> for String and impl $other are impls of other types",
    "Only the spelled-item rule: rejected because id! { OrderId(u32) } spells no keyword, so the type it defines would be missing",
]
