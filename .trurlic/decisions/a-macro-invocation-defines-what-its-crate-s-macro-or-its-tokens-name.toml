component = "code"
choice = "An invocation defines the type a type-defining macro gives the name after an arm's words, with the items of the macro's impls of that type, and every item its own tokens spell"
reason = "tree-sitter leaves a macro invocation's tokens unparsed, and real code defines types and functions through macros, so two lexical rules read them. First, a macro_rules! macro whose arm opens, after an optional attribute repetition, with at most eight literal words and a $name:ident a body defines a type of, defines that type where it is invoked with those words, its kind the keyword of the arm's own body or of the arm that body hands the name to; the macro is the crate's own or a #[macro_export] one of the workspace. An impl in any body whose self type is a metavariable some arm binds as an ident gives the type its items, a trait impl under Name::<Trait>, which is an Impl, the trait's metavariables read as the name; an impl of any other type, From<$name> for String, gives it nothing. The other items at a body's top level are items of the invocation's container; an item reached only through a recursive call's tokens is not seen. An invocation finds its arm in a table by macro name and words, built once per crate, and what a file's invocations add is spent from a budget of the bytes they span, every path held to MAX_NESTING. pyo3's create_exception! and import_exception! are listed by argument position. Second, an item keyword followed by a name, not a path, in an invocation where an item or statement stands is a definition under its container, spanning to its body or the next item, with the fields and variants its braces hold."
alternatives = [
    "Expand macros fully: rejected because it needs a Rust compiler's name resolution and macro engine, far past what an anchor asks",
    "Give the type the items of every impl that names a metavariable: rejected because impl From<$name> for String is no impl of the type",
    "Scan every arm of every visible macro per invocation: rejected because thousands of arms times thousands of invocations took seconds",
    "Only the spelled-item rule: rejected because id! { OrderId(u32) } spells no keyword, so the type it defines would be missing",
]
