component = "code"
choice = "An invocation defines each name every rule it may open defines alike, with the members and items they all give, and each item its own tokens spell where its path is told"
reason = "tree-sitter leaves a macro invocation's tokens unparsed, and real code defines types and functions through macros, so two lexical rules read them. First, a macro_rules! macro the file reaches defines a type where it is invoked (a-macro-name-reaches-the-invoking-file-s-own-macros-first). Rust takes the first rule an invocation's tokens match. The index lines the tokens up with each rule's opening (one-matcher-lines-tokens-up-with-a-rule-s-opening), and the candidates are each rule they may fit, up to the first they surely fit. A wrong definition is worse than a missing one. So a name is defined only where every candidate defines it, with one kind, and the type holds only the members every candidate gives it; the container likewise. A rule defines a name it binds as an ident or a tt by the type keyword before it in its body, or through the macros it hands the name to (a-name-handed-to-another-macro-is-received-by-the-rules-its-arguments-fit). The type holds the items of each impl whose self type is the name, a trait impl's under Name::<Trait>. A trait impl whose trait names another metavariable gives nothing, as no invocation's tokens are followed into a body. A type the file writes directly beside an invocation that defines it too is one set with it, unless the direct one lies inside the invocation. pyo3's create_exception! and import_exception! are listed by argument position. Second, an item keyword followed by a name, not a keyword, a path or a rename, is a definition under the invocation's container, a member only a fn, type or const. A spelled mod's items are its own. A tree after a name, or another item's body, defines nothing: class!(Meters { fn new() }) may make new any type's member."
alternatives = [
    "Expand macros fully: rejected because it needs a Rust compiler's name resolution and macro engine, far past what an anchor needs",
    "Take the first rule an invocation's tokens may fit: rejected because rules that differ past a repetition then gave every type the first rule's kind and members",
    "Union the members of every rule an invocation may open: rejected because a member one rule alone gives is a phantom of every type the other rules make",
    "Open a rule by its literal words before the name and one token after: rejected because that second matcher chose rules the hand-off matcher told apart",
    "Define a spelled item of any nested tree under the invocation's container: rejected because a constructor in a class body became a top-level function Rust does not have",
]
