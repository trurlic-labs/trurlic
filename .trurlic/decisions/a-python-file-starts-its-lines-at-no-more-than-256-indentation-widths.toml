component = "code"
choice = "A Python file whose lines start at more than 256 distinct indentation widths is refused before the parse as TooManyIndentations"
reason = "tree-sitter-python's scanner keeps the widths of the open blocks on a stack and writes them, two bytes each, after the open string delimiters into tree-sitter's buffer of 1,024 bytes; its loop stops at the buffer's size only on an even count, so some 380 open blocks under an odd number of open strings write one byte past it, and tree-sitter's assertion aborts the process, which no unwind catches. The stack holds strictly increasing widths, each measured from a line break, so it is no deeper than the distinct widths the file's lines start at, counted as the scanner counts them: a space 1, a tab 8, in 16 bits that wrap, a backslash before a line break continuing the run, every line counted, one inside a string or brackets too. At 256 every entry and delimiter fits with room. The check runs before the parse, since the abort happens during it."
alternatives = [
    "A bound on the tree's nesting: rejected because the abort happens during the parse, before any tree",
    "A patched copy of the grammar's scanner: rejected because a vendored fork of a C grammar must be kept in step with every release",
    "Parse in a child process: rejected because it spawns a process per file and a call would no longer be one process",
]
