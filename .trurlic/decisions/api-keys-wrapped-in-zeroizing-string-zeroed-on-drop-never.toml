[decision]
component = "project"
choice = "API keys wrapped in Zeroizing<String>, zeroed on drop, never logged"
reason = "The zeroize crate (with derive feature) is a direct dependency. API keys are stored in Zeroizing<String> which overwrites memory with zeros on drop. Keys must never appear in log output, error messages, or Debug/Display impls (only last 4 chars shown). This mitigates credential leakage through core dumps, swap, or accidental logging."
alternatives = [
    "Store API keys as plain String — rejected because keys would persist in memory after use and could leak through debug output or core dumps",
    "Use a dedicated secrets vault library — rejected because Zeroizing<String> is sufficient for short-lived process secrets and avoids external service dependencies",
]
tags = ["security"]
attribution = "user"
created = "2026-06-15T09:47:40.498765754Z"
