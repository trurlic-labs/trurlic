component = "code"
choice = "A symbol resolves to the definitions whose whole path it is, else to all whose path ends with it; those of one path are one thing, every span and one hash, several paths Ambiguous(n)"
reason = "Ambiguity is a property of names, not of how many definitions a name has. A symbol names every definition whose path ends with it, so a module-level function open and a method Store::open are both named by open, and without a further rule no spelling would name the function alone; the same holds for a function and the test named after it, and for a type and one of its name in an inner module. So among the matches, after a trailing () narrows them to functions and methods, those whose whole path the symbol is, no segment left out, win, and only when none are does every suffix match count: a shorter suffix of a deeper path stays a shorthand. The matches left are grouped by full path. cfg twins of a function, a field and its getter, a key each element of an array holds, a heading or a Makefile target defined twice: each is one thing no spelling can split, so one group resolves to all its definitions, and several are Ambiguous with the number of paths rather than resolved to the first, so a span hash never covers the wrong one. Kind takes no part in what is one thing, and () is the one narrowing. Definitions holds a first span and the rest in file order, so it is never empty, and one hash: a single definition's own, or the hash of the members' hashes in the order of the hashes, so twins that swap places move nothing. Its text is the count, the first span and the hash. A lossy path merges silently. Known approximations: a heading or a key holding :: beside the nested one, and an impl for &T beside one for &mut T."
alternatives = [
    "Every symbol that names several definitions is Ambiguous: rejected because cfg twins, a field with its getter, and a module-level item that shares its name with a member could then be anchored by no symbol at all",
    "Resolve an ambiguous symbol to its first definition: rejected because the order of a file is no statement of which one the decision meant",
    "Let kind split a path's definitions into things: rejected because a type and its value, or a property and its setter, are one name a reader means together, and () already narrows to functions",
    "Hash the members in span order: rejected because two unchanged twins that swap places would move the hash, as moving one definition does not",
    "Print every span of a set: rejected because a key held by every element of a long array prints a text far past a tool result's budget",
]
