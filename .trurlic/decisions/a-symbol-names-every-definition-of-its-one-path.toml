component = "code"
choice = "The definitions a symbol names that share one full path are one thing it resolves to, every span and one hash; only definitions of several paths are Ambiguous(n), n the paths"
reason = "Ambiguity is a property of names, not of how many definitions a name has. cfg twins of a function, a field and its getter, a key each element of an array holds, a heading or a Makefile target defined twice, and soon overloads, a prototype beside its definition, preprocessor arms, a property and its setter, a template and its specializations and merged declarations are each one thing no spelling can split, so reporting them ambiguous would ask for a fix that does not exist. A symbol matches as before: the definitions whose path ends with it, those whose whole path it is winning, a trailing () first narrowing to functions and methods. The matches are grouped by full path; one group resolves to all its definitions, several are Ambiguous with the number of paths, which a fuller spelling always resolves. Kind takes no part in what is one thing: a type and a value of one name are one path, and () is the one narrowing. The resolution states it in its type: Definitions holds a first span and the rest in file order, so it is never empty, and one hash: a single definition's own, or the hash of the members' hashes in span order. Two definitions of one span, as the targets of one Make rule, list it once; nested spans of one path are each listed. A type two macro invocations define is a set of the two invocations' spans like any other. A reader asks whether a hunk touches any span and whether the hash moved, and prints the first span."
alternatives = [
    "Keep Ambiguous for every symbol of several definitions: rejected because cfg twins and a field with its getter could then be anchored by no symbol at all",
    "Let kind split a path's definitions into things: rejected because a type and its value, or a property and its setter, are one name a reader means together, and () already narrows to functions",
    "Resolve to the first definition of the path: rejected because a change to any twin is a change to what the decision constrains",
    "Spell parameter types in a symbol to pick one overload: rejected because no measured anchor needs it, and it can be added later as a narrowing",
]
