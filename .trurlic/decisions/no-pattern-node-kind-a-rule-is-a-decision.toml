component = "store"
choice = "There is no pattern node kind; a rule a pattern would state is a decision"
reason = "A rule a pattern would state is a decision like any other, project-wide when it applies everywhere, and a brief carries the decisions themselves. A node kind that groups decisions under a named synthesis and applies it to components would bring edges of its own, and with them deletion rules a decision does not need: a pattern kept at two members, a removal that shrinks one. A store of an older format holds patterns; its migration reports every pattern with its description and edges, so the owner can record the rule it stated as a decision."
alternatives = [
    "A pattern node kind beside decisions: rejected because its edges carry most of the deletion rules for little a brief uses",
    "Each pattern as a tag: rejected because a tag states no rule",
]
status = "proposed"
