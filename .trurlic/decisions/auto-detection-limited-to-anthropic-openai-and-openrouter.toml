[decision]
component = "config"
choice = "Auto-detection limited to Anthropic, OpenAI, and OpenRouter; Custom, Ollama, and Gemini require explicit --provider"
reason = "The AUTO_DETECT_PROVIDERS constant restricts keyless auto-detection to three mainstream cloud providers. Custom (needs base URL), Ollama (local, no key), and Gemini are excluded because auto-detecting them could cause confusing behavior — Custom and Ollama have fundamentally different requirements (base URLs, no auth), and Gemini was added later. Requiring explicit selection for these providers prevents ambiguity without burdening the common case."
alternatives = [
    "Include all providers in auto-detect — would cause false positives for Ollama (always 'available' since no key needed) and Custom (key present but no base URL)",
    "Make auto-detect set configurable — over-engineering for a small, stable set of providers",
]
tags = [
    "ergonomics",
    "api",
]
attribution = "user"
created = "2026-06-15T09:44:20.887743543Z"
