choice = "A search's query is 1 to 256 bytes of UTF-8 with no control character, parsed once by Query::parse in its argument's kind, the one site that refuses it"
reason = "The query argument's kind, QueryText, parses through Query::parse and maps its QueryFault to the invalid_argument refusal that names query, with one message. Its schema states that parse for a reader: the lengths read MIN_QUERY_BYTES and MAX_QUERY_BYTES, and the pattern excludes C0, DEL and C1, the controls the parse refuses. A schema's length counts characters where the parse counts bytes, so it states the bound exactly for ASCII alone, and the parse stays the boundary. sources owns the type, as tools names sources and code names neither; the search in code takes any text, so it never re-checks one."
alternatives = [
