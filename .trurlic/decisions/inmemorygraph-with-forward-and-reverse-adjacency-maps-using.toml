[decision]
component = "store"
choice = "InMemoryGraph with forward and reverse adjacency maps using Arc<str> name interning"
reason = "InMemoryGraph keeps forward and reverse adjacency as BTreeMap<Arc<str>, Vec<Edge>> for O(log n) neighbor lookups in both directions, and iterates every map in name order, so nothing built from it depends on a hash seed. All node names are interned as Arc<str> through a build-time pool, shared across the adjacency maps, content caches and query results. build() collects each map whole, which sorts once and builds the tree in bulk; on the seeded corpus that keeps the build at the cost the hash maps had, where inserting key by key made it 39% to 67% slower. The graph is not Serialize/Deserialize: it is an internal query structure rebuilt from GraphIndex, and to_index() exports it sorted for stable graph.toml diffs."
alternatives = [
    "Single adjacency list with linear scan for reverse lookups — rejected: query methods like decisions_for() and connects_from() need efficient reverse traversal",
    "Petgraph or similar graph library — rejected: the graph is small (hundreds of nodes), and custom adjacency maps give precise control over interning and Arc sharing without the dependency weight",
    "String keys without interning — rejected: the same node name appears in nodes map, forward map, reverse map, and content maps; Arc<str> eliminates redundant allocations",
]
tags = [
    "performance",
    "data-structures",
]
attribution = "user"
created = "2026-06-15T09:45:04.633490735Z"

