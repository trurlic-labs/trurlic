component = "lint"
choice = "The duplicate pass maps a term to its id in a HashMap, the one exception to the BTree rule, never iterated: ids follow the order terms are first met"
reason = "Hash collections are refused because their iteration order is per process, which would reach output. The vocabulary is a lookup only: each term's id is the count of terms met before it, in the order of the decisions and their text, so no answer depends on the map's order or its hasher. Looking up every term occurrence of a large graph in a BTreeMap of strings took most of the pass on the seeded corpus, a string comparison per tree level; a hash lookup is one hash and one comparison. The exception is an expect attribute at the one site, whose reason says the map is never iterated."
alternatives = [
    "A BTreeMap of strings: rejected because it cost several times the rest of the pass on the seeded corpus",
    "A hand-written hash table with a fixed hash: rejected because it repeats std for a lookup whose order nothing reads",
]
tags = [
    "determinism",
    "performance",
]
status = "proposed"
origin = "likely duplicates"
