component = "code"
choice = "A file's index holds its paths as a tree of scopes, each its own segments and its parent; the tree charges all an index holds to its file's room, and every path counts toward 64 segments"
reason = "A path copied into every definition makes an index grow with its file times its nesting. A scope stores only the segments its own name adds and the id of its parent, created before it, so a path is walked from its last segment up and the walk ends. A container that is no definition, an inherent impl's type, is a scope too. A rule that copies text per entry can still outgrow its file, as a pub use list of twenty thousand selfs under a long module name once did. So every resolver enters its scopes and adds its definitions, macros, invocations and module files through the one tree. The tree charges each what its cache entry costs, its bytes and the weight of each value it holds, the memory the value takes once read. It refuses the file past its room, sixty-four times its size and at most 64 MiB, and a little besides, as TooComplex. A path of more than MAX_NESTING segments is TooDeep. A macro expansion adds its scopes past the file's own and holds them to MAX_NESTING alike. An added scope shares the name its macro gives instead of copying it, and each added definition is charged its bytes against the expansion's budget, so what an expansion holds is bounded too."
alternatives = [
    "Keep an owned path per definition and cap the definitions: rejected because a cap that happens to hold today is no bound, and the waste stays",
    "Intern the path segments in a table: rejected because the copies of a path, not of its segments, are what grew",
    "Bound the entry by a test over the densest inputs found: rejected because the next rule's input is not among them",
]
