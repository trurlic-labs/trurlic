component = "store"
choice = "A 0.4.1 code ref becomes an anchor in the 0.5 spelling where its syntax alone settles a name path; any other symbol is kept as written and reported"
reason = """
The 0.5 grammar writes a symbol as a ::-separated path of names from the outermost container. 0.4.1 wrote a TOML or JSON key path with a dot, a Python member as Class.member, and a call or a macro with its (..) or !, and no name of those languages holds those characters, so each maps to one name path: workspace.lints becomes workspace::lints, Checker.run Checker::run, lock() lock. A path with an empty or . segment loses it. A spelling whose meaning the syntax does not settle is kept as it was and listed with the reason: a quoted key, whose dot may be part of a name; a key path with an empty segment; a Rust generic or impl, which 0.5 writes as Type::<Trait>::name; a dot in a Rust symbol; and every Markdown symbol, which named a word of a heading where 0.5 names the heading path. The step reads no code: whether a respelled path resolves is a question for anchor resolution, and the report prints every rewrite as old -> new. A ref whose path breaks the anchor rules is dropped with its symbol, and a symbol 0.5 refuses or a key the anchor does not hold, such as line, is dropped from it; each is a reported loss.
"""
alternatives = [
    "Resolve each symbol in the code during the migration: rejected because the migration would need the code index and its answer would depend on the tree it ran in",
    "Drop a symbol whose spelling is not settled: rejected because the anchor would lose the place it names, where the kept spelling may still resolve or be repaired",
    "Keep every symbol as written: rejected because a key path would no longer name its key under the 0.5 grammar",
]
