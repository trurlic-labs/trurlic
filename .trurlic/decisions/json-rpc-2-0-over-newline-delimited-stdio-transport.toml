component = "mcp"
choice = "JSON-RPC 2.0 over newline-delimited stdio; every line gets at most one answer, and a line over 10 MiB is discarded whole"
reason = "MCP requires JSON-RPC 2.0, and stdio is its transport for a local server: one JSON object per line, blank lines skipped, every line written whole from a buffer. protocol::read_message sorts a line into a request, a notification or a response, or answers it: invalid JSON -32700; valid JSON that is no message (no jsonrpc 2.0, a method that is not a string, params that are not an object, a null or non-integer id, which MCP forbids, a batch array) -32600 with the line's id when it is a string or an integer, else null. A notification and a response are never answered. read_line holds at most MAX_MESSAGE_BYTES (10 MiB) of a line in memory; past it the line is read to its newline and dropped, so its tail is never parsed as further messages and the line is answered once."
alternatives = [
    "HTTP transport — rejected: MCP stdio is the standard for local tool servers, HTTP adds unnecessary complexity and port management",
    "Length-prefixed framing (Content-Length header like LSP) — rejected: newline-delimited JSON is simpler, sufficient for single-line messages, and matches MCP convention",
]
tags = [
    "protocol",
    "security",
]
