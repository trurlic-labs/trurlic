[decision]
component = "session"
choice = "Brace-depth JSON extraction from free-form LLM responses"
reason = "Decisions, components, connections, and patterns are extracted from LLM prose by scanning for top-level `{...}` blocks using brace-depth tracking with JSON string-escape handling. Each balanced block is attempted as a JSON parse; only blocks with the required fields (e.g. choice+reason for decisions) are accepted. This tolerates LLM responses that mix prose and JSON without requiring markdown fences or structured output modes."
alternatives = [
    "Regex-based extraction — rejected: fragile with multi-line JSON, nested braces in string values, and escaped quotes.",
    "Structured output / function-calling mode — rejected: not all LLM providers support it, and it couples extraction to provider capabilities.",
    "Require markdown code fences around JSON — rejected: LLMs inconsistently emit fences, adding a fragile formatting dependency.",
]
tags = [
    "data-flow",
    "resilience",
]
