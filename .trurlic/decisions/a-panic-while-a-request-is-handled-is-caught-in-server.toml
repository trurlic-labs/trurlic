[decision]
component = "mcp"
choice = "A panic while a request is handled is caught in Server::answer, answered -32603, and the server serves the next request"
reason = "Release builds unwind, so one catch_unwind per request turns a bug in a handler into an error the client can report instead of a dead session. The boundary is sound because nothing a request leaves half-done outlives it: the server holds no graph between calls; a Writer's file lock is released as unwinding drops it, and a commit it began is finished from the journal by the next opener, as after a crash; the client record changes only by whole steps (an id taken, a request queued or dequeued); and every line sent to the client is serialized into a buffer before it is written, so the stream never holds part of one. AssertUnwindSafe is justified at that site. The answer is written after the boundary. A failpoint that panics under the exclusive lock (write.locked) proves over stdio that the next write takes the lock and commits."
alternatives = [
    'panic = "abort": rejected, one bug ends the session and every call after it',
    "catch_unwind around tools/call only: rejected, initialize and tools/list build values too; one boundary per request covers every handler",
    "A thread per request: rejected, stdio is one ordered stream, and a thread adds a join and a channel for what catch_unwind does in place",
]
tags = [
    "reliability",
    "error-handling",
    "protocol",
]
attribution = "user"
created = "2026-11-23T23:15:10.990884289Z"

