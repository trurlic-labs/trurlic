[decision]
component = "store"
choice = "Parallel loading via rayon: each node file read and hashed in one pass, the three node kinds and graph.toml read concurrently"
reason = "Store::read_graph parses graph.toml on one rayon thread while the others read the node files: graph.toml is one large file whose parse is serial and takes about as long as reading and parsing every node file in parallel. The three node kinds are listed and read concurrently too, since each kind's directory listing and its slowest file are serial steps. Together these cut load_state at 2000 seeded decisions from 27 ms to 16 ms in make bench. Each node file is read once by read_toml_with_hash, which parses the TOML and computes BLAKE3 over the same bytes; skipping the hash on a read measured within noise, so every load hashes and no state carries empty hashes. On a cold cache with 260 files the parallel read cut wall time from ~300ms (sequential) to ~50ms. The index is then reconciled with the node files: belongs_to edges are re-derived from decision files (source of truth), dangling edges are dropped, and nodes and edges are sorted for deterministic output."
alternatives = [
    "Sequential file loading — rejected: measured at 300ms for 260 files on cold cache; unacceptable for MCP tool response latency",
    "Memory-mapped files — rejected: adds complexity for marginal benefit on small files (typical node is 200-500 bytes); rayon parallelism gives better wall-time improvement",
    "Incremental loading (only changed files) — rejected: requires a persistent index of file mtimes; full reload with rayon is fast enough and simpler to reason about for correctness",
]
tags = [
    "performance",
    "storage",
]
attribution = "user"
created = "2026-06-15T09:45:56.889052260Z"

