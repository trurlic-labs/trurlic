component = "lint"
choice = "A stale Rust symbol is repaired to the one file of its target that writes it when the commit its file last lost it in gave that file the same span hash, and that file kept an item of those kinds since"
reason = "Names alone do not show where code went: a function deleted for good in the commit that writes an unrelated function of its name elsewhere is no move. So the search, CodeFacts::namesakes, finds the one other walked Rust file of the same target by place (roles::target_of) that writes the symbol as a whole path, no re-export, module declaration or item a macro invocation produces; never when the anchor's file still defines its last segment. The loss is the newest of the file's MAX_LOSS_CHANGES newest changes whose blob before wrote the item, or the work tree when HEAD wrote it, all read in one git cat-file batch. The move is shown when that change made the candidate go from writing no such item to definitions of the span hash the anchor's had (lint::anchors::repair::moved), and the candidate held definitions of the kinds it gained after each of its changes since, at most MAX_SINCE_CHANGES read in a second batch, and holds them now. The hash compares tokens, comments and whitespace aside: a move that edited the item is left stale rather than guessed, an edit after the move keeps the repair, and a later deletion of the item, or another kind of item of its name written in its place, ends it. Both batches are indexed through the cache by content."
alternatives = [
    "Judge the move only at the commit where it happened: rejected because a candidate that later lost the item and gained an unrelated one of its name, or a type of it, kept a repair to code that is not the decision's",
    "Require the same span hash now: rejected because every edit of the moved item since would then lose its repair",
    "Accept an edited move above a text similarity: rejected because no threshold separates an edited move from a rewrite by name without an owner's call",
    "Read the loss in rounds of one, four and sixteen changes: rejected because one batch of a stated number is one read whatever the history",
]
tags = [
    "anchors",
    "lint",
]
