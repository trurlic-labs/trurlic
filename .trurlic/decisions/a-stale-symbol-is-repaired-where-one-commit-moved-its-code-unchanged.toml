    { file = "src/lint/anchors/tests.rs", symbol = "a_namesake_that_stood_beside_the_code_is_no_move" },
    { file = "src/lint/anchors/tests.rs", symbol = "a_symbol_that_moved_to_one_other_file_is_repaired_there" },
    { file = "src/sources/repair.rs", symbol = "MAX_LOSS_COMMITS" },
    { file = "tests/integration/repair.rs", symbol = "a_namesake_or_a_rename_that_carried_no_code_is_never_written" },
]

