component = "store"
choice = "tracked: a work tree whose git tracks a file of the graph and ignores none; shared: git tracks none, and in a work tree it is the graph at the top of the main worktree"
reason = """
A file of the graph is tracked when the index holds its path, the rule the migration reads git's listing by (store::placement::partition). A tracked graph needs one tracked file, not all: a decision written and checked before git add is a change waiting for its commit, as any new source file is; a graph git tracks none of, the state between init and the first commit or one that never reached git, is refused, since linked worktrees check out nothing. A file an ignore rule matches can never be committed, so one is refused. Outside any work tree a tracked graph is refused and a shared one passes: nothing versions it, and symlinked trees reach it. A shared graph in a work tree is the main worktree's at its top, where linked worktrees look; elsewhere, or in a bare repository's worktree, it is SharedOffMain. Every other graph directory is a second graph: a linked worktree's beside a shared main graph, found from the main worktree with its branch, and this graph when the main worktree's is shared, found from the linked side whatever placement it states.
"""
alternatives = [
    "Every file tracked: rejected because a decision written and checked before git add would fail check",
    "Only an ignore rule contradicts tracked: rejected because a tracked graph never committed would pass while every linked worktree finds no graph",
    "Report a second graph only from the main worktree: rejected because a check run in the linked worktree, which reads its own graph, would pass",
]
