component = "store"
choice = "The store judges placement from PlacementFacts that check gathers from git, as the migration takes git's listing; the store spawns no process"
reason = """
The judgement is pure: ProjectState::placement_issues takes the graph directory and PlacementFacts (no work tree, or the tracked and ignored paths and the main worktree: bare, this graph with the other graphs of the linked worktrees, or elsewhere with its shared graph if any) and returns sorted issues, so each rule is a unit test with no repository. commands/placement.rs gathers the facts in the directory that holds the graph, never inside it: git::toplevel, tracked, ignored and worktrees, then discovery::graph_in for each worktree's .trurlic and the placement the main worktree's graph states. The migration's placement is read the same way, through commands/placement.rs tracked and PlacementSource. These are not issues of ProjectState::validate, which every read and every write runs without git.
"""
