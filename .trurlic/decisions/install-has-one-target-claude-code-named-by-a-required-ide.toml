component = "commands"
choice = "trurlic install registers trurlic serve with Claude Code alone, named by a required --ide whose one value is claude-code"
reason = "Users reach Trurlic through their coding agent over MCP, and the installer's one job is to register trurlic serve with that agent. A target that only merges an entry into a client's JSON, TOML or YAML config, at a per-OS path guessed from the client's conventions, is tested against no real client and kept up to date by nobody, while an entry the user pastes from the README does the same. So install has one target, Claude Code, the client the quick start uses. --ide stays required with a one-variant ValueEnum (InstallIde::ClaudeCode): help lists the one accepted value, clap refuses any other with exit status 2, and main destructures the variant, so a second target fails to compile until it is handled, and trurlic install --ide claude-code works as typed."
alternatives = [
    "A target per MCP client: rejected because each is an untested guess at a client's config path and format, and one pulled in a YAML parser built on an unmaintained unsafe C translation",
    "Delete trurlic install: rejected because registering with Claude Code is the second command of the quick start",
    "Drop --ide or make it optional with a default: rejected because the first breaks trurlic install --ide claude-code as typed and the second adds a bare form to keep",
    "Accept --ide as a string checked against claude-code: rejected because the code never reads it, and a new target is no compile error",
]
tags = [
    "developer-experience",
    "error-handling",
    "maintainability",
]
status = "proposed"
created = "2026-11-23T19:44:19.727447441Z"
