component = "commands"
choice = "migrate keeps the report in the backup directory beside .trurlic/, both flushed before the commit, and a backup never lands in an earlier one"
reason = """
The patterns and the tags a migration takes out of the graph exist nowhere else afterwards, so the report must outlive the terminal. migrate copies the store, but for .state/, into a new .trurlic-backup-<UTC time> directory, writes the report it prints into migration-report.txt there with create_new, and flushes every file and directory before the commit; a power loss after the commit can then not take the only record with it. The copy flushes in parallel, since each flush waits on the disk. The directory is created with create_dir, and a taken name gets -2, -3 and on, so a second migration in the same second, after an interrupted one, never merges into or deletes an earlier backup. A failure before the commit point removes the new backup; a CommitPending keeps it, since the commit lands. The dry run writes nothing.
"""
alternatives = [
    "Print the report only: rejected because what the graph loses would live in scrollback",
    "Write the report into .trurlic/: rejected because the store would hold a file that is no node, versioned with the graph under tracked placement",
    "A report file beside the backup directory: rejected because the two would be moved or deleted apart",
]
