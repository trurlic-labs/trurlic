[decision]
component = "store"
choice = "Every write validates against the graph loaded under the exclusive lock, held with that lock in the Writer that begin_write returns"
reason = "A write validated against the state its server last loaded, before taking the file lock, and then committed the whole graph index from it, so another process's commit in between was silently lost (two serve processes, add_connection then record_decision within 100 ms: the edge vanished and check still said consistent). Store::begin_write takes the exclusive lock, checks the format, recovers, loads the graph under the lock and returns a Writer that owns both. Every graph write is a Writer method and the Writer's fields are private to the store, so no caller can pair the lock with a graph loaded before it, and a graph a read loaded can never be committed. That replaces the commit counter which refused a stale state only at commit time, when any state could be passed with any lock. Each commit leaves the writer's graph equal to the files, so a second write of the same writer validates against the first, and a refused write rolls the writer's graph back. MCP begins one writer per write tool call, the CLI one per command."
alternatives = [
    "Validate against the in-memory state, then lock and commit: rejected, that is the lost update",
    "Lock and reload inside each MCP handler: rejected, every handler must remember to validate after the reload; one call site cannot forget",
    "Skip the reload when node-file fingerprints match: deferred, the store has no per-file fingerprints yet and the unconditional reload is correct now",
]
tags = [
    "concurrency",
    "reliability",
]
attribution = "agent"
created = "2026-10-02T11:35:08.670219118Z"

