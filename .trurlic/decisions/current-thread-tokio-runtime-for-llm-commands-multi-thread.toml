[decision]
component = "commands"
choice = "Current-thread Tokio runtime for LLM commands, multi-thread for map server"
reason = "bootstrap_direct and design build a single-threaded Tokio runtime (Builder::new_current_thread) because LLM session commands are inherently sequential user dialogues with no concurrency benefit. The map command uses Builder::new_multi_thread because the map server handles concurrent WebSocket connections, HTTP requests, and file watching simultaneously. This avoids the overhead and complexity of a thread pool where it provides no benefit, while enabling true parallelism where the workload demands it."
alternatives = [
    "Multi-thread runtime everywhere — rejected: unnecessary thread pool overhead for sequential LLM dialogue; the bootstrap/design commands make one LLM call at a time and wait for user input between steps",
    "Single-thread runtime everywhere — rejected: the map server must handle concurrent WebSocket clients and REST API calls while also running the file watcher; a single-threaded runtime would serialize all handlers",
]
tags = [
    "performance",
    "concurrency",
]
attribution = "user"
created = "2026-06-15T09:43:13.935016268Z"
