component = "code"
choice = "An unnamed default export, or an unnamed function, class or function's call module.exports is, is a definition named default, its members under default::; a named one keeps its name"
reason = "export default function () {} and export default class {} have no name of their own, so without one their members would land at the module's top beside its named definitions. The module's own name for the export is default, which an import names, so the definition takes it, and its methods are default::render. CommonJS's module.exports = function () {} is the same export, which an ES import of the module names default, so it is read alike, its helpers under default::; so is the value an unnamed function's call returns (module.exports = (function () { ... })()), a variable whose function's body is under it, as var X = (function () {})() puts its body under X; and exports = module.exports = f is one export. A named function or class module.exports is keeps its own name, as export default function createApp() does, so an anchor names it as the ES form has it. A function expression, arrow function or generator is a function, a class expression a class; an object, a call, a string or any other value of more than one leaf of the tree is a variable, and an object's methods are its own as a top-level const's are. A default export of a single leaf defines nothing: export default x names a definition the module already holds, which the export makes public, and export default 42 a number no reader looks up."
alternatives = [
    "No definition for an unnamed default export: rejected because its members would then stand at the top beside the module's named definitions",
    "A definition named default for export default x too: rejected because x is already defined, and its span holds its body",
    "default for a named module.exports function too: rejected because export default function createApp() keeps createApp, and the two forms of one export would name it apart",
]
