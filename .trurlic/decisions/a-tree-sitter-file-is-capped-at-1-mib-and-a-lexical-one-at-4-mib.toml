component = "code"
choice = "A file of a tree-sitter kind is refused past 1 MiB and one of a lexical kind past 4 MiB, each as TooLarge naming its size and its kind's cap"
reason = "A parse is held to a count of work and allocation per byte of its file, so the cap bounds one parse's budget: 32 Mi progress operations at 1 MiB. A refused parse stops at the first progress check past it, which in the costliest shapes measured comes within seconds and a little over 2 GiB allocated, once, since the index is then cached. At 4 MiB one parse could allocate four times that, past what a call may hold. A lexical resolver's work is the index's own and counted per byte, so data and prose files keep 4 MiB. The cap is FileKind::max_bytes, checked by the pure index, and the shell reads at most the largest cap and one byte more, so every surface reports the one refusal."
alternatives = [
    "One cap of 4 MiB for every kind: rejected because one parse of that size may allocate four times as much and run four times as long",
    "A wall-clock timeout on the parse: rejected because code reads no clock, and a file would be refused on a slow machine and not a fast one",
    "A check of the bytes' density before the parse: rejected because no measure of the bytes predicts the parser's error recovery",
]
tags = [
    "reliability",
    "security",
]
status = "proposed"
origin = "languages as query files"
created = "2026-11-25T16:53:23.387185487Z"
