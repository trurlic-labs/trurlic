[decision]
component = "provider"
choice = "Function pointer injection for provider-specific SSE text extraction"
reason = "Each provider has a different JSON structure for streaming deltas (Anthropic uses `/delta/text` with `content_block_delta` type filtering, OpenAI uses `/choices/0/delta/content`, Gemini uses `/candidates/0/content/parts/0/text`). Rather than an enum or trait, a plain `fn(&str) -> Option<String>` function pointer is passed to `stream_sse`. This is zero-cost (no vtable, no allocation), stateless, and trivially testable — each extractor is a pure function tested in isolation with JSON fixtures."
alternatives = [
    "Trait object for extraction strategy — rejected because extractors are stateless pure functions with identical signatures; a trait adds indirection without benefit",
    "Generic type parameter on stream_sse — rejected because it would monomorphize the entire SSE loop per provider, bloating binary size for no runtime gain",
]
tags = [
    "performance",
    "abstraction",
]
attribution = "user"
created = "2026-06-15T09:44:35.858288119Z"
