[[decision.history]]
choice = "Atomic writes via serialize-to-temp, verify round-trip, rename-into-place"
reason = "Prevents partial writes from corrupting on-disk state. Content is serialized to TOML, written to .state/tmp/, deserialized back to verify the round-trip, then renamed to the final path. Rename is atomic on POSIX. graph.toml is always renamed last, serving as the commit point — if the process crashes mid-transaction, the graph index still references the previous consistent state. Stale temp files are cleaned up on next startup via clean_stale_tmp()."
changed_at = "2026-10-02T12:18:24.965619207Z"
