[decision]
component = "provider"
choice = "API key security: Zeroizing wrappers and URL scrubbing in errors"
reason = "API keys are wrapped in `ApiKey` (backed by `Zeroizing<String>`) so they are zeroed from memory on drop. The `connection_error` helper calls `err.without_url()` before formatting error messages, specifically because Gemini puts the API key in the URL query parameter and reqwest's default Display would leak it. The OpenAI client wraps the Bearer token format string in `Zeroizing` so the concatenated form is also zeroed after the request is sent. This defense-in-depth approach ensures keys never appear in logs, error messages, or linger in memory."
alternatives = [
    "Plain String for API keys with manual scrubbing — rejected because it relies on every callsite remembering to scrub; Zeroizing provides automatic cleanup on drop",
    "Avoid Gemini URL-based auth entirely — not possible, Gemini's API requires the key in the query parameter",
]
tags = ["security"]
attribution = "user"
created = "2026-06-15T09:44:50.341829955Z"
