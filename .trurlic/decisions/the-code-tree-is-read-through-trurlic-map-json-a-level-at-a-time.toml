reason = "The owner's view of the code computes no fact: every number, status and edge it shows is a field of a command's JSON. So the tree is read through map, a ToolSpec whose Output declares the outputSchema the view's types are generated from. tests/integration/golden/map_schemas.json pins the inputSchema and outputSchema of each map tool, by name. The registry lists none of them, as the tree is the owner's view and an agent reads decisions by file and component already. A level is one node's children, each with its kind, its lines and the sums of the decisions and definitions in and under it, and the edges between them. The root is the workspace's crates, with what lies outside every crate. A level is paged within MAX_TOOL_RESULT_BYTES, and every child or list a page leaves out is counted. The JSON is the one form: --json is required, so trurlic map alone is a usage error naming it, and a text form added later changes nothing the plain command printed. The node is a positional argument, the root without it."
