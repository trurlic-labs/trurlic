component = "sources"
choice = "A gone file is followed by its blob: it moved where it was the one path to lose a blob exactly one other path gained, judged against every later change of the path it reached"
reason = "git pairs files by similarity alone, and a shared header pairs two unrelated files, so a gone file is followed by its bytes. The history is read once a call (sources::renames::History::read): one git log --raw --no-renames walk of the newest MAX_WALKED_COMMITS commits of HEAD, with no pathspec and in topological order, each change naming its blob before and after, and one git diff --raw HEAD of what is not committed. A gone path's file moved where it was the one path to lose its blob and exactly one other path gained it: in the work tree's change of it, else in the commit that last changed, so deleted, it. Each later change of the path it reached is then judged oldest first: a move of the blob onward follows it, whether that commit deleted the path or wrote a new file there; an edit in place keeps it there and follows the edited blob; a deletion, a blob two paths gained or two lost, or a change whose blob before is not the one followed leaves no answer, whatever fills the path later; what is not committed is judged last. A file moved and edited in one commit is no move of the file. Every read pins the settings that change what git prints (git::renames::PINNED); a git failure leaves the anchors stale without a repair; a merge's changes are not seen."
alternatives = [
    "Judge only the next commit that changed the new path: rejected because an edit there hid a later deletion and rewrite of the path, and the anchor then followed an unrelated file",
    "Follow the renames git -M -C reports for files: rejected because similarity pairs unrelated files sharing boilerplate, and copy detection over every judged commit cost most of the time a check spent in git",
    "One walk per hop, limited by literal pathspecs of the paths asked: rejected because each walk costs a whole history, and one walk with no pathspec, filtered in the process, answers every path at once",
    "git log --follow per path: rejected because it takes one path per process and follows a path backward, not to where a gone file went",
]
tags = [
    "anchors",
    "git",
]
