component = "sources"
choice = "A gone path's rename is a git mv not committed, else what the last commit changing it renamed it to, while the new path is still the file that commit added; at most 8 hops"
reason = "git pairs files by similarity alone, between the two sides of a diff, so the question is asked of the diff that removed the path, and only for check and the repair_anchors op, for the files of stale anchors with nothing at their path: status asks the project's git nothing. What is not committed comes first: git diff HEAD with -M -C, so a git mv is seen; a file moved without git and not added is a deletion and an untracked file, which no diff pairs. Else one git log --name-status --no-renames walk over HEAD's history, limited to the asked paths as literal pathspecs, gives each its newest change, which for a path gone from HEAD deleted it, and its newest addition; git diff of that change against its first parent says what the path became, at git's default similarity: one rename is the answer, with its similarity index and the revision before it; several records from the path (a split shows as a copy beside the rename) or a plain deletion are none. A committed rename counts only while the newest commit that added its new path is the rename's own: a path deleted and written again since holds an unrelated file. A target that is gone too is followed the same way, one walk per hop, which also checks the paths the last hop reached, and one diff per commit, at most MAX_RENAME_HOPS. The answer is exact when every rename on the way has similarity 100. Every history read pins the settings that change what git prints (git::renames::PINNED), so no user configuration turns an answer off. Any git failure leaves the anchor stale without a repair. A merge's deletion is not seen."
alternatives = [
    "One walk per gone path: rejected because each walk costs a whole history even with changed-path filters, so many gone paths cost many times one walk",
    "git log --follow per path: rejected because it takes one path per process and follows a path forward from its history, not to where a gone file went",
    "Any similarity threshold of our own: rejected because git's default is what git status and git log show the user",
    "Follow a rename to whatever file is at its new path now: rejected because a file deleted and written again there later is unrelated, and a repair to it is wrong",
]
tags = [
    "anchors",
    "git",
]
status = "proposed"
