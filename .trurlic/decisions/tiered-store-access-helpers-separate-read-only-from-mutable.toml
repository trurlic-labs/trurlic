component = "commands"
choice = "Read commands load under the shared lock through open_store; a command that writes holds the exclusive lock from its load to its last commit"
reason = """
open_store returns the graph Store::load_state reads under the shared lock, for status and query; check loads the same way. fmt writes through the Writer of Store::begin_write, which holds the exclusive lock from its load to its commit, and migrate takes Store::lock and plans under it, since it reads files the current types cannot. A write command therefore always validates against the graph loaded under its lock, a read waits only while a writer holds the lock, and no command can write without holding it: every commit takes &StoreLock.
"""
alternatives = [
    "One open function that always takes the exclusive lock: rejected because status and check would wait on each other and on every MCP read",
    "Lock on demand inside each command: rejected because scattered locking is how a write forgets its lock, and the proof type makes the lock a parameter",
]
tags = [
    "concurrency",
    "error-handling",
]
