[decision]
component = "commands"
choice = "Tiered store access helpers separate read-only from mutable paths"
reason = "open_store returns the graph Store::load_state reads under the shared lock, for read-only commands; begin_write returns the Writer of Store::begin_write, which holds the exclusive lock from its load to its last commit, for mutating ones. A write command therefore always validates against the graph loaded under its lock, while a read-only command like status waits only while a writer holds the lock. A Writer is the only way to write the graph, so a command cannot write without holding the lock."
alternatives = [
    "Single open function that always locks — rejected: unnecessary contention for read-only commands like status/check/bootstrap, and holding locks during long operations like map serving would block MCP writes",
    "Lock-on-demand inside individual command functions — rejected: scattered locking logic increases risk of forgetting to lock before writes, and the StoreLock proof-type pattern requires the lock to be acquired explicitly before any write call",
]
tags = [
    "concurrency",
    "error-handling",
]
attribution = "user"
created = "2026-06-15T09:42:30.260983965Z"

[[decision.code_refs]]
