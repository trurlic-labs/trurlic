    { file = "tests/integration/repair.rs", symbol = "a_file_moved_on_while_another_takes_its_path_is_repaired_where_it_went" },
    { file = "tests/integration/repair.rs", symbol = "a_moved_symbol_and_a_renamed_file_are_repaired_by_one_op" },
]

[accepted_text]
choice = "A stale anchor follows its gone file's rename only when the rename carried its code: the same span hash before the rename and in the file the rename made"
reason = "A wrong repair hides the staleness it mends, and repair_anchors writes every repair unattended, while git pairs files by similarity alone. So a symbol anchor follows a rename only when its definitions at the old path before the rename have the span hash they have in the blob the rename's commit wrote at the new path, read in the one git cat-file batch (for a rename not committed, the work tree's file), and its symbol resolves at the new path now to definitions of the kinds it named in that blob. The rename is judged where it happened, so a later edit of the file keeps the repair, and an edit since that moved the item out and left a declaration of its name does not land the anchor on the declaration. A file anchor follows an exact rename into a file that defines an item, or a rename one of its symbol anchors followed, and for an inexact rename only while no symbol anchor that resolved in the old file is missing from the blob the rename made: one boilerplate main carried unchanged does not carry a file whose own functions stayed behind. A symbol the rename carried that is no longer at the new path is searched for from that file."
alternatives = [
    "Trust an exact rename without comparing code: rejected because a later edit may have moved the item out of the new path and left a declaration of its name",
    "Compare the symbol before the rename with the new path at HEAD: rejected because any later edit of the symbol in the renamed file would then lose the repair",
    "Follow every rename git reports: rejected because a shared license header or boilerplate pairs unrelated files, and every binary resolves main",
]
