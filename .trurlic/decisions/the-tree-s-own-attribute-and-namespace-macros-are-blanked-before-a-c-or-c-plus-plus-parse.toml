choice = "Before a C or C++ parse, the tree's attribute, specifier and namespace macros, none named as a grammar's word, and the comments inside a #define a token follows, are blanked; no list is configured"
reason = "The index runs no preprocessor, and a macro tree-sitter cannot read wrecks what follows it: class LEVELDB_EXPORT DB { reads as a function, FMT_BEGIN_NAMESPACE swallows its namespace, and a comment inside a #define ends the directive for tree-sitter-c. A name is blanked when every #define of it is empty, specifiers, attribute forms or other such names, a function-like one with one body not empty, or only namespace openings or closings and an opening is defined. A #define of a word either grammar reads as a token of its own (zlib's #define const, an inline or __attribute__ shim) names no macro: the parse reads the word already. A comment a token of its #define follows is blanked; a trailing one is kept, since blanked it leaves the blanks tree-sitter-c reads a body's end at. Blanking is spaces in place of the bytes outside directives, comments and literals, so offsets hold: the parse and the hash read the blanked text, and a span's lines are counted in the bytes as written, so a comment's line breaks blanked move no line. On the corpora measured the tree's own #defines recovered most of the definitions such macros damaged and halved the parse errors, where a list in project.toml recovered next to none past them. What stays unseen is stated where a user reads it: what a function-like macro writes, a macro defined outside the tree, and the segments of a namespace a macro opens. Which #defines reach a file is a-header-s-defines-reach-every-c-or-c-plus-plus-file-and-a-source-file-s-only-itself."
alternatives = [
