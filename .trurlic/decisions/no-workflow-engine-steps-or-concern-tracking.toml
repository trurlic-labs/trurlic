choice = "No workflow engine: no tool sequences an agent's steps, gates a read on them or scores concern coverage; the reads hand an agent the decisions and it works within them"
reason = "In use an engine of steps did not steer: its loops reached ready within a call or two, the next action it named was not followed, and the evidence agents passed for a step was mostly done or none, so a gate cleared that way adds calls without adding review. The decisions that do constrain code already reach the agent through get_context and get_decisions_for_file; a second path of task types, gated steps, mode prompts and keyword-matched concern areas in front of them, with fields on the tool results that pointed agents at it, cost the surface and the code their weight for none of that. What is open for a change, the decisions it touches and the choices it makes that no decision covers, is a property of the diff, not of a step sequence computed from the graph alone, so it belongs to a review of the diff against the graph. An agent reads a component's decisions with get_context and a file's with get_decisions_for_file, implements within them, records a choice no decision covers with apply, and runs trurlic check before committing."
alternatives = [
