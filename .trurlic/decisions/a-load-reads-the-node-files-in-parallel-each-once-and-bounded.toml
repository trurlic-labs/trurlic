component = "store"
choice = "Parallel loading via rayon: the two node kinds read concurrently, each file read once, bounded, parsed and checked for canonical form"
reason = """
Store::read_graph reads the component and the decision directories at once with rayon::join, since each kind's directory listing and its slowest file are serial steps, and read_nodes reads and parses the files of one kind on rayon's pool. Each file is read once by read_node_bytes, capped at MAX_NODE_FILE_BYTES, and the same bytes are parsed as the node's type and compared with its canonical form, so a load makes one read per file and allocates nothing for the comparison. Results come back in name order, and when several files fail the error names the first by name, whichever thread met it first, so a load fails the same way on every run. make bench times load_state at 50, 600 and 2000 seeded decisions.
"""
alternatives = [
    "Sequential file loading: rejected because each file's open and read adds up serially, which a cold cache makes dominant",
    "Memory-mapped files: rejected because it adds complexity for small files, and a bounded read already caps what one file costs",
    "Incremental loading of changed files only: rejected because it needs a persistent record of file state between calls, which the store does not keep",
]
