component = "mcp"
choice = "status fits its sections to the budget by the level search, keeping each one's leading items; a section that leaves items out gives omitted and more, which names where the rest is"
reason = "A broken graph can hold thousands of issues, and a large one hundreds of components, so a section's items can exceed the result budget alone. Each section's item sizes go to budget::level, so short sections stay whole and long ones keep a prefix; the section then carries total, the items kept, omitted and more (trurlic check lists every issue; the component and decision files hold every row). section returns one section with the whole budget. No status result is cut by the generic truncation, which a test over a graph of 400 issues and 300 components asserts."
alternatives = [
    "A cursor argument to page a section: rejected because the surface lists none, and trurlic check and the files already hold every item",
    "Fixed item counts per section: rejected because item sizes vary, so a count either wastes the budget or exceeds it",
]
