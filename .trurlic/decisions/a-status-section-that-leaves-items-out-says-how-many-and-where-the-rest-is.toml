component = "mcp"
choice = "status fits its sections to the budget by the level search, keeping each one's leading items; a section that leaves items out gives omitted and more, naming where the rest is, or for lint how it ranks"
reason = "A broken graph can hold thousands of issues, and a large one hundreds of components, so a section's items can exceed the result budget alone. Each section's item sizes go to budget::level, so short sections stay whole and long ones keep a prefix; the section then carries total, the items kept, omitted and more, which names where the rest is: trurlic check lists every issue, and the component and decision files hold every row. section returns one section with the whole budget. Only the lint section takes a cursor, from: no other surface judges a stored decision's patterns, so its result names in next the first decision their work limit left unread. No status result is cut by the generic truncation, which a test over a graph of 400 issues and 300 components asserts."
alternatives = [
    "A cursor argument to page every section: rejected because trurlic check lists every issue and the files hold every row; the pattern findings, which no other surface judges, are the one place that takes from",
    "Fixed item counts per section: rejected because item sizes vary, so a count either wastes the budget or exceeds it",
]
