[decision]
component = "config"
choice = "API keys wrapped in zeroizing newtype with redacted Display/Debug"
reason = "API keys are wrapped in an ApiKey newtype that derives ZeroizeOnDrop (via the zeroize crate), ensuring keys are scrubbed from memory when dropped. Display and Debug impls show only the last 4 characters (redacted form). The raw value is accessible only through an explicit expose() method, documented as being solely for HTTP Authorization headers. This prevents accidental key leakage through logging, error messages, or debug output."
alternatives = [
    "Store keys as plain String — simpler but keys persist in memory after use and leak trivially through Debug/Display",
    "Use secrecy crate SecretString — similar guarantees but heavier dependency; zeroize is already needed and is lighter",
]
tags = [
    "security",
    "api",
]
attribution = "user"
created = "2026-06-15T09:44:08.082779431Z"
