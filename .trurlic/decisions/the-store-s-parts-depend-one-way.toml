component = "store"
choice = "The store's parts depend one way, model, graph, format, write, then quality, apply, cache and corpus, and each names only the parts before it"
reason = "src/store holds eight parts, each a sub-module whose mod.rs re-exports what the others use. model holds the values of the graph's files and the rules and limits they meet; graph judges a loaded state (validation, cycles, the tool reads, placement issues); format holds the files themselves: Store, where each file lives, the canonical text, the read of each as its type, the format check and the migration registry; write holds every way into the graph under its lock: a read, a Writer, init, migrate, and the journaled commit with its history. quality, the bar a write holds, apply, cache and corpus build on those. A part names another only by its sub-module path, such as crate::store::model::Anchor, never through the store root's re-exports, which serve code outside the store and hide the part an item comes from; a test in store/mod.rs holds every such path to the order, and a call of a Store method another part defines keeps to it too. The edges that crossed the order were settled where each item belongs. FormatVersion and the [quality] table (Quality, DecisionField) are values of project.toml, so model holds them and the check stays in format. Store is the layout of the graph directory, so format holds it. The migration registry is format's, since every read checks a store's version against it, and carrying a migration out is write's, since it commits through the journal, as init does. quality sits above write because preparing a bar reads project.toml under the shared lock."
alternatives = [
    "Keep the store flat: its files have no order, so any file may call any other and a cycle between them goes unseen",
    "Keep the migration registry and its run together in format: the run commits through write, and every read in write checks the version against the registry, a cycle",
    "Keep FormatVersion and Quality beside the code that checks them: model would then name format and quality, a value depending on its reader",
    "Let the parts name each other through the store root's re-exports: shorter paths, but no reader or test can tell which part an item comes from",
]
tags = [
    "storage",
]
