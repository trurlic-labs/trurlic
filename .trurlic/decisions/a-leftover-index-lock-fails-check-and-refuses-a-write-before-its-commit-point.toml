component = "store"
choice = "A leftover index.lock in the graph's repository fails check and refuses a write before its commit point, with nothing written; uncommitted files and a missing repository are warnings"
reason = """
Under trurlic's exclusive lock no other trurlic process runs git in the graph's repository, so an index lock there is a person's git command, which a retry outlives, or the leftover of one that stopped, which no wait clears; git would fail every staging while it stays. prepare_history looks for it before anything is staged and refuses with Error::GraphIndexLocked naming the file and the repair, so the write leaves nothing pending. A lock that appears after the commit point fails the history commit, which the next writer makes (WritePending). check fails on it, as every write would; uncommitted files and a missing repository are mended by the next write, so they warn.
"""
