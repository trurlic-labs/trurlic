Nothing from the caller's or the user's configuration may break or redirect a history commit. --git-dir and --work-tree name the repository, so git discovers nothing, a missing .git is git's error and never the project's repository answering, core.worktree is beaten, and the ownership check of discovery does not apply. GIT_CONFIG_NOSYSTEM and GIT_CONFIG_GLOBAL (the empty file) shut out the system's and the user's files whole: their keys are open-ended (include, init.templateDir, user.useConfigOnly, core.compression and more), and no list of overrides could name them all. The repository's own configuration, which no variable shuts out, is overridden with -c where a key runs code or changes bytes: core.hooksPath to the empty file (no hook runs, .git/hooks/ included, since --no-verify skips only two), core.fsmonitor, core.excludesFile and core.attributesFile (read from $XDG_CONFIG_HOME when unset), core.autocrlf, core.fileMode (an exec bit is no change; every graph file is 100644), commit.gpgSign. The identity is set in the environment, which beats every key, and GIT_AUTHOR_DATE and GIT_COMMITTER_DATE are removed, so the dates are git's clock. git init runs with --template= and --initial-branch=main. A file is staged as its bytes by one update-index -z --add --remove --stdin over every path of the commit, which runs the conversions the attributes ask for; the repository's info/attributes, which beats every .gitattributes and core.attributesFile, unsets each converting attribute (text, and with it eol, filter, ident, working-tree-encoding), is written at creation and is checked, and written again when it holds anything else, before every staging, and git commit and git status read through it too. A symlinked node file alone is staged through hash-object -w --no-filters, as the bytes a load reads through it. The commit is git commit --cleanup=verbatim, so a comment character cannot strip a trailer. core.fsync=committed puts objects and refs on disk before the journal that would make the commit again is deleted, and core.fsyncMethod=batch (git 2.37) flushes the loose objects of one object transaction, update-index's and git commit's trees, with one hardware flush before any of them gets its name; a git before 2.37 warns, ignores the value and flushes each object on its own; the index, replaced by a rename, is rebuilt from the last commit if a power loss tears it. tests/integration/history.rs sets a user configuration, an environment and a repository configuration against every one of these, and finds each commit the fixed identity with git's dates on main, holding the bytes on disk, with nothing run.
"""
