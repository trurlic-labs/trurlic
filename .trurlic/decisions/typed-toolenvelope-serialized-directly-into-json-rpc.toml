component = "mcp"
choice = "Typed ToolEnvelope serialized directly into JSON-RPC response, single serialization pass"
reason = "A tool result is the typed ToolEnvelope (one TextBlock, an optional isError), whose text holds the payload serialized once by truncate::fit_payload into a buffer that stops at MAX_TOOL_RESULT_BYTES: a payload that fits costs that one serialization, and one that does not is cut and serialized from its cut. The envelope then goes into the response through Body, an untagged enum beside initialize's and tools/list's values, so protocol::write_success serializes the whole response in one pass, with no intermediate serde_json::Value, into the line buffer it writes in one call."
alternatives = [
    "Serialize everything through serde_json::Value intermediate — rejected: double serialization (to_value then to_writer) wastes allocations on the hot path",
    "Custom wire-format writer — rejected: serde_json::to_writer with typed structs is already zero-intermediate-allocation",
]
tags = [
    "performance",
    "protocol",
]
status = "accepted"
