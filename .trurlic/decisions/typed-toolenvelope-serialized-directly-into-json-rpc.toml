component = "mcp"
choice = "Typed ToolEnvelope serialized directly into the JSON-RPC response; its text and its structuredContent come from one fitted value"
reason = "A tool result is the typed ToolEnvelope (one TextBlock, an optional structuredContent, an optional isError). truncate::fit_value fits a payload once: one that fits is serialized into a buffer that stops at MAX_TOOL_RESULT_BYTES and kept as it is, one that does not is cut and the cut value serialized. ToolResult::structured keeps that value with its serialization, and the envelope sends them as structuredContent and the text, so the two cannot differ, cut or not, and no text is parsed back, which also failed for a value nested deeper than a JSON reader reads. The envelope goes into the response through Body, an untagged enum beside initialize's and tools/list's values, so protocol::write_success serializes the whole response in one pass into the line it writes."
alternatives = [
    "Serialize the text, then parse it back for structuredContent: rejected because it parses every result twice, and a parse that fails sent the uncut payload beside a cut text",
    "Serialize everything through a serde_json::Value intermediate: rejected because to_value then to_writer doubles the allocations on the hot path",
]
tags = [
    "performance",
    "protocol",
]
status = "proposed"
created = "2026-06-15T09:45:18.917975440Z"
