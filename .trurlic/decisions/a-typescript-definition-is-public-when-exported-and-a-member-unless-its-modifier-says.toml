component = "code"
choice = "A TypeScript declaration is public when an export holds it or names it, else private; a member is public unless private, # or protected says otherwise; a test call has none"
reason = "A count of definitions with and without private ones needs each one's visibility as the source states it. In a module, export is the visibility: a declaration an export statement holds, one an export list names (export { a, b as c }), one export default or export = names, and in CommonJS one module.exports names, is public; any other declaration of the module's or a namespace's top is private to it. A re-export (export { a } from) names another file's definition and makes nothing here public. A nested function is private. A class member is public unless private, a # name or protected states otherwise; protected is a visibility of its own, since a subclass may name it and no other code. An interface's, a type literal's, an object literal's and an enum's members have no modifier and are public, as the language states. A test is a call, which nothing names from outside, so it has none."
alternatives = [
    "Members as visible as their container: rejected because TypeScript states a member's visibility on the member, public by default",
    "protected as private: rejected because a subclass in another file may name it",
    "Ignore CommonJS exports: rejected because module.exports is how a CommonJS module exports, and its functions would read as private",
]
