component = "code"
choice = "A TypeScript declaration is public when an export holds or names it or an ambient context with no export form holds it, a .d.ts top included; a member is public unless private, # or protected"
reason = "A count of definitions with and without private ones needs each one's visibility as TypeScript reads it. In a module, export is the visibility: a declaration an export statement holds, one an export list, export default or export = names in the body that holds it, and in CommonJS one module.exports names, a class or a function module.exports is, is public; any other declaration of a module's or a namespace's top is private. An ambient context exports every declaration it holds, at any depth, unless its body holds an export declaration or assignment: an export list, export *, export * as, export = or export default of a name. export default class {} declares a class and changes nothing, and a namespace's only such form is an export list. With one, only what an export marks or names is public. The ambient contexts are declare module \"x\", which is public itself since any file imports it by its name, declare namespace, declare global, and a declaration file's top (.d.ts): a script's declarations are global and a module's exported, each read as TypeScript reads an ambient module's body, so a declaration file is a file kind of its own. Each form is checked against tsc. A re-export (export { a } from) names another file's definition. A nested function is private. A class member is public unless private, a # name or protected states otherwise; protected is a visibility of its own. An interface's, a type literal's, an object literal's and an enum's members have no modifier and are public. A test is a call, which nothing names from outside, so it has none."
alternatives = [
    "Members as visible as their container: rejected because TypeScript states a member's visibility on the member, public by default",
    "protected as private: rejected because a subclass in another file may name it",
    "Ignore CommonJS exports: rejected because module.exports is how a CommonJS module exports, and its functions would read as private",
    "Every declaration of an ambient module public: rejected because TypeScript exports only the marked ones once the body holds an export form (declare module \"*.svg\" { const c: string; function f(): void; export default c })",
    "A declaration file's top as a module's: rejected because TypeScript exports each declaration of a .d.ts module that holds no export form, and a script's are global",
]
status = "proposed"
