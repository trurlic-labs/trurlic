component = "lint"
choice = "The lint section judges the [quality] patterns by decision name while their bytes fit MAX_REPORT_PATTERN_BYTES, their caches the page's total, and the page has room; next names where it ended"
reason = "On the lazy DFA alone a pattern's time is the bytes it reads and the states its caches build, so a page bounds both: Bar::pattern_bytes charges each pattern the texts it reads, one byte more per text, as a write charges them, and the patterns of a page share one Scan (Bar::page_scan), whose caches grow within MAX_PATTERN_CACHE_TOTAL_BYTES as a write's do, past it by one search at most. The section holds no lock. The patterns read the decisions in name order, one decision at a time and its patterns in their order, while the sum stays within the bound, the first whatever its bytes, so a walk advances. A cache that gives up on a decision, or caches that pass the total over it, stop the patterns as they stop a write and end the page before that decision, so the next page judges it first over fresh caches. When fresh caches fail on the first decision of a page, its findings before the stop are listed with the stop, a finding at refuse, pattern_gave_up or pattern_cache_total, as a write of it is refused, and the page ends after it. The patterns stop at the decision whose findings reach what a page keeps. A page lists whole the quality findings of the decisions before next, the limits' included; next is the first decision the bytes, a cache or the result's room left. A call with from set to next reads on, so a walk from next to next lists every finding once. A decision whose findings alone pass a page lists those that fit, counts the rest and the page moves on. One thread runs the patterns, so the total is read after every search and nothing depends on the threads."
alternatives = [
    "A wall-clock deadline: rejected because the answer would depend on the machine and its load, and lint reads no clock",
    "Charge bytes times weighed NFA states: rejected because on the lazy DFA alone the cost per byte belongs to the engine, so the weights only overstate an ordinary table",
    "Two cursors, one for the bytes and one for the listing: rejected because a walk following one skips the findings the other left out",
    "Reset a cache that gave up and retry the decision a few times a page, naming in a list apart the decisions a fresh cache gives up on: rejected because ending the page bounds it with less, and a give-up is a finding like any other",
    "One task per pattern over each decision, on the thread pool: rejected because every pattern's caches grow before the total is read, so a page passes it by all the patterns' caches, not by one's",
]
