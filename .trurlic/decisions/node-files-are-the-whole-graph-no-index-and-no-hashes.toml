component = "store"
choice = "The graph is project.toml and the node files alone: no graph.toml index and no per-node hash, so a hand edit needs no rebuild and no re-hash"
reason = """
graph.toml held the edges and a BLAKE3 hash per node, a second copy of what the node files say: every write rewrote it, two branches that each touched one node conflicted on it, a hand edit left it stale until a re-hash, and a lost one took with it the edges no node file held. With every edge in its source file and nothing derived on disk, a load reads the node files and nothing else, a hand edit is a legal write that the next load validates, and version control, not a stored hash, records what changed. A load ignores any other file under .trurlic/, so a leftover graph.toml is inert; the migration removes it.
"""
alternatives = [
    "Keep graph.toml as a cache rebuilt from the node files: rejected because a second representation conflicts across branches and must be kept coherent with every hand edit",
    "Keep per-node hashes for tamper detection: rejected because every hand edit would need a re-hash, and under tracked placement git already records every change",
]
