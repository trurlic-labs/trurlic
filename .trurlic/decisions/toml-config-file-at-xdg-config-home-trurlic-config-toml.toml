[decision]
component = "config"
choice = "TOML config file at XDG_CONFIG_HOME/trurlic/config.toml with 0600 permission enforcement on Unix"
reason = "Configuration uses TOML format at the XDG-standard config path (falling back to ~/.config on Unix, APPDATA on Windows). On Unix, the file must have mode 0600 (owner read/write only) — group or world readable files are rejected with an actionable error message including the chmod fix command. This prevents key leakage via shared accounts, accidental git commits of world-readable files, or misconfigured mounts. All fields are optional so an empty file is valid. Raw TOML content is zeroized immediately after parsing."
alternatives = [
    "JSON or YAML config — TOML is already a project dependency (store uses it) and is more readable for flat key-value config",
    "No permission check, rely on user discipline — too easy to accidentally expose keys on shared systems",
    "Store keys only in environment variables, no config file — forces users to manage env setup per-shell, worse UX for persistent configuration",
]
tags = [
    "security",
    "ergonomics",
]
attribution = "user"
created = "2026-06-15T09:44:28.750655393Z"
