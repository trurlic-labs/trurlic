[decision]
component = "project"
choice = "Module visibility: pub(crate) default, only cli and store are pub"
reason = "Enforced in lib.rs: pub mod cli and pub mod store are the only public modules. All others (commands, config, error, map, mcp, provider, session, workflow) are pub(crate). This ensures the library surface is minimal and internal module boundaries are enforced — external consumers can only access the CLI entry point and the store API."
alternatives = [
    "Make all modules pub for maximum flexibility — rejected because it exposes internal implementation details and makes breaking changes harder to track",
    "Make everything private and only expose a facade module — rejected because cli and store have legitimate external consumers (the binary and potential library users)",
]
tags = ["coding-standards"]
attribution = "user"
created = "2026-06-15T09:47:29.037434435Z"
