[decision]
component = "store"
choice = "Path traversal defense with verify_path rejecting parent-directory components and non-child paths"
reason = "Every write and remove operation calls verify_path() before touching the filesystem. The check rejects paths containing '..' components (preventing traversal like /root/../etc/shadow) and paths that don't start_with the store root. This is defense-in-depth: all store paths are derived from self.root, so the check should never fire in correct code. It guards against programming errors that would write or delete files outside .trurlic/. Control character rejection (has_control_chars) prevents NUL bytes and ANSI escapes from corrupting TOML files."
alternatives = [
    "Canonicalize paths before comparison — rejected: canonicalization follows symlinks, which could resolve to unexpected locations; component-level rejection is more predictable",
    "No path validation, trust internal callers — rejected: a single bug in path construction could delete arbitrary files; defense-in-depth is cheap and critical for a tool that writes to the user's project directory",
]
tags = [
    "security",
    "data-integrity",
]
attribution = "user"
created = "2026-06-15T09:46:15.176073231Z"
