component = "store"
choice = "Every path a commit writes or removes passes verify_path, which refuses a parent-directory component and a path outside the store root"
reason = """
All store paths are derived from the store root, so the check should never fire in correct code; it guards against a programming error that would write or delete a file outside .trurlic/. prepare_write checks each target and commit_batch every write and removal before anything is staged, and replay refuses a journal that names a path outside the store (Error::BadJournal). The check rejects .. components before the prefix test, since starts_with on a path that is not canonical does not stop /root/../etc. Control characters cannot corrupt a node file: the canonical form escapes every control character but tab, and a line break outside a multi-line string.
"""
alternatives = [
    "Canonicalize paths before comparison: rejected because canonicalization follows symlinks, which could resolve to unexpected places; refusing components is predictable",
    "No path check, trusting internal callers: rejected because one bug in path construction could delete arbitrary files, and the check is cheap",
]
tags = [
    "data-integrity",
    "security",
]
