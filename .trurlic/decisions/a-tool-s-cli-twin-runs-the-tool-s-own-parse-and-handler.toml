component = "tools"
choice = "A surface calls a tool by name with Tool::call, a twin its own tool with ToolSpec::run, each finding the store, parsing and running; a twin prints the call's JSON with --json, refusals included"
reason = "Every tool has a CLI twin on the same code, and every surface calls that code. The MCP server looks a call up by name with Tool::named and calls Tool::call. trurlic apply reads a JSON object from a file or stdin, at most budget::MAX_REQUEST_BYTES, the bytes the server reads of one message, its newline not counted, and trurlic status builds its arguments from its flags; each calls its tool's ToolSpec::run, which Tool::call reaches too for a tool built on a spec. Either entry finds the store from the surface's directory, parses the arguments and takes the access, returning the tool's result or its ToolError, so no surface finds a store, parses arguments or runs a handler itself. No layer sits between a surface and the tool, since a shim that only forwards is one more place to drift. commands::answer is the one path both twins print through: lines for a terminal, or with --json commands::json, the text ToolResult fits, as a call's. A refusal's JSON is on stdout too, a store that discovery cannot find or read among them, so the twins cannot differ. trurlic map runs map, a tool no MCP client lists, the same way, through commands::json alone. A document that cannot be read or is no JSON object is invalid_argument, refused before the store is found."
alternatives = [
    "A clap flag per argument of apply: rejected because a batch is a list of tagged ops a command line cannot hold, and the parse would be a second one",
    "Parse the batch in commands with serde: rejected because the refusals and limits would drift from the tool's",
    "Discover the store in each command before the twin: rejected because a failed discovery then leaves the command's path and prints no JSON under --json",
    "A twin module in tools that wraps each tool's run for commands: rejected, it only forwards, and each surface would want one of its own",
]
status = "proposed"
origin = "apply and status"
created = "2026-11-24T03:12:39.892717421Z"
anchors = [
    { file = "src/cli.rs", symbol = "ToolCommand" },
    { file = "src/commands/apply.rs", symbol = "apply" },
    { file = "src/commands/mod.rs", symbol = "answer" },
    { file = "src/commands/mod.rs", symbol = "json" },
    { file = "src/commands/status.rs", symbol = "status" },
    { file = "src/tools/registry.rs", symbol = "Tool::call" },
    { file = "src/tools/spec/tool.rs", symbol = "ToolSpec::run" },
    { file = "tests/integration/apply.rs", symbol = "a_twin_refuses_a_store_it_cannot_find_as_the_call_does" },
    { file = "tests/integration/apply.rs", symbol = "status_on_the_command_line_is_the_tool" },
]
depends_on = [
    "each-tool-declares-its-arguments-once-in-args-declare",
]

