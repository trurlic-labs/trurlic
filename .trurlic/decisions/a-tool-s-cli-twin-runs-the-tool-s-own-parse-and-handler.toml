component = "commands"
choice = "A tool's CLI twin calls the tool's ToolSpec::run, the entry the server's call reaches through the registry, and prints through commands::answer: the call's JSON with --json, every refusal included"
reason = "Every tool has a CLI twin on the same code. trurlic apply reads a JSON object from a file or stdin, at most MAX_REQUEST_BYTES, the size of the request a call arrives in, and trurlic status builds its arguments from its flags; each calls ToolSpec::run, which finds the store from the working directory, parses the arguments and takes the access, as the server's call does through Tool::call, returning the tool's result or its ToolError. No layer sits between a command and the tool, since a shim that only forwards is one more place for the twins to drift. commands::answer is the one path both twins print through: lines for a terminal, or with --json the text ToolResult fits, as a call's, a refusal's JSON on stdout included, a store that discovery cannot find or read among them, so the twins cannot differ again. A document that cannot be read or is no JSON object is invalid_argument, refused before the store is found."
alternatives = [
    "A clap flag per argument of apply: rejected because a batch is a list of tagged ops a command line cannot hold, and the parse would be a second one",
    "Parse the batch in commands with serde: rejected because the refusals and limits would drift from the tool's",
    "Discover the store in each command before the twin: rejected because a failed discovery then left the command's path, printing no JSON under --json",
]
