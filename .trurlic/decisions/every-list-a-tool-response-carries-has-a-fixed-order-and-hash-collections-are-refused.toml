component = "project"
choice = "Every list a tool response carries has a fixed order; std's HashMap and HashSet are refused by lint"
reason = """
Each process seeds its hash collections afresh, so a list built by walking a HashMap or HashSet comes out in a different order in every server: two serve processes on one graph answered get_context with different bytes. Sorting at each output site was a convention a missed sort broke silently, so clippy.toml's disallowed-types refuses std::collections::HashMap and HashSet everywhere, membership sets included: every map and set is a BTreeMap or BTreeSet. ProjectState keys components and decisions by name in BTreeMaps and a decision's tags, anchors and depends_on are BTreeSets, so every query walks them in name order, and a list ordered on another key (get_decisions_for_file by component, then name) sorts stably from that order. tests/integration/determinism.rs requires every read tool, taken from tools/list, to answer with the same bytes in two serve processes, and tests/lints.rs requires the lint to refuse both types.
"""
alternatives = [
    "Sort each response at the MCP boundary: rejected because list order in the nested payloads carries meaning (relevance, priority), so a generic sort would reorder lists ranked on purpose",
    "Fix the hasher seed: rejected because output order would then follow hash values, which change with the hasher or the keys, and still not be an order a reader can predict",
]
