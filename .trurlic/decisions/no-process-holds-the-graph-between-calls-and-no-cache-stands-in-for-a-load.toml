component = "project"
choice = "No process holds the graph between calls and no cache stands in for a load: every call finds the store and parses every node file from disk"
reason = "What a call returns is a function of the files on disk. A server that kept the graph and reloaded it from a file watcher answered, inside the reload window, from the graph before a hand edit, a checkout or another process's commit, and keeping it coherent took a commit counter, an overtaking rule between the watcher and the server's own writes, and a second lock order. So the server holds only the directory it was started in: each call finds the store from it, a read loads with Store::load_state and a write through a Writer, and the next call after any change sees it. A cache of the parsed graph, on disk or in memory, would be a second representation to keep coherent with the node files and would bring back the state between calls, so every load parses every node file until make bench shows the parse is what bounds a call; a change to the load path is benched before and after it on the seeded corpus, since no CI job runs the benches. A binary format for such a cache is a dependency the owner has not approved."
alternatives = [
    "Keep the graph in the server and reload it from a file watcher: rejected, a call inside the reload window answers from the graph before the change, and coherence needs a counter, an overtaking rule and a second lock order",
    "A JSON snapshot of the parsed graph keyed by node hashes: rejected, it needs invalidation against every node file and a fallback path, for a load that is not what bounds a call",
    "A binary serializer cache: rejected, the same coherence cost and a dependency the owner has not approved",
]
