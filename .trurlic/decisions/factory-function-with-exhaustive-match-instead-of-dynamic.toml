[decision]
component = "provider"
choice = "Factory function with exhaustive match instead of dynamic provider registry"
reason = "`create_provider` takes a `ProviderConfig` and returns `Box<dyn LlmProvider>` via an exhaustive match on the `Provider` enum. This is a compile-time-checked factory — adding a new `Provider` variant without a match arm is a compiler error. The function validates configuration eagerly (e.g., Custom/Ollama require a base_url) and fails with a clear error before any network call. No registration mechanism, no string-based lookup, no plugin system."
alternatives = [
    "Dynamic registry with string-based provider lookup — rejected because the set of providers is known at compile time and a registry adds runtime failure modes without benefit",
    "Builder pattern — rejected as unnecessary complexity; ProviderConfig already captures all configuration and the factory is a single function call",
]
tags = [
    "error-handling",
    "correctness",
]
attribution = "user"
created = "2026-06-15T09:45:00.881845303Z"
