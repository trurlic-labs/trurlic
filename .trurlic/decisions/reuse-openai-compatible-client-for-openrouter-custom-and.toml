[decision]
component = "provider"
choice = "Reuse OpenAI-compatible client for OpenRouter, Custom, and Ollama providers"
reason = "OpenRouter, Custom endpoints, and Ollama all speak the OpenAI chat completions API. A single `OpenAiClient` struct with an `ApiVariant` enum handles all four variants (Standard, OpenRouter, Custom, Ollama), differing only in base URL, auth header presence, and extra headers. This avoids duplicating ~100 lines of identical request/response logic per compatible provider. The variant enum controls behavioral differences: Ollama skips the Authorization header, OpenRouter adds referer/title headers."
alternatives = [
    "Separate client struct per provider — rejected because OpenRouter/Custom/Ollama share identical request format and SSE response format, leading to near-total code duplication",
    "Middleware/decorator pattern on a base client — rejected as over-engineered for the small behavioral differences (header presence)",
]
tags = [
    "code-reuse",
    "abstraction",
]
attribution = "user"
created = "2026-06-15T09:44:25.013288174Z"
