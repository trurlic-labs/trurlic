    { file = "src/store/write/history.rs", symbol = "Store::look_for_commit" },
    { file = "src/store/write/history.rs", symbol = "Store::write_blobs" },
    { file = "src/store/write/journal.rs", symbol = "a_history_commit_made_before_the_stop_is_not_made_again" },
    { file = "tests/integration/history.rs", symbol = "a_stopped_write_is_committed_as_it_was_and_removes_no_file_twice" },
]
