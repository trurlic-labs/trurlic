component = "store"
choice = "A shared graph's write first commits, as hand edit, every graph file its last commit does not hold as it is on disk, so the write's own commit holds the write alone"
reason = """
A hand edit is a legal write, so the graph's work tree can hold changes no tool made when a write starts; folded into the write's commit they would carry its Origin. Store::prepare_history runs before the commit point under the exclusive lock: git status over the graph files, and when the branch has a commit and any of them differs, they are staged as they are on disk and committed as \"hand edit\". A failure there leaves the graph as it was. In a repository with no commit yet there is nothing to edit: the write's commit is the first and holds every graph file.
"""
alternatives = [
    "Fold hand edits into the write's commit: rejected because the commit would claim the write's Origin for edits it did not make",
    "Refuse a write while hand edits are uncommitted: rejected because a hand edit is a legal write, and the owner would have to commit by hand before every tool call",
]
