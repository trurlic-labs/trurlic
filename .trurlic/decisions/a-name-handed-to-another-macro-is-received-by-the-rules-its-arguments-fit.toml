component = "code"
choice = "A name a rule hands to a macro is defined as what every rule the hand-off may reach agrees on; a chain adds what each hop gives, at most eight hops, each step computed once per file"
reason = "A crate's front macro often spells no type itself and hands the name to a helper that does (record!([..] $name)), sometimes through $crate:: or a recursive call. A rule's own body gives first: the type keyword right before its binding, and the impls of it. Then come the hand-offs at its top level that carry the binding. A hand-off goes to the macros of its name the invoking file reaches, or through $crate:: to the defining crate's. Its arguments are matched as an invocation's are, a forwarded metavariable by the fragment it binds: a forwarded ident may equal a literal word, a forwarded tt any one tree. The name is defined as what every rule the hand-off may reach agrees on: one kind, the members all give, the items all give. A rule that takes the name as a literal word, or past what lines up, tells nothing of it, so it agrees with no kind. Along a chain each hop adds its members and items, and the first hop that tells a kind gives it. What a binding is defined as through n more hops is a function of the macro, the rule, the place and n, computed once per file. Every rule matched and every member carried is spent from the file's budget, past which the file is refused. A chain stops after eight hand-offs, so a cycle of macros ends."
alternatives = [
    "Fall back to a type keyword of any body of the macro: rejected because the arm a model macro hands to a record helper took another arm's enum and lost the helper's members",
    "A helper defines the first type keyword before any of its metavariables: rejected because pair!($name, Error) made a function name an enum",
    "Union what every rule a hand-off may reach gives: rejected because members only one rule gives became phantoms of the types the other rules make",
    "Resolve each invocation's chain afresh: rejected because a macro of many rules handing a name to itself took tens of seconds a call on a file under the size cap",
]
