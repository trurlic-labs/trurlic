[decision]
component = "commands"
choice = "Every command warns on the consistency issues of the graph it loads; the store's load finishes an interrupted write"
reason = "open_store (read commands) and begin_write (write commands) in commands/mod.rs validate the graph they load and warn on stderr when it has errors, so the user is always informed about graph inconsistencies without blocking their work (warnings go to stderr, not errors). Recovery and the format check are not the commands' job: Store::load_state and Store::begin_write refuse a store in another format before reading anything else in it, and finish a commit an interrupted writer left, so a crash heals on the next command of any kind. serve loads nothing at start, so it checks the format itself."
alternatives = [
    "Only clean on explicit 'trurlic check' — rejected: stale temp files accumulate silently after crashes; users may not run check regularly, and the leaked files waste disk space and could confuse debugging",
    "Fail hard on any consistency issue — rejected: overly strict; many warnings (e.g., hash mismatches from manual edits) are informational and should not block normal workflow operations",
]
tags = [
    "data-integrity",
    "error-handling",
]
attribution = "user"
created = "2026-06-15T09:43:22.612061329Z"

