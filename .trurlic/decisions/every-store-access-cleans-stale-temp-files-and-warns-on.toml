component = "commands"
choice = "Every read command tells of the issues of the graph it loads, status by listing them and query by a warning naming trurlic check; the store's load finishes an interrupted write"
reason = """
status lists the issues of the graph it loads, counted and fitted to the result budget, and open_store in commands/mod.rs loads the graph for query and warns on stderr when it has issues, naming trurlic check, so the user always learns of a broken graph without being blocked: an issue is reported there, and only check fails on one. Recovery and the format check are not the commands' job: Store::load_state and Store::begin_write refuse a store in another format before reading anything else in it, and finish a commit an interrupted writer left, so a crash heals on the next command of any kind. The one exception is a migration stopped before its first rename: project.toml is still in the old format, so every command refuses the store and names trurlic migrate, which finishes the commit. serve checks nothing at start: each tool call loads through the store, so a store in another format, or one whose version does not parse, is refused per call as unsupported_format.
"""
alternatives = [
    "Recover only on an explicit trurlic check: rejected because temp files and unfinished commits would linger after a crash until someone ran it",
    "Fail every command on an issue: rejected because one dangling edge from a hand edit would block status and every read while the files are still readable",
]
