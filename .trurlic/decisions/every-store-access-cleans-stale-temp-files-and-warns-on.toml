[decision]
component = "commands"
choice = "Every command finishes an interrupted write when the lock is free and warns on consistency issues"
reason = "discover_store (called by every command) runs check_version, then Store::try_recover: if no other process holds the exclusive lock, it applies a commit journal an interrupted write left and removes leftover temp files; while the lock is busy it does nothing, because a live commit owns .state/. open_store and open_store_mut additionally call validate() and warn on stderr if errors exist. A crash therefore heals on the next command without ever touching another process's commit, and the user is always informed about graph inconsistencies without blocking their work (warnings go to stderr, not errors). The version check prevents silent corruption from running an incompatible store format."
alternatives = [
    "Only clean on explicit 'trurlic check' — rejected: stale temp files accumulate silently after crashes; users may not run check regularly, and the leaked files waste disk space and could confuse debugging",
    "Fail hard on any consistency issue — rejected: overly strict; many warnings (e.g., hash mismatches from manual edits) are informational and should not block normal workflow operations",
]
tags = [
    "data-integrity",
    "error-handling",
]
attribution = "user"
created = "2026-06-15T09:43:22.612061329Z"

[[decision.code_refs]]
file = "src/commands/mod.rs"
