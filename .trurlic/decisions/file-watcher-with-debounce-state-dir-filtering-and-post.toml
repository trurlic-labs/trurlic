[decision]
component = "store"
choice = "File watcher with debounce, state-dir filtering, and reloads under the shared lock"
reason = "A shared watcher module (store/watcher.rs) watches .trurlic/ recursively via notify::RecommendedWatcher. Events inside .state/ (tmp files, lock, generation) are filtered out: they never change the graph. Events are debounced (configurable duration) to coalesce multi-file operations like git checkout. The reload goes through Store::load_shared: format check and load_state under the shared file lock, so it never reads a commit halfway through its renames, released before the consumer callback runs, because the callback takes the consumer's state write lock and writers take that lock before the file lock, so no thread may hold a file lock while waiting for it. Events that arrive during a reload stay queued and start the next reload, because they may come from a commit that landed after the load; draining them lost such commits until the next unrelated change. A failed reload is logged with the store path and keeps the served state. Before each load the watcher reads the generation the consumer serves; the consumer drops the load only when ProjectState::is_overtaken: its state changed during the load and is newer, i.e. a write of its own server landed after the load. A load that is merely older (the counter reset because .state/ was deleted) is swapped in. WatcherGuard keeps the watcher alive; dropping it stops the watch thread via channel disconnect."
alternatives = [
    "Polling on a timer — rejected: wastes CPU between changes and introduces unnecessary latency (poll interval vs instant notification)",
    "inotify/kqueue directly — rejected: notify crate abstracts platform differences (Linux inotify, macOS FSEvents, Windows ReadDirectoryChanges); direct use would require per-platform code",
    "No file watching, require manual reload — rejected: MCP server and map server must reflect CLI changes in real time without user intervention",
]
tags = [
    "concurrency",
    "reliability",
]
attribution = "user"
created = "2026-06-15T09:45:37.676016131Z"

