component = "code"
choice = "A macro name reaches the invoking file's own macros of it first, else its crate's, else its workspace's exported ones; a name several macros answer defines only what they agree on"
reason = "A macro_rules! macro is in textual scope: one a module defines shadows one of the same name another module defines, for the invocations of that module. A macro_rules! body's invocations are resolved where the macro is invoked, so a hand-off from a crate's macro reaches the invoking file's own helper too. The index reads no order of modules, so it takes the file as the scope. A name reaches that file's own macros of it, else its crate's, else the #[macro_export] macros of its workspace. A name that reaches several macros, two modules' helpers seen from a third file, is defined only as all of them agree, as the candidate rules of one macro are. $crate::name reaches the macros of that name in the crate holding the macro that hands it on. A file an anchor brings from outside the walk reaches its own macros and its crate's alike."
alternatives = [
    "Take the first macro of a name by file path: rejected because a module's own helper lost to a sibling module's, for its invocations and its hand-offs",
    "Follow mod items and #[macro_use] for exact textual scope: rejected because it is a walk of module order for a case the file's own scope already settles",
]
