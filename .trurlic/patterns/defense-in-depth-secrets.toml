[pattern]
name = "defense-in-depth-secrets"
description = "API keys are protected at every layer: wrapped in Zeroizing<String> (zeroed on drop), Display/Debug show only last 4 chars, TLS is pure-Rust (no OpenSSL to leak through), URLs are scrubbed from provider errors, config files require 0600 permissions, and raw TOML content is zeroized after parsing."
