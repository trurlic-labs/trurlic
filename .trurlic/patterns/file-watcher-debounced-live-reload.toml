[pattern]
name = "file-watcher-debounced-live-reload"
description = "Two servers watch .trurlic/ through one store watcher: debounced events, .state/ filtered out, each reload under the shared file lock, and events that arrive during a reload start the next one. MCP debounces 100ms (no interactive UI); the map 50ms and pushes diffs over WebSocket. Each consumer swaps the loaded state in under its write lock, skipping a load that a write of its own server overtook. Watcher failure is non-fatal."
