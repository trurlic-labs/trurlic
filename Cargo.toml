[package]
name = "trurlic"
version = "0.3.2"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["m2papierz@gmail.com"]
repository = "https://github.com/trurlic-labs/trurlic"
readme = "README.md"
description = "Structured architectural decisions that constrain AI code generation"
keywords = ["architecture", "decisions", "mcp", "ai", "code-generation"]
categories = ["command-line-utilities", "development-tools"]
# The tree-sitter runtime is a path dependency (below), which crates.io
# refuses: trurlic installs from its repository or a release binary.
publish = false

# The lib and bin carry no benches: `bench = false` keeps `cargo bench` from
# running their libtest harnesses, which refuse criterion's arguments
# (`--save-baseline`, `--baseline`) passed after `--`.
[[bin]]
name = "trurlic"
path = "src/main.rs"
bench = false

[lib]
name = "trurlic"
path = "src/lib.rs"
bench = false

[[bench]]
name = "corpus"
harness = false
required-features = ["bench"]

[features]
# Test-only: `TRURLIC_FAILPOINT=<site>:<n>` acts at the n-th hit of a
# named site of the store's commit path or the MCP server's tool calls
# (src/store/failpoint.rs): it aborts, pauses, fails, panics or triggers
# there. Enabled only in the test job; release builds never carry it.
failpoints = []
# Bench-only: the seeded corpus (`store::corpus`) and the in-process MCP
# server the benches in benches/ drive. The library's public surface
# stays `cli` and `store` without it.
bench = []

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml  = "1"

# Error handling
thiserror = "2"

# The journal's check that a replay renames the bytes its commit staged
# (pure Rust, no C/OpenSSL dependency)
blake3 = "1"

# Parallel file I/O for load_state
rayon = "1"

# The code index (src/code/): an anchor's symbol is checked against the
# definitions a file holds, with each definition's span and a hash of its
# tokens. tree-sitter parses any bytes into a tree, recovering from syntax
# errors, so an index of a file mid-edit is still a tree of items; a
# hand-rolled Rust scanner would stand on regular expressions over text,
# which cannot tell an item from a word in a string or a comment. The
# grammars are C, compiled by the crate's build script. Without default
# features: `std` adds only debug-graph output and the regex crate's
# literal optimizations, which no query of ours needs. The runtime is
# 0.27.2 vendored with a patch (vendor/tree-sitter-0.27.2-bounds.patch,
# whose head states what it changes): its progress count sees error
# recovery and allocation, and it releases its stack without recursion, so
# a parse is bounded in time, stack and memory. A path dependency with no
# version, so no build can take the unpatched runtime from crates.io.
tree-sitter = { path = "vendor/tree-sitter", default-features = false }
tree-sitter-rust = "0.24"
# Python's grammar for the general resolver, which reads a language from
# its grammar and a query file (src/code/language/python.scm): no Rust
# module per language. Its C parser and scanner are compiled into the
# binary (about 0.5 MB), since a grammar loaded at run time needs `unsafe`
# or a runtime of its own. 0.25 is the newest release, and its ABI 15 is
# one tree-sitter 0.27 reads.
tree-sitter-python = "0.25"
# TypeScript's two grammars for the general resolver: `typescript` reads
# `.ts`, `.mts` and `.cts`, `tsx` reads `.tsx` and every JavaScript file
# (src/code/language/typescript.scm), so JavaScript needs no grammar of
# its own. Their C parsers and scanners add about 3 MB to a binary that
# indexes. 0.23 is the newest release; its ABI 14 is one tree-sitter 0.27
# reads.
tree-sitter-typescript = "0.23"
# C's and C++'s grammars for the general resolver: `c` reads `.c`, `cpp`
# reads `.h`, `.cc`, `.cpp`, `.cxx`, `.hpp` and `.hh`
# (src/code/language/c.scm, cpp.scm). 0.24 and 0.23 are the newest
# releases; their ABIs 15 and 14 are ones tree-sitter 0.27 reads.
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"

# The `[quality]` patterns of project.toml: a project states its decision
# rules as regular expressions, which a hand-rolled matcher would hold to
# a subset with its own edge cases. Every pattern runs on this crate's
# lazy DFA alone (`hybrid`): its time is linear in the bytes it reads,
# and its cache, a value the caller owns and caps, gives up when full
# instead of clearing, so the construction of an automaton is bounded
# too. The `regex` crate hides which engine it runs and falls back to the
# PikeVM, whose time per byte follows the pattern. Unicode classes and
# case folding, since a decision's text is in any script. The crate is in
# the build already through tree-sitter's `regex`; its `hybrid` feature
# gives that `regex` the lazy DFA too, in the release build and in tests
# alike.
regex-automata = { version = "0.4.19", default-features = false, features = ["std", "syntax", "nfa-thompson", "hybrid", "unicode"] }
# The parser regex-automata builds on, for a pattern's syntax tree: what
# translating it will cost (the code points its case-insensitive classes
# fold) is bounded before it is translated, and it is parsed once for both
# directions of its automaton. In the build already, with these features,
# through regex-automata's `syntax` and `unicode`.
regex-syntax = { version = "0.8.12", default-features = false, features = ["std", "unicode"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
tempfile = "3"
# The regex crate the patterns ran on before the lazy DFA alone: a test
# holds the shipped table, rewritten for the lazy DFA, to the findings of
# its first form. With the features tree-sitter's `regex` has in the
# release build, so the tests run tree-sitter's queries on its engines.
regex = { version = "1.13", default-features = false, features = ["unicode"] }

# Invariants a tool can check. Tests opt out of the panicking lints through
# clippy.toml's allow-*-in-tests keys; any other exception is an
# `#[expect(lint, reason = "...")]` at its site, which fails once it stops
# applying.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Production code returns errors; it does not panic.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Under `serve`, stdout carries JSON-RPC: one stray line corrupts the
# stream. `console` and the MCP transport are the only writers.
print_stdout = "deny"
print_stderr = "deny"
disallowed_methods = "deny"
# Every exception names its reason and expires with it.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Hash collections iterate in a per-process order.
disallowed_types = "deny"

# ── Build profiles ─────────────────────────────────────────────────────────────

[profile.dev]
opt-level = 0
debug     = true

[profile.dev.package."*"]
opt-level = 2

[profile.test]
inherits = "dev"

[profile.release]
strip           = true
lto             = "fat"
codegen-units   = 1
overflow-checks = true
# `serve` catches a panic per request, answers it -32603 and keeps serving.
panic           = "unwind"

[profile.bench]
inherits = "release"
strip    = false
debug    = 2
